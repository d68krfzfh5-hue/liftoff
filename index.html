/* ============ coachTips v2 — always lifts you up, never shames ============ */
function coachTips(profile) {
  const tips = [];
  const q = profile.quiz, logs = profile.logs || [];
  if (!logs.length) {
    tips.push({ kind: 'start', icon: 'bolt', title: 'Ready for lift-off', text: 'Your plan is ready. First session: pick weights that feel like you could do 2 more reps at the end of each set — the app takes over from there.' });
    return tips;
  }
  const today = U.todayISO();
  const wkStart = U.weekKey(today);
  const wkEnd = (() => { const d = U.parseISO(wkStart); d.setDate(d.getDate() + 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const lastWkStart = (() => { const d = U.parseISO(wkStart); d.setDate(d.getDate() - 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const thisWeek = logs.filter(l => l.date >= wkStart && l.date < wkEnd).length;
  const lastWeek = logs.filter(l => l.date >= lastWkStart && l.date < wkStart).length;
  const target = profile.plan ? profile.plan.daysPerWeek : 3;
  const wins = recentWins(profile);

  /* --- celebration first, always --- */
  if (thisWeek >= target) {
    tips.push({ kind: 'win', icon: 'award', title: 'Week complete!', text: `${thisWeek}/${target} lifting sessions done. That consistency is exactly what gets results.` });
  } else if (thisWeek > 0) {
    tips.push({ kind: 'progress', icon: 'calendar', title: `${thisWeek} of ${target} lifts done this week`, text: `Every session counts and this week is already moving. ${target - thisWeek} more when life allows.` });
  } else if (lastWeek === 0 && wins.totalWorkouts > 0) {
    // been away — pure warmth, lead with what they've built
    const bits = [];
    if (wins.prs30) bits.push(`${wins.prs30} personal ${U.plural(wins.prs30, 'best')} in the last month${wins.star ? ` — ${wins.star.name} at ${wins.star.w}kg!` : '!'}`);
    else if (wins.totalWorkouts) bits.push(`${wins.totalWorkouts} ${U.plural(wins.totalWorkouts, 'workout')} logged so far.`);
    tips.push({ kind: 'welcome', icon: 'heart', title: 'Good to see you', text: `${bits.join(' ')} Strength doesn’t vanish in a quiet spell — your plan and records are right where you left them, whenever you’re ready.` });
  } else {
    // quiet start to this week — spotlight recent wins, zero pressure
    const bits = [];
    if (wins.prs30) bits.push(`${wins.prs30} new personal ${U.plural(wins.prs30, 'best')}${wins.star ? ` (${wins.star.name} ${wins.star.w}kg!)` : ''}`);
    if (wins.workouts30) bits.push(`${wins.workouts30} ${U.plural(wins.workouts30, 'session')}`);
    if (wins.vol30 > 0) bits.push(`${U.compact(wins.vol30)}kg lifted`);
    tips.push({ kind: 'win', icon: 'spark', title: 'Look at your last 30 days', text: bits.length ? `${bits.join(' · ')}. That progress is in the bank — it’s there whenever you’re ready for more.` : 'Your plan is ready whenever you are. One set is a win.' });
  }

  if (lastWeek === 0 && thisWeek > 0 && wins.totalWorkouts > thisWeek) {
    tips.push({ kind: 'welcome', icon: 'heart', title: 'And you’re back!', text: 'First session after a break is the hardest one — done. Your body remembers everything you’ve built.' });
  }

  const weeks = trainingWeeks(profile);
  if (weeks >= 2) tips.push({ kind: 'streak', icon: 'flame', title: `${weeks}-week streak`, text: 'Back-to-back consistent weeks. Momentum is the real magic.' });

  if (weeks >= 6 && !(profile.flags || {}).deloadSuggested) {
    tips.push({ kind: 'deload', icon: 'moon', title: 'Time for an easy week?', text: `${weeks} solid weeks of training. Taking one lighter week (about 10% less weight, one fewer set per exercise) helps your body catch up and come back stronger.` });
  }

  // sport-aware guidance
  const at = q.athleteType;
  if (at && at !== 'gym') {
    const sched = q.weekSchedule || {};
    const restDays = Object.values(sched).filter(a => a === 'rest').length;
    if (restDays === 0) tips.push({ kind: 'recover', icon: 'bolt', title: 'Seven days on', text: 'A full week of training is impressive. If you ever feel flat, swapping one day to full rest usually makes every other day better.' });
  }

  // muscle balance — framed as "topping up", never as neglect
  const from = daysAgoISO(7);
  const sets = weeklySets(profile, from, '9999');
  const [lo] = EXPERIENCE[q.experience].weeklySetTarget;
  const relevant = ['quads', 'glutes', 'back', 'chest', 'shoulders'];
  const low = relevant.filter(g => sets[g] < lo * 0.5).map(g => GROUP_LABELS[g]);
  if (low.length && logs.length >= 4 && thisWeek >= Math.min(2, target)) {
    tips.push({ kind: 'balance', icon: 'scale', title: `${low.join(' & ')} could use some attention`, text: `${low.join(' and ')} ${low.length > 1 ? 'have' : 'has'} had a quieter week. Your next session that includes ${low.length > 1 ? 'them' : 'it'} tops everything back up.` });
  }

  // stalls → options, warmly
  for (const [exId, st] of Object.entries(profile.exState || {})) {
    const ex = EX_BY_ID[exId]; if (!ex || ex.bw || ex.timed) continue;
    const h = st.history.slice(-4);
    if (h.length >= 4 && h.every(x => x.e1rm <= h[0].e1rm) && st.fails >= 1) {
      const alts = alternativesFor(profile, exId).slice(0, 2).map(a => a.name);
      tips.push({ kind: 'stall', icon: 'refresh', title: `${ex.name} is having a plateau moment`, text: `Totally normal — every lifter hits these. Two good options: drop the weight ~10% and rebuild with crisp reps, or rotate in ${alts.join(' or ') || 'a similar movement'} for a few weeks.` });
      break;
    }
  }

  if (profile.plan && profile.plan.createdAt && U.daysBetween(profile.plan.createdAt, today) > 56) {
    tips.push({ kind: 'refresh', icon: 'spark', title: 'Fancy a fresh block?', text: 'This plan is 8+ weeks old. Regenerating gives you fresh exercises and a new stimulus — your strength records carry over.' });
  }

  const EDU_BASE = [
    { icon: 'moon', title: 'Muscles grow between sessions', text: 'Aim for 7–9 hours of sleep — it’s the most underrated part of the plan.' },
    { icon: 'egg', title: 'Protein check', text: 'Roughly 1.6–2g of protein per kg of bodyweight per day supports muscle growth and recovery.' },
    { icon: 'ruler', title: 'Progress isn’t only the scale', text: 'Reps, weights, energy, sleep — strength gains here are progress you can see week to week.' },
    { icon: 'target', title: 'Leave 1–2 in the tank', text: 'Most sets should end feeling like you had 1–2 clean reps left. Grinding to failure every set slows you down.' },
  ];
  const EDU_SPORT = [
    { icon: 'bolt', title: 'Hard days hard, easy days easy', text: 'Stacking your toughest lift next to your toughest sport day (with easy days between) beats spreading medium effort everywhere.' },
    { icon: 'spark', title: 'Fuel the work', text: 'On big sport days, carbs before and protein after make the next day’s session feel completely different.' },
  ];
  const EDU = (at && at !== 'gym') ? EDU_BASE.concat(EDU_SPORT) : EDU_BASE;
  tips.push({ kind: 'edu', ...EDU[logs.length % EDU.length] });
  return tips;
}

/* ---------- plate maths (per side) ---------- */
function plateBreakdown(totalKg, barKg) {
  const perSide = (totalKg - barKg) / 2;
  if (perSide <= 0) return null;
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25, 0.5];
  let rem = perSide; const used = [];
  for (const p of plates) { while (rem >= p - 1e-9) { used.push(p); rem = Math.round((rem - p) * 100) / 100; } }
  if (!used.length) return null;
  return { perSide: Math.round(perSide * 100) / 100, plates: used, exact: rem < 1e-9 };
}

/* ---------- warm-up ramp for the first heavy compound ---------- */
function warmupFor(prof, entry) {
  const ex = EX_BY_ID[entry.exId];
  if (!ex || ex.bw || ex.timed || ex.cat !== 'compound') return null;
  const w = entry.sets[0] && entry.sets[0].w;
  if (!w || w < 20) return null;
  const r = v => U.round(v, 2.5);
  const sets = [{ w: r(w * 0.5), reps: 8, done: false }, { w: r(w * 0.75), reps: 4, done: false }];
  if (sets[0].w >= w || sets[1].w >= w) return null;
  return sets;
}

/* ---------- time-crunched session trimming ---------- */
function estMinutesFor(exs) {
  let s = 6;
  for (const pe of exs) s += pe.sets * ((pe.rest || 60) + 40) / 60;
  return Math.round(s);
}
function trimSession(exercises, targetMin) {
  // keep plan order (compounds first); take exercises while they fit, then shave isolation sets
  let list = [];
  for (const pe of exercises) {
    const trial = list.concat([JSON.parse(JSON.stringify(pe))]);
    if (estMinutesFor(trial) <= targetMin || list.length === 0) list = trial;
  }
  let guard = 12;
  while (estMinutesFor(list) > targetMin && guard--) {
    const cand = [...list].reverse().find(pe => pe.sets > 2 && pe.slotType !== 'comp') || [...list].reverse().find(pe => pe.sets > 2);
    if (!cand) break;
    cand.sets -= 1;
  }
  return { exercises: list, est: estMinutesFor(list), dropped: exercises.length - list.length };
}

/* ---------- deload (easy) week ---------- */
function deloadActive(prof, dateISO) {
  return !!(prof.flags && prof.flags.deloadWeek && prof.flags.deloadWeek === U.weekKey(dateISO || U.todayISO()));

  prof.flags.deloadWeek = U.weekKey(U.todayISO());

  t.deload = true;

}

/* ---------- muscle recovery map: how worked is each muscle right now? ---------- */
function muscleFreshness(prof) {
  const today = U.todayISO();
  const decay = [1, 0.62, 0.34, 0.13]; // today, yesterday, 2 days, 3 days ago
  const vals = {};
  const bump = (m, amt) => { vals[m] = (vals[m] || 0) + amt; };
  for (const log of (prof.logs || []).slice(-14)) {
    const d = U.daysBetween(log.date, today);
    if (d < 0 || d > 3) continue;
    const k = decay[d];
    for (const e of log.entries) {
      const ex = EX_BY_ID[e.exId]; if (!ex) continue;
      const load = Math.min(1.4, e.sets.length / 3);
      for (const m of ex.m.p) bump(m, load * k);
      for (const m of ex.m.s) bump(m, 0.45 * load * k);
    }
  }
  // sport sessions load their muscles too
  for (const sp of (prof.sportLogs || []).slice(-10)) {
    const d = U.daysBetween(sp.date, today);
    if (d < 0 || d > 2) continue;
    const k = decay[d] * 0.5;
    const legs = ['quads', 'hamstrings', 'calves', 'glutes'];
    const swim = ['shoulders', 'lats', 'triceps', 'core'];
    for (const m of (sp.act === 'swim' ? swim : legs)) bump(m, k);
  }
  for (const m of Object.keys(vals)) {
    if (!MUSCLES[m]) { delete vals[m]; continue; }
    vals[m] = Math.min(1, vals[m] / 1.6);
  }
  return vals;
}
function freshnessSummary(vals) {
  const g = {};
  for (const [m, v] of Object.entries(vals)) {
    const grp = (MUSCLES[m] || {}).group; if (!grp) continue;
    g[grp] = Math.max(g[grp] || 0, v);
  }
  const fresh = [], working = [];
  for (const grp of MUSCLE_GROUPS) ((g[grp] || 0) < 0.25 ? fresh : working).push(GROUP_LABELS[grp] || grp);
  return { fresh, working };
}

/* ---------- records vault: everything she's ever lifted, mined ---------- */
function exerciseRecords(prof, exId) {

  const hist = ((prof.exState || {})[exId] || {}).history || [];
  let bestSet = null, bestVol = null, bestE = null, bestHold = null;
  const repMax = { 1: null, 3: null, 5: null, 10: null };
  const timeline = [];
  let peak = 0;
  for (const log of prof.logs || []) {
    for (const e of log.entries) {
      if (e.exId !== exId) continue;
      let vol = 0, top = 0;
      for (const s of e.sets) {
        const w = s.w || 0; if (!s.reps) continue;
        if (ex && ex.timed) { if (!bestHold || s.reps > bestHold.sec) bestHold = { sec: s.reps, date: log.date }; continue; }
        vol += w * s.reps;
        if (w > top) top = w;
        if (w > 0) {
          const e1 = e1rm(w, s.reps);
          if (!bestE || e1 > bestE.v) bestE = { v: Math.round(e1 * 10) / 10, date: log.date };
          if (!bestSet || w > bestSet.w || (w === bestSet.w && s.reps > bestSet.reps)) bestSet = { w, reps: s.reps, date: log.date };
          for (const n of [1, 3, 5, 10]) if (s.reps >= n && (!repMax[n] || w > repMax[n].w)) repMax[n] = { w, reps: s.reps, date: log.date };

      daysPerWeek: prof.plan.daysPerWeek,
      days: (prof.plan.days || []).map(d => ({ name: d.name, focus: d.focus || null, note: d.note || '', exercises: (d.exercises || []).map(packPe) })),
    } : null,
    logs: (prof.logs || []).filter(l => l.date >= cut).slice(-45).map(l => ({
      date: l.date, dayName: l.dayName, durationMin: l.durationMin,
      react: l.react || null, note: l.note ? String(l.note).slice(0, 200) : null,
      entries: (l.entries || []).map(e => ({ exId: e.exId, sets: (e.sets || []).map(s => ({ w: s.w || 0, reps: s.reps || 0 })) })),
    })),
    msgReact: prof.coachMsgReact || null,
    dayMoves: ownDayMoves(prof, 'athlete'), // her this-week reschedules/skips, for the coach
    sportLogs: (prof.sportLogs || []).filter(s => s.date >= cut).slice(-90),
    prs: prof.prs || {},
    exTop,
    bodyLogs: (prof.bodyLogs || []).slice(-20),
    badges: prof.badges || {},
    totals: { workouts: (prof.logs || []).length, since: prof.createdAt },
    program: prof.program || null,
    appliedPlanRev: prof.coachSync ? (prof.coachSync.appliedPlanRev || 0) : 0,
  };
}

/* ---------- sync engine (runs over every profile, not just the active one) ---------- */
async function athleteSyncTick(prof, force) {
  const cs = prof.coachSync; if (!cs) return false;
  let changed = false;
  if (cs.pendingProgress) {
    const rev = await syncRpc('lo_push_progress', { p_key: cs.key, p_doc: buildProgressDoc(prof) });
    if (rev != null) { cs.pendingProgress = false; cs.lastPushAt = Date.now(); changed = true; }
  }
  const revs = await syncRpc('lo_revs', { p_key: cs.key });
  if (!revs) { cs.lastErr = 'pair-missing'; return changed; } // coach ended it or key wrong
  cs.lastErr = null;
  if (revs.coach) cs.coachName = revs.coach;
  const applied = cs.appliedPlanRev || 0;
  const pendingRev = prof.pendingCoachPlan ? prof.pendingCoachPlan.rev : 0;
  if (revs.planRev > applied && revs.planRev !== pendingRev) {
    const full = await syncRpc('lo_pull', { p_key: cs.key });
    if (full && full.plan) {
      prof.pendingCoachPlan = { rev: full.planRev, doc: full.plan, at: full.planAt };
      changed = true;
    }
  }
  cs.lastSyncAt = Date.now();
  return changed;
}

async function coachSyncTick(prof, force) {
  const co = prof.coachOf; if (!co) return false;
  let changed = false;
  if (co.pendingPlanPush || force === 'push') {
    const rev = await syncRpc('lo_push_plan', { p_key: co.key, p_doc: buildPlanDoc(prof) });
    if (rev != null) {
      co.pendingPlanPush = false; co.lastPlanRev = rev; co.lastPushedJson = JSON.stringify(buildPlanDoc(prof));
      co.lastPushAt = Date.now(); changed = true;
    }
  }
  const revs = await syncRpc('lo_revs', { p_key: co.key });
  if (!revs) { co.lastErr = 'pair-missing'; return changed; }
  co.lastErr = null;
  if (revs.progressRev > (co.progressRev || 0)) {
    const full = await syncRpc('lo_pull', { p_key: co.key });
    if (full && full.progress) {
      co.progress = full.progress; co.progressRev = full.progressRev; co.progressAt = full.progressAt;
      // her reschedules land in the workspace so "their week" reads true. Her entries
      // are by:'athlete', so the coach's outgoing plan doc (coach-only) is untouched
      // and this never re-triggers a plan push by itself.
      mergeDayMoves(prof, full.progress.dayMoves);
      // first contact: adopt her setup so the editor works with HER kit and goals
      if (!co.adoptedQuiz && full.progress.quiz) {
        const q = full.progress.quiz;
        for (const k of ['goal', 'experience', 'daysPerWeek', 'sessionMinutes', 'equipment', 'focus', 'athleteType', 'sportLabel', 'weekSchedule', 'videoPref', 'bodySex'])
          if (q[k] != null) prof.quiz[k] = q[k];
        prof.units = full.progress.units || prof.units;
        co.adoptedQuiz = true;
      }
      changed = true;
    }
  }
  co.athleteRev = revs.planRev; // what the server holds
  co.lastSyncAt = Date.now();
  return changed;
}

let _syncBusy = false;
async function syncTick(force) {
  if (_syncBusy || !App.data || !App.data.profiles) return;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const now = Date.now();
  if (!force && App._lastSyncTry && now - App._lastSyncTry < 60000) return;
  App._lastSyncTry = now;
  _syncBusy = true;
  let changed = false;
  try {
    for (const prof of Object.values(App.data.profiles)) {
      try {
        if (prof.isCoach && prof.coachOf) changed = (await coachSyncTick(prof, force)) || changed;
        else if (prof.coachSync) changed = (await athleteSyncTick(prof, force)) || changed;
      } catch (e) {
        const t = prof.coachOf || prof.coachSync;
        if (t) t.lastErr = 'offline';
      }
    }
  } finally { _syncBusy = false; }
  if (changed) { saveApp(); if (!App.workout) render(); }
}

/* mark the coach workspace dirty whenever its plan/notes/customs change */
function coachMaybeDirty(prof) {
  if (!prof || !prof.isCoach || !prof.coachOf) return;
  const j = JSON.stringify(buildPlanDoc(prof));
  if (j !== prof.coachOf.lastPushedJson) {
    prof.coachOf.pendingPlanPush = true;
    clearTimeout(App._coachPushT);
    App._coachPushT = setTimeout(() => syncTick(true), 2500);
  }
}

function syncStatusLine(t) { // shared little status formatter
  if (!t) return '';
  if (t.lastErr === 'pair-missing') return 'pairing not found — re-check the code';
  if (t.pendingPlanPush || t.pendingProgress) return navigator.onLine === false ? 'offline — will send when back online' : '↻ sending…';
  if (t.lastSyncAt) {
    const m = Math.round((Date.now() - t.lastSyncAt) / 60000);
    return m < 1 ? '✓ synced just now' : m < 60 ? `✓ synced ${m} min ago` : `✓ synced ${Math.round(m / 60)}h ago`;
  }
  return '';
}

if (typeof module !== 'undefined') module.exports = Object.assign(module.exports || {}, {
  makePairKey, fmtPairKey, normalizePairKey, packPe, sanitizePe,
  buildPlanDoc, applyPlanDoc, buildProgressDoc,
});


/* ============ LiftOff — SVG charts (line, bars, sparkline) ============
   Colors follow the validated categorical palette: slot1 #2a78d6, slot2 #eb6834.
   2px lines, ≥8px end markers with surface ring, hairline grid, text in ink tokens.
*/
'use strict';

const Charts = (() => {
  // resolve palette from :root tokens (var() can't be used in SVG presentation
  // attributes, so read the computed values once — keeps charts on the design system)
  const tok = (name, fallback) => {
    try { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }
    catch (e) { return fallback; }
  };
  let C1, C2, GRID, AXIS, INKM;
  function refreshPal() { C1 = tok('--chart1', '#252A31'); C2 = tok('--chart2', '#5B6B82'); GRID = tok('--chart-grid', 'rgba(37,42,49,.10)'); AXIS = tok('--chart-axis', '#858B96'); INKM = AXIS; }
  refreshPal();

  function niceTicks(min, max, n) {
    if (min === max) { min = Math.max(0, min - 1); max = max + 1; }
    const span = max - min, step0 = span / (n - 1);
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
    return out;
  }

  /* line chart with 1-2 series. series: [{label, pts:[{x(label), y}], color}] */
  function line(series, opts) {
    refreshPal();
    const W = (opts && opts.w) || 340, H = (opts && opts.h) || 190;
    const padL = 34, padR = 14, padT = 14, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const all = series.flatMap(s => s.pts.map(p => p.y));
    if (!all.length) return `<div class="chart-empty">Log a few sessions and the chart appears here</div>`;
    const n = Math.max(...series.map(s => s.pts.length));
    const ticks = niceTicks(Math.min(...all) * 0.95, Math.max(...all) * 1.05, 4);
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = i => padL + (n === 1 ? iw / 2 : i / (n - 1) * iw);
    const Y = v => padT + ih - (v - y0) / (y1 - y0 || 1) * ih;
    let g = '';
    for (const t of ticks) g += `<line x1="${padL}" y1="${Y(t)}" x2="${W - padR}" y2="${Y(t)}" stroke="${GRID}" stroke-width="1"/>
      <text x="${padL - 6}" y="${Y(t) + 3}" text-anchor="end" class="ch-tick">${t}</text>`;
    let body = '', dots = '', hover = '';
    series.forEach((s, si) => {
      const col = s.color || (si === 0 ? C1 : C2);
      const pts = s.pts.map((p, i) => [X(i), Y(p.y)]);
      if (!pts.length) return;
      const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      if (si === 0 && pts.length > 1) body += `<path d="${path} L ${pts[pts.length - 1][0]} ${padT + ih} L ${pts[0][0]} ${padT + ih} Z" fill="${col}" opacity="0.08"/>`;
      body += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = pts[pts.length - 1];
      dots += `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    });
    // touch targets → tooltip
    const s0 = series[0];
    s0.pts.forEach((p, i) => {
      const vals = series.map((s, si) => s.pts[i] ? `${s.label}: <b>${s.pts[i].y}</b>` : '').filter(Boolean).join('<br>');
      hover += `<rect x="${X(i) - iw / (2 * Math.max(n - 1, 1))}" y="${padT}" width="${iw / Math.max(n - 1, 1)}" height="${ih}" fill="transparent"
        class="ch-hit" data-tip="${U.esc(p.x)}|${U.esc(vals)}" data-cx="${X(i).toFixed(0)}"/>`;
    });
    const xl = s0.pts[0], xr = s0.pts[s0.pts.length - 1];
    const legend = series.length > 1 ? `<div class="ch-legend">${series.map((s, si) =>
      `<span class="ch-key"><i style="background:${s.color || (si === 0 ? C1 : C2)}"></i>${U.esc(s.label)}</span>`).join('')}</div>` : '';
    return `${legend}<div class="ch-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart">
      ${g}
      <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="${AXIS}" stroke-width="1"/>
      ${body}${dots}
      <text x="${padL}" y="${H - 8}" class="ch-tick">${U.esc(xl ? xl.x : '')}</text>
      <text x="${W - padR}" y="${H - 8}" text-anchor="end" class="ch-tick">${U.esc(xr ? xr.x : '')}</text>
      ${hover}
    </svg><div class="ch-tip" hidden></div></div>`;
  }

  /* vertical bars with optional target band. items: [{label, value}] */
  function bars(items, opts) {
    refreshPal();
    const W = (opts && opts.w) || 340, H = (opts && opts.h) || 180;
    const padL = 26, padR = 8, padT = 12, padB = 24;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = Math.max(...items.map(i => i.value), (opts && opts.band ? opts.band[1] : 0), 4) * 1.15;
    const ticks = niceTicks(0, max, 3);
    const y1 = ticks[ticks.length - 1];
    const Y = v => padT + ih - v / y1 * ih;
    const bw = Math.min(24, iw / items.length * 0.55);
    let g = '', bars = '';
    for (const t of ticks) if (t > 0) g += `<line x1="${padL}" y1="${Y(t)}" x2="${W - padR}" y2="${Y(t)}" stroke="${GRID}"/>
      <text x="${padL - 5}" y="${Y(t) + 3}" text-anchor="end" class="ch-tick">${t}</text>`;
    let band = '';
    if (opts && opts.band) {
      band = `<rect x="${padL}" y="${Y(opts.band[1])}" width="${iw}" height="${Y(opts.band[0]) - Y(opts.band[1])}" fill="#1baf7a" opacity="0.10"/>
        <text x="${W - padR - 2}" y="${Y(opts.band[1]) + 10}" text-anchor="end" class="ch-band">target</text>`;
    }
    items.forEach((it, i) => {
      const cx = padL + (i + 0.5) / items.length * iw;
      const h = Math.max(0, Y(0) - Y(it.value));
      const y = Y(it.value);
      bars += `<path d="M ${cx - bw / 2} ${Y(0)} L ${cx - bw / 2} ${y + 4} Q ${cx - bw / 2} ${y} ${cx - bw / 2 + 4} ${y} L ${cx + bw / 2 - 4} ${y} Q ${cx + bw / 2} ${y} ${cx + bw / 2} ${y + 4} L ${cx + bw / 2} ${Y(0)} Z" fill="${C1}"/>` +
        (it.value > 0 ? `<text x="${cx}" y="${y - 4}" text-anchor="middle" class="ch-val">${it.value}</text>` : '') +
        `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="ch-tick">${U.esc(it.label)}</text>`;
    });
    return `<div class="ch-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart">
      ${band}${g}
      <line x1="${padL}" y1="${Y(0)}" x2="${W - padR}" y2="${Y(0)}" stroke="${AXIS}"/>
      ${bars}
    </svg></div>`;
  }

  function spark(values, opts) {
    refreshPal();
    const W = 72, H = 26;
    if (!values || values.length < 2) return '';
    const min = Math.min(...values), max = Math.max(...values);
    const X = i => 3 + i / (values.length - 1) * (W - 6);
    const Y = v => 3 + (H - 6) * (1 - (v - min) / (max - min || 1));
    const path = values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const col = (opts && opts.color) || C1;
    return `<svg viewBox="0 0 ${W} ${H}" class="spark"><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${X(values.length - 1)}" cy="${Y(values[values.length - 1])}" r="3" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
  }

  /* attach tap-tooltips inside a container that holds .ch-wrap */
  function bindTips(root) {
    root.querySelectorAll('.ch-wrap').forEach(wrap => {
      const tip = wrap.querySelector('.ch-tip'); if (!tip) return;
      wrap.querySelectorAll('.ch-hit').forEach(hit => {
        const show = e => {
          e.preventDefault();
          const [title, vals] = hit.dataset.tip.split('|');
          tip.innerHTML = `<div class="ch-tip-t">${title}</div>${vals}`;
          tip.hidden = false;
          const rect = wrap.getBoundingClientRect();
          const svg = wrap.querySelector('svg'); const sr = svg.getBoundingClientRect();
          const frac = (+hit.dataset.cx) / svg.viewBox.baseVal.width;
          let x = sr.left - rect.left + frac * sr.width - tip.offsetWidth / 2;
          x = U.clamp(x, 4, rect.width - tip.offsetWidth - 4);
          tip.style.left = x + 'px'; tip.style.top = '6px';
        };
        hit.addEventListener('pointerdown', show);
      });
      wrap.addEventListener('pointerleave', () => { tip.hidden = true; });
    });
  }

  return { line, bars, spark, bindTips };
})();


/* ============ LiftOff — app state & persistence ============ */
'use strict';

const APP_VERSION = '3.14.0';

const App = {
  data: null,          // { version, activeProfileId, profiles: {} }
  view: 'today',       // today | plan | library | progress | profile
  workout: null,       // in-progress workout (also persisted inside profile.activeWorkout)
  restTimer: null,     // {remaining, total, interval}
  libFilter: { q: '', group: '', equip: '' },
  chartEx: null,
  onboarding: null,    // quiz state while creating a profile
};

function defaultData() { return { version: 1, activeProfileId: null, profiles: {} }; }

function loadApp() {
  App.data = Store.load() || defaultData();
  App.storeRestored = Store.restored;
  if (!App.data.profiles) App.data.profiles = {};
  if (!App.data.coachLib) App.data.coachLib = { weeks: [], days: [] };
  const prevVer = App.data.appVersion;
  const updating = prevVer !== APP_VERSION && Object.keys(App.data.profiles).length > 0;
  if (updating) {
    // snapshot the pre-update state so any migration problem is recoverable
    try {
      localStorage.setItem('liftoff.v1.pre', JSON.stringify(App.data));
      localStorage.setItem('liftoff.v1.prever', prevVer || '?');
    } catch (e) { /* best effort */ }
  }
  for (const p of Object.values(App.data.profiles)) {
    try { migrateProfile(p); } catch (e) { /* never let one profile block boot — raw data stays as-is */ }
  }
  // version-change detection: reassure that data survived the update
  App.justUpdated = !!(prevVer && updating);
  if (App.data.appVersion !== APP_VERSION) { App.data.appVersion = APP_VERSION; saveApp(); }
  if (App.storeRestored) saveApp(); // heal the main key immediately from the recovered state
  const p = activeProfile();
  // restore an in-flight workout — but a PAUSED one stays paused (Today shows the resume card)
  if (p && p.activeWorkout && !p.activeWorkout.pausedAt) App.workout = p.activeWorkout;
  applyTheme();
}

/* ============ appearance: light / dark / system ============ */
function currentTheme() { try { return localStorage.getItem('liftoff.theme') || 'system'; } catch (e) { return 'system'; } }
function themeIsDark(t) { t = t || currentTheme(); try { return t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return t === 'dark'; } }
function applyTheme(t) {
  t = t || currentTheme();
  try { localStorage.setItem('liftoff.theme', t); } catch (e) {}
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', themeIsDark(t) ? '#191B1F' : '#E9EBEE');
}
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (currentTheme() === 'system') { applyTheme('system'); if (!App.workout) render(); }
  });
} catch (e) {}

let _saveT = null;
function saveApp() {
  const _cp = activeProfile();
  if (_cp && _cp.isCoach && typeof coachMaybeDirty === 'function') coachMaybeDirty(_cp);
  if (_saveT) clearTimeout(_saveT);
  _saveT = setTimeout(() => {
    Store.save(App.data); _saveT = null;
    if (Store.full && !App._quotaWarned && typeof toast === 'function') {
      App._quotaWarned = true;
      toast('Phone storage is full — changes may not save. Export a backup from Profile.', 5000);
    }
  }, 120);
}

function activeProfile() {
  return App.data && App.data.activeProfileId ? App.data.profiles[App.data.activeProfileId] : null;
}

function createProfile(quiz) {
  const id = U.uid();
  const prof = {
    id, name: quiz.name || 'Athlete', emoji: quiz.emoji || '', createdAt: U.todayISO(),
    units: quiz.units || 'kg',
    quiz: {
      goal: quiz.goal, experience: quiz.experience,
      athleteType: quiz.athleteType || 'gym', sportLabel: quiz.sportLabel || '',
      weekSchedule: quiz.weekSchedule || scheduleFromDays(quiz.daysPerWeek || 3),
      daysPerWeek: quiz.weekSchedule ? Math.max(1, liftDaysOf(quiz.weekSchedule).length) : (quiz.daysPerWeek || 3),
      sessionMinutes: quiz.sessionMinutes, equipment: quiz.equipment, focus: quiz.focus || [],
      videoPref: quiz.videoPref || 'auto', bodySex: quiz.bodySex === 'male' ? 'male' : 'female',
    },
    planCount: 0, plan: null, logs: [], sportLogs: [], exState: {}, prs: {}, flags: {}, program: { n: 1, start: U.weekKey(U.todayISO()) },
    customWorkouts: [], customMap: {}, savedPlans: [], activeWorkout: null,
  };
  prof.plan = generatePlan(prof);
  App.data.profiles[id] = prof;
  App.data.activeProfileId = id;
  saveApp();
  return prof;
}

function regeneratePlan(prof, newQuiz) {
  if (newQuiz) prof.quiz = Object.assign({}, prof.quiz, newQuiz);
  if (prof.quiz.weekSchedule) prof.quiz.daysPerWeek = Math.max(1, liftDaysOf(prof.quiz.weekSchedule).length);
  prof.planCount = (prof.planCount || 0) + 1;
  prof.plan = generatePlan(prof);
  prof.flags.deloadSuggested = false;
  startNewProgram(prof);
  saveApp();
}

/* ---- saved weekly plans (named templates the user can reload) ---- */
function savedPlans(prof) { return prof.savedPlans || (prof.savedPlans = []); }
function saveCurrentPlan(prof, name) {
  if (!prof.plan) return null;
  const entry = {
    id: U.uid(),
    name: (name || '').trim() || prof.plan.splitName || 'My plan',
    createdAt: U.todayISO(),
    splitName: prof.plan.splitName,
    goal: prof.plan.goal,
    daysPerWeek: prof.plan.daysPerWeek,
    days: JSON.parse(JSON.stringify(prof.plan.days)),
    weekSchedule: JSON.parse(JSON.stringify(prof.quiz.weekSchedule || {})),
  };
  savedPlans(prof).unshift(entry);
  saveApp();
  return entry;
}
function loadSavedPlan(prof, id) {
  const sp = savedPlans(prof).find(x => x.id === id);
  if (!sp) return false;
  prof.plan = prof.plan || {};
  prof.plan.days = JSON.parse(JSON.stringify(sp.days));
  if (sp.splitName) prof.plan.splitName = sp.splitName;
  if (sp.goal) prof.plan.goal = sp.goal;
  prof.plan.daysPerWeek = sp.daysPerWeek || sp.days.length;
  if (sp.weekSchedule && Object.keys(sp.weekSchedule).length) prof.quiz.weekSchedule = JSON.parse(JSON.stringify(sp.weekSchedule));

function deleteSavedPlan(prof, id) {
  prof.savedPlans = savedPlans(prof).filter(x => x.id !== id);

}

/* ---- coach template library (shared across all clients; lives on App.data, never syncs to athletes) ---- */
function coachLib() {
  if (!App.data.coachLib) App.data.coachLib = { weeks: [], days: [] };
  App.data.coachLib.weeks = App.data.coachLib.weeks || [];
  App.data.coachLib.days = App.data.coachLib.days || [];

}
function saveWeekTemplate(prof, name) {
  if (!prof.plan) return null;

    id: U.uid(), name: (name || '').trim() || prof.plan.splitName || 'Week template', createdAt: U.todayISO(),
    splitName: prof.plan.splitName, goal: prof.plan.goal, daysPerWeek: prof.plan.daysPerWeek,
    days: JSON.parse(JSON.stringify(prof.plan.days)),
    weekSchedule: JSON.parse(JSON.stringify(prof.quiz.weekSchedule || {})),
  };
  coachLib().weeks.unshift(e); saveApp(); return e;
}
function applyWeekTemplate(prof, id) {
  const w = coachLib().weeks.find(x => x.id === id); if (!w) return false;
  prof.plan = prof.plan || {};
  prof.plan.days = JSON.parse(JSON.stringify(w.days));
  if (w.splitName) prof.plan.splitName = w.splitName;
  if (w.goal) prof.plan.goal = w.goal;
  prof.plan.daysPerWeek = w.daysPerWeek || w.days.length;
  if (w.weekSchedule && Object.keys(w.weekSchedule).length) prof.quiz.weekSchedule = JSON.parse(JSON.stringify(w.weekSchedule));
  prof.plan.dayMap = assignDayMap(prof.plan, prof.quiz.weekSchedule);
  prof.plan.nextDayIdx = 0;
  startNewProgram(prof);
  saveApp(); // coachMaybeDirty (in saveApp) pushes the new week + program bump to the client
  return true;
}
function deleteWeekTemplate(id) { coachLib().weeks = coachLib().weeks.filter(x => x.id !== id); saveApp(); }

function saveDayTemplate(name, day) {
  if (!day || !day.exercises || !day.exercises.length) return null;
  const e = {
    id: U.uid(), name: (name || '').trim() || day.name || 'Day template', createdAt: U.todayISO(),
    note: day.note || '', exercises: JSON.parse(JSON.stringify(day.exercises)),
  };
  coachLib().days.unshift(e); saveApp(); return e;
}
function insertDayTemplate(prof, id) { // materialise a saved day into this client's custom workouts (ready to assign)
  const t = coachLib().days.find(x => x.id === id); if (!t) return null;
  const cw = { id: U.uid(), name: t.name, note: t.note || '', exercises: JSON.parse(JSON.stringify(t.exercises)), createdAt: U.todayISO() };
  (prof.customWorkouts || (prof.customWorkouts = [])).push(cw);
  saveApp();
  return cw.id;
}
function deleteDayTemplate(id) { coachLib().days = coachLib().days.filter(x => x.id !== id); saveApp(); }

/* which plan day is next? rotate through days by count of logs of this plan */
function nextPlanDay(prof) {
  if (!prof.plan) return null;
  const idx = (prof.plan.nextDayIdx || 0) % prof.plan.days.length;
  return { idx, day: prof.plan.days[idx] };
}

/* ---- workout lifecycle ---- */
function buildEntries(prof, exercises) {
  const easy = deloadActive(prof);
  const rm = readinessToday(prof);
  return exercises.map(pe => {
    let t = nextTargets(prof, pe);
    if (easy) t = applyDeload(prof, pe, Object.assign({ sets: pe.sets }, t));
    const ex0 = EX_BY_ID[pe.exId];
    if (rm && rm.mod !== 1 && t.w && ex0 && !ex0.bw && !ex0.timed) {  // readiness eases/bumps today's loads
      t = Object.assign({}, t, { w: Math.max(0, U.round(t.w * rm.mod, roundStepFor(ex0))) });
    }
    const nSets = easy && t.sets ? t.sets : pe.sets;
    const sets = [];
    for (let i = 0; i < nSets; i++) sets.push({ w: t.w != null ? t.w : 0, reps: t.reps, done: false });
    return { exId: pe.exId, plan: pe, sets, feel: null, isNew: t.isNew };
  });
}
function startWorkout(prof, dayIdx, trimMin) {
  const day = prof.plan.days[dayIdx];
  let exs = day.exercises, trimmed = null;
  if (trimMin) { const t = trimSession(day.exercises, trimMin); exs = t.exercises; trimmed = t; }
  const entries = buildEntries(prof, exs);
  if (entries.length) entries[0].warmup = warmupFor(prof, entries[0]);
  App.workout = {
    id: U.uid(), date: U.todayISO(), startTs: Date.now(), dayIdx, dayName: day.name,
    coachNote: day.note || '',
    entries, curIdx: 0, easy: deloadActive(prof), trimmed: trimmed ? trimmed.est : null,
  };
  const _rmD = readinessToday(prof);
  if (_rmD && _rmD.mod !== 1) App.workout.readyNote = `Readiness check-in: today’s weights ${_rmD.label} — tweak any set freely.`;
  prof.activeWorkout = App.workout;
  saveApp();
}

function startCustomWorkout(prof, cwId, trimMin) {
  const cw = (prof.customWorkouts || []).find(c => c.id === cwId);
  if (!cw) return;
  let exs = cw.exercises, trimmed = null;
  if (trimMin) { const t = trimSession(cw.exercises, trimMin); exs = t.exercises; trimmed = t; }
  const entries = buildEntries(prof, exs);
  if (entries.length) entries[0].warmup = warmupFor(prof, entries[0]);
  App.workout = {
    id: U.uid(), date: U.todayISO(), startTs: Date.now(), dayIdx: null, customId: cwId,
    dayName: cw.name, coachNote: cw.note || '',
    entries, curIdx: 0, easy: deloadActive(prof), trimmed: trimmed ? trimmed.est : null,
  };
  const _rmC = readinessToday(prof);
  if (_rmC && _rmC.mod !== 1) App.workout.readyNote = `Readiness check-in: today’s weights ${_rmC.label} — tweak any set freely.`;
  prof.activeWorkout = App.workout;
  saveApp();
}

function discardWorkout(prof) {
  App.workout = null; prof.activeWorkout = null; saveApp();
}

function finishWorkout(prof) {
  const w = App.workout;
  const log = {
    id: w.id, date: w.date, dayName: w.dayName, dayIdx: (w.dayIdx != null ? w.dayIdx : null),
    durationMin: Math.max(1, Math.round((Date.now() - w.startTs - (w.pauseMs || 0)) / 60000)),
    entries: w.entries.map(e => ({ exId: e.exId, plan: e.plan, feel: e.feel, sets: e.sets.filter(s => s.done) }))
      .filter(e => e.sets.length),
  };
  const prs = detectPRs(prof, log);
  const easy = deloadActive(prof, log.date);
  const msgs = easy ? [{ kind: 'hold', text: 'Easy week done — everything picks up where it left off next week.' }] : applyProgression(prof, log);
  prof.logs.push(log);
  const badges = newBadges(prof);
  if (w.dayIdx != null && prof.plan) prof.plan.nextDayIdx = ((w.dayIdx + 1) % prof.plan.days.length);
  prof.activeWorkout = null;
  App.workout = null;
  if (prof.coachSync) {
    prof.coachSync.pendingProgress = true;
    if (typeof syncTick === 'function') setTimeout(() => syncTick(true), 1200);
  }
  saveApp();
  return { log, prs, msgs, badges };
}

function workoutStats(w) {
  let sets = 0, vol = 0, doneEx = 0;
  for (const e of w.entries) {
    const d = e.sets.filter(s => s.done);
    sets += d.length;
    vol += d.reduce((t, s) => t + (s.w || 0) * (EX_BY_ID[e.exId].timed ? 0 : s.reps), 0);
    if (d.length) doneEx++;
  }
  return { sets, vol: Math.round(vol), doneEx };
}

/* ---- backup ---- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(App.data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'liftoff-backup-' + U.todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d !== 'object' || !d.profiles) throw new Error('bad');
      App.data = d; saveApp(); cb(true);
    } catch (e) { cb(false); }
  };
  r.readAsText(file);
}

/* never silently bin a paused workout that has ticked sets */
function guardPausedThen(prof, fn) {
  const aw = prof.activeWorkout;

function render() {
  disposePlayers();
  if (_elapsedIv) { clearInterval(_elapsedIv); _elapsedIv = null; }
  const app = $app();
  const prof = activeProfile();
  if (!App.workout) App.woMin = false;               // heal the minimise flag if the workout ended
  const woActive = !!App.workout, woFull = woActive && !App.woMin;
  document.body.classList.toggle('wo-min', woActive && !!App.woMin);
  // Scroll behaviour: amendments (logging a set, editing in place, a background
  // day/sync refresh) must NOT yank the page back to the top. Only deliberate
  // navigation — switching tab, opening a different profile, entering/leaving a
  // workout, or advancing onboarding — resets to the top. Navigation is detected
  // by a change in the "view key"; anything else keeps the current scroll.
  const viewKey = (!prof || App.creating)
    ? 'ob:' + (App.onboarding ? App.onboarding.step : 0)
    : woFull ? 'workout'
    : (App.data.activeProfileId || '') + ':' + App.view;
  const navigated = App._scrollTop || viewKey !== App._lastViewKey;
  App._scrollTop = false;
  App._lastViewKey = viewKey;
  const y = navigated ? 0 : (window.scrollY || 0);

  if (!prof || App.creating) { app.innerHTML = renderOnboarding(); bindOnboarding(); _restoreScroll(y); return; }
  if (woFull) { app.innerHTML = renderWorkout(prof); afterWorkoutRender(prof); _restoreScroll(y); return; }
  let html = '';

  afterRender(prof);

  _restoreScroll(y);

  const counts = {};
  Object.values(sched).forEach(a => counts[a] = (counts[a] || 0) + 1);
  const summary = Object.entries(counts).filter(([a]) => a !== 'rest').map(([a, n]) =>
    `${n} ${a === 'sport' ? (sportLabel || 'sport') : ACTIVITIES[a].label.toLowerCase()}`).join(' · ') +

  return `${title ? `<div class="ob-q">${title}</div><div class="ob-hint">${hint}</div>` : ''}

      <div class="wb-day">${wd}</div>
      <div class="wb-opts">${acts.map(a => `
        <button class="wb-chip ${sched[d] === a ? 'on' : ''}" data-a="${action}" data-d="${d}" data-v="${a}">
          ${IC(ACTIVITIES[a].emoji)} ${a === 'sport' ? U.esc((sportLabel || 'Sport').slice(0, 10)) : ACTIVITIES[a].label}
        </button>`).join('')}</div>
    </div>`).join('')}

}

function obAction(a, el) {
  const ob = obState();
  if (a === 'ob-next') {
    const step = OB_STEPS[ob.step];
    if (step === 'athlete' && !ob.athleteType) return toast('Pick what fits you best');
    if (step === 'goal' && !ob.goal) return toast('Pick a goal to continue');
    if (step === 'experience' && !ob.experience) return toast('Pick your experience level');
    if (step === 'week') {
      const n = liftDaysOf(ob.weekSchedule).length;
      if (n < 1) return toast('Pick at least one lifting day');
      if (n > 6) return toast('Keep at least one full rest day — your muscles will thank you');
    }
    if (step === 'equipment' && !ob.equipment.length) return toast('Select at least one option');
    ob.step++;
    if (OB_STEPS[ob.step] === 'build') {
      render();
      setTimeout(() => {
        Sound.unlock();
        createProfile({ name: ob.name.trim() || 'Athlete', emoji: ob.emoji, goal: ob.goal, experience: ob.experience,
          athleteType: ob.athleteType, sportLabel: ob.sportLabel.trim(), weekSchedule: ob.weekSchedule, videoPref: ob.videoPref, bodySex: ob.bodySex,
          sessionMinutes: ob.sessionMinutes, equipment: ob.equipment, focus: ob.focus, units: 'kg' });
        App.onboarding = null; App.creating = false; App.view = 'today';
        Confetti.burst(90);
        render();
        toast('Your plan is ready.', 3000);
      }, 1600);
      return;
    }
    render(); return;
  }
  if (a === 'ob-back') { if (ob.step > 0) ob.step--; else if (App.creating) { App.creating = false; App.onboarding = null; } render(); return; }
  if (a === 'ob-emoji') { ob.emoji = el.dataset.e; render(); return; }
  if (a === 'ob-set') {
    const k = el.dataset.k; let v = el.dataset.v;
    if (k === 'sessionMinutes') v = +v;
    ob[k] = v; render(); return;
  }
  if (a === 'ob-num') { ob[el.dataset.k] = U.clamp(ob[el.dataset.k] + (+el.dataset.d), 1, 6); render(); return; }
  if (a === 'ob-athlete') {
    if (ob.athleteType !== el.dataset.v) { ob.athleteType = el.dataset.v; ob.weekSchedule = defaultSchedule(ob.athleteType); }
    render(); return;
  }
  if (a === 'wb-set') { ob.weekSchedule[+el.dataset.d] = el.dataset.v; render(); return; }
  if (a === 'ob-equip') {
    const v = el.dataset.v;
    ob.equipment = ob.equipment.includes(v) ? ob.equipment.filter(x => x !== v) : [...ob.equipment, v];
    render(); return;
  }
  if (a === 'ob-focus') {
    const v = el.dataset.v;
    if (ob.focus.includes(v)) ob.focus = ob.focus.filter(x => x !== v);
    else if (ob.focus.length < 2) ob.focus = [...ob.focus, v];
    else toast('Two focus areas max — keep it focused!');
    render(); return;
  }
}

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Night owl' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}

function estMinutes(day) {
  let s = 8; // warm-up
  for (const pe of day.exercises) s += pe.sets * ((pe.rest || 60) + 40) / 60;
  return Math.round(s / 5) * 5;
}

function weekDots(prof) {
  const wk = U.weekKey(U.todayISO());
  const end = (() => { const d = U.parseISO(wk); d.setDate(d.getDate() + 7); return d; })();
  const endISO = end.getFullYear() + '-' + String(end.getMonth() + 1).padStart(2, '0') + '-' + String(end.getDate()).padStart(2, '0');
  const done = (prof.logs || []).filter(l => l.date >= wk && l.date < endISO).length;
  const target = prof.plan ? prof.plan.daysPerWeek : 3;
  let dots = '';
  for (let i = 0; i < target; i++) dots += `<span style="width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px;background:${i < done ? 'var(--good)' : 'rgba(20,22,34,0.12)'}"></span>`;
  return { done, target, dots };
}

function weekStripHtml(prof) {
  const sched = prof.quiz.weekSchedule;
  if (!sched) return '';
  const t = todayWeekday();
  const mon = U.parseISO(U.weekKey(U.todayISO()));
  const mv = movesThisWeek(prof);
  let out = '<div class="week-strip">';
  for (let d = 0; d < 7; d++) {
    const dt = new Date(mon); dt.setDate(mon.getDate() + d);
    const iso = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    const act = effActivityOn(prof, d) || 'rest';
    const done = act === 'lift' ? (prof.logs || []).some(l => l.date === iso) : (act !== 'rest' && sportDoneOn(prof, iso, act));
    const glyph = done ? IC('check') : mv[d] ? (mv[d].to == null ? '–' : '↷') : IC(ACTIVITIES[act].emoji);
    out += `<button class="ws-day ${d === t ? 'today' : ''} ${done ? 'done' : ''}" data-a="day-peek" data-d="${d}" title="See this day">
      <span class="ws-l">${WEEKDAYS[d][0]}</span><span class="ws-e">${glyph}</span></button>`;
  }
  return out + '</div>';
}

/* the next gym session from today INCLUSIVE (startI=1 skips today, used once
   today's own session is done/paused). Returns null if none in the coming week.
   Shape mirrors effWorkoutForWeekday + the weekday and day-offset. */
function upcomingGym(prof, startI) {
  const sched = prof.quiz.weekSchedule;
  if (!sched || !prof.plan) return null;
  const t = todayWeekday();
  for (let i = startI || 0; i < 7; i++) {
    const dayIdx = t + i, wd = dayIdx % 7, inWeek = dayIdx < 7;
    const act = inWeek ? effActivityOn(prof, wd) : (sched[wd] || 'rest');
    if (act !== 'lift') continue;
    const w4d = inWeek ? effWorkoutForWeekday(prof, wd) : workoutForWeekday(prof, wd);
    if (!w4d) continue;
    return { wd, inDays: i, name: w4d.name, type: w4d.type, id: w4d.id, idx: w4d.idx, exercises: w4d.exercises };
  }
  return null;
}

        <button class="btn sm ghost" data-a="choose-day">Lift anyway</button>
      </div>
    </div>`;
  } else if (act === 'rest') {
    hero = `<div class="card hero-rest">
      <div class="kicker">Today · rest day</div>
      <h2 style="font-size:23px;font-weight:900;margin:5px 0 2px">Recovery day</h2>
      <div class="hero-rest-tx">Rest is where muscles are actually built. Eat well, sleep well — you've earned it.</div>
      ${nl ? `<div class="next-lift">Next lift: <b>${nl.inDays === 1 ? 'tomorrow' : WEEKDAYS_FULL[nl.wd]}</b> · ${U.esc(nl.name || '')}</div>` : ''}
      <div class="row mt12"><button class="btn sm ghost" data-a="choose-day">Feeling fresh? Lift anyway</button></div>
    </div>`;
  } else {
    const done = sportDoneOn(prof, todayISO, act);
    const label = sportLabelFor(prof, act);
    hero = `<div class="card hero-sport">
      <div class="kicker">Today · ${U.esc(ACTIVITIES[act].label.toLowerCase())} day</div>
      <h2 style="font-size:23px;font-weight:900;margin:5px 0 2px;position:relative;z-index:1">${IC(ACTIVITIES[act].emoji)} ${U.esc(label)}</h2>
      <div style="font-size:13.5px;opacity:.95;position:relative;z-index:1;line-height:1.5">${done ? 'Done — great work. Recovery is now the workout.' : 'The plan keeps your legs fresh for this — go enjoy it.'}</div>
      ${nl ? `<div class="next-lift" style="position:relative;z-index:1;color:rgba(255,255,255,0.9)">Next lift: <b>${nl.inDays === 1 ? 'tomorrow' : WEEKDAYS_FULL[nl.wd]}</b> · ${U.esc(nl.name || '')}</div>` : ''}
      <div class="row mt16" style="position:relative;z-index:1">
        <button class="btn onhero" style="flex:1" data-a="sport-done" data-act="${act}">${done ? '✓ Done — tap to undo' : 'Mark it done ✓'}</button>
        <button class="btn sm" style="background:var(--fill);color:var(--ink)" data-a="choose-day">Lift instead</button>
      </div>
    </div>`;
  }

  // "Next gym workout" = the next session from today inclusive (per Benn: even if
  // that's today). When today's own gym session is the hero (unstarted), it already
  // shows the workout + icons, so we don't repeat it as a card; once it's done or
  // paused we point at the following session instead.
  const heroIsTodayGym = act === 'lift' && nl && nl.inDays === 0 && !liftedToday && !(aw && !App.workout);
  const nextInfo = heroIsTodayGym ? null : upcomingGym(prof, (nl && nl.inDays === 0) ? 1 : 0);
  const nextCard = nextWorkoutCardHtml(prof, nextInfo);
  const fullPlanCard = `<button class="card planlink" data-a="tab" data-id="plan">
    <span class="planlink-tx"><span class="planlink-h">Your full plan</span><span class="planlink-s">All days, custom workouts &amp; saved weeks</span></span>
    <span class="planlink-go">›</span>
  </button>`;

  return `<div class="screen">
    <div class="hdr">
      <div><div class="hi">${greeting()}, ${U.esc(prof.name)} <span style="font-size:20px"></span></div>
        <div class="sub">${wk.done >= wk.target ? 'Lifting week complete.' : `${wk.done} of ${wk.target} lifts done this week`}</div></div>
      <button class="avatar" data-a="tab" data-id="profile">${initials(prof.name)}</button>
    </div>
    <div style="margin-bottom:12px;display:flex;gap:7px;flex-wrap:wrap">
      <span class="prog-chip">${U.esc(programLabel(prof))}</span>
      ${weeks >= 2 ? `<span class="streak-chip">${weeks}-week streak</span>` : ''}
    </div>
    ${coachPlanCardHtml(prof)}
    ${hero}
    ${coachMsgCardHtml(prof)}
    ${nextCard}
    <div class="card">
      <div class="row"><h3>This week</h3><span class="spacer"></span><span class="muted">${wk.done}/${wk.target} lifts</span></div>
      <div class="mt8">${weekStripHtml(prof) || wk.dots}</div>
      ${dayMoveSummaryHtml(prof)}
      ${lastLog ? `<div class="row mt8" style="align-items:center"><span class="muted">Last lift: ${U.esc(lastLog.dayName)} · ${U.fmtDate(lastLog.date)}</span><span class="spacer"></span><button class="btn ghost sm" data-a="go-history">Past workouts ›</button></div>` : ''}
    </div>
    ${fullPlanCard}
    ${(() => {
      const fr = muscleFreshness(prof);
      if (!Object.keys(fr).length) return '';
      const fs = freshnessSummary(fr);
      const line = fs.fresh.length === 0
        ? 'Everything has had some love lately — recovery is where the growth happens'
        : fs.working.length === 0
          ? 'Fully recovered everywhere — pick a fight with any muscle you like'
          : `Fresh and ready: <b>${fs.fresh.join(', ')}</b> · easing off: ${fs.working.join(', ')}`;
      return `<div class="card">
        <div class="row"><h3>Muscle radar</h3><span class="spacer"></span><span class="muted">last 3 days</span></div>
        ${MuscleMap.heat(fr, { sex: prof.quiz.bodySex })}
        <div class="mm-key"><span><i style="background:#E4E0EE"></i>Fresh</span><span><i style="background:#FFD9A8"></i>Easing off</span><span><i style="background:#FF4D3D"></i>Just worked</span></div>
        <div class="muted mt8" style="font-size:12.5px;line-height:1.5">${line}</div>
      </div>`;
    })()}
    ${reliefEntryCardHtml(prof)}
    ${tips.slice(0, 2).map(t => `<div class="card coach-card"><div class="ic">${IC(t.icon)}</div><div><div class="tt">${U.esc(t.title)}</div><div class="tx">${U.esc(t.text)}</div>${t.kind === 'deload' ? '<button class="btn sm ghost mt8" data-a="deload-start">Make this an easy week</button>' : ''}</div></div>`).join('')}
  </div>`;
}

/* ============================================================
   WORKOUT MODE
============================================================ */
// Glanceable "now" strip: which exercise you're on (N of M), its name, the set
// you're up to, and the running session time — so a propped-up phone reads like
// a workout dashboard without scrolling. Regenerated every render(), so it tracks
// progress as sets are ticked. Tapping it jumps to the active set card.
function workoutHudHtml(prof, w) {
  const entries = w.entries;
  let idx = entries.findIndex(e => e.sets.some(s => !s.done));
  const allDone = idx === -1;
  if (allDone) idx = Math.max(0, entries.length - 1);
  const e = entries[idx];
  const ex = EX_BY_ID[e.exId];
  const setTotal = e.sets.length;
  const setDone = e.sets.filter(s => s.done).length;
  const curSet = Math.min(setDone + 1, setTotal);
  const sub = allDone
    ? 'All sets done — hit Finish'
    : `Set ${curSet} of ${setTotal}${ex.timed ? ' · hold' : ''}${e.plan && e.plan.ssWithNext ? ' · superset' : ''}`;
  return `<div class="wo-hud" data-a="wo-goto-active" role="button" title="Jump to this set">
    <div class="wo-hud-badge">${allDone ? '<b>✓</b>' : `<b>${idx + 1}</b><i>of ${entries.length}</i>`}</div>
    <div class="wo-hud-mid">
      <div class="wo-hud-ex">${U.esc(ex.name)}</div>
      <div class="wo-hud-sub">${sub}</div>
    </div>
    <div class="wo-hud-time"><span id="wo-elapsed">0:00</span><small>SESSION</small></div>
  </div>`;
}

function renderWorkout(prof) {
  const w = App.workout;
  const doneSets = w.entries.reduce((t, e) => t + e.sets.filter(s => s.done).length, 0);
  const totalSets = w.entries.reduce((t, e) => t + e.sets.length, 0);
  const flags = `${w.easy ? 'easy week' : ''}${w.easy && w.trimmed ? ' · ' : ''}${w.trimmed ? '~' + w.trimmed + ' min' : ''}`;
  return `<div class="screen">
    <div class="wo-head">
      <div class="wo-topbar">
        <button class="iconbtn" data-a="wo-exit" title="Pause or discard">✕</button>
        <div style="text-align:center;flex:1;min-width:0"><div class="t">${U.esc(w.dayName)}</div>${flags ? `<div class="elapsed">${flags}</div>` : ''}</div>
        <button class="iconbtn" data-a="wo-min" title="Minimise — browse the app while this keeps running">⌄</button>
        <button class="btn sm dark" data-a="wo-finish">Finish</button>
      </div>
      ${workoutHudHtml(prof, w)}
      <div class="ob-progress" style="margin:9px 0 0"><i style="width:${totalSets ? doneSets / totalSets * 100 : 0}%"></i></div>
    </div>
    ${w.coachNote ? `<div class="coach-note"><b>${U.esc(prof.coachName || 'Coach')}:</b> ${U.esc(w.coachNote)}</div>` : ''}
    ${w.readyNote ? `<div class="coach-note" style="border-color:#E7DEFF;background:#FBF9FF">${U.esc(w.readyNote)}</div>` : ''}
    ${warmupCardHtml(w)}
    ${w.entries.map((e, ei) => renderWorkoutEx(prof, e, ei)).join('')}
    <button class="btn ghost block" data-a="wo-add-ex">+ Add an exercise</button>
    ${cooldownCardHtml(w)}
    <div style="height:70px"></div>
  </div>`;
}

function renderWorkoutEx(prof, e, ei) {
  const ex = EX_BY_ID[e.exId];
  const complete = e.sets.every(s => s.done);
  const anyDone = e.sets.some(s => s.done);
  const active = ei === App.workout.curIdx && !complete;
  const u = prof.units;
  const plan = e.plan;
  const tgt = ex.timed ? `${plan.sets} × ${plan.repsMin}–${plan.repsMax}s hold` :
    `${plan.sets} sets × ${plan.repsMin}–${plan.repsMax} reps${ex.unilateral ? ' each side' : ''}`;
  const hint = e.isNew && !ex.bw ? `<div class="wo-target" style="color:#C2400C">First time — pick a weight that leaves ~2 reps in the tank</div>` : '';
  const lastP = lastPerformance(prof, ex.id);
  const lastLine = lastP ? `<div class="wo-last">Last time: ${U.esc(lastP.str)} · ${U.fmtDateShort(lastP.date)}</div>` : '';
  const topW = Math.max(...e.sets.map(x => x.w || 0), 0);
  const plates = ex.equip.includes('barbell') && !ex.bw && topW > (prof.barKg || 20) ? plateBreakdown(topW, prof.barKg || 20) : null;
  const plateLine = plates ? `<div class="wo-plates">${prof.barKg || 20}kg bar + <b>${plates.perSide}</b>/side (${plates.plates.join(' + ')})${plates.exact ? '' : ' ≈'}</div>` : '';
  const ssBadge = plan.ssWithNext ? `<span class="tag" style="background:var(--coach-bg);color:var(--violet-ink)">superset with next</span>` : '';
  const noteLine = plan.note ? `<div class="wo-note"><b>${U.esc(prof.coachName || 'Coach')}:</b> ${U.esc(plan.note)}</div>` : '';
  const warmupRows = (e.warmup || []).map((ws, wi) => `
      <div class="setrow warmrow">
        <div class="sn">W</div>
        <div class="step warmcell"><div class="v"><span>${U.fmtW(ws.w, u)}</span><small>${U.unitLabel(u).toUpperCase()}</small></div></div>
        <div class="step warmcell"><div class="v"><span>${ws.reps}</span><small>REPS</small></div></div>
        <button class="donebtn ${ws.done ? 'on' : ''}" data-a="wo-warm-done" data-ei="${ei}" data-wi="${wi}">✓</button>
      </div>`).join('');
  return `<div class="wo-ex ${active ? 'active' : ''} ${complete ? 'done-ex' : ''}" data-ei="${ei}">
    <div class="wo-ex-head">
      <div style="flex:1"><div class="nm">${U.esc(ex.name)} ${ssBadge}</div><div class="wo-target">${tgt}</div>${noteLine}${lastLine}${plateLine}${hint}</div>
      <button class="iconbtn" data-a="wo-how" data-ex="${ex.id}" title="How to"></button>
      <button class="iconbtn" data-a="wo-swap" data-ei="${ei}" title="Swap"></button>
    </div>
    <div class="sets">${warmupRows}
      ${e.sets.map((s, si) => `
      <div class="setrow">
        <div class="sn">${si + 1}</div>
        ${ex.bw && !ex.timed && !(s.w > 0) ?
          `<div class="step"><button data-a="wo-mkweighted" data-ei="${ei}" data-si="${si}">+</button><div class="v">BW<small>BODY</small></div><span></span></div>` :
          ex.timed ? `<button class="step holdgo" data-a="wo-hold" data-ei="${ei}" data-si="${si}"><span id="hold-${ei}-${si}">▶ ${s.reps}s hold</span></button>` :
          `<div class="step">
            <button data-a="wo-step" data-ei="${ei}" data-si="${si}" data-f="w" data-d="-1">−</button>
            <div class="v tappable" data-a="wo-typein" data-ei="${ei}" data-si="${si}" data-f="w" title="Tap to type"><span>${s.w > 0 ? U.fmtW(s.w, u) : '—'}</span><small>${U.unitLabel(u).toUpperCase()}</small></div>
            <button data-a="wo-step" data-ei="${ei}" data-si="${si}" data-f="w" data-d="1">+</button>
          </div>`}
        <div class="step">
          <button data-a="wo-step" data-ei="${ei}" data-si="${si}" data-f="reps" data-d="-1">−</button>
          <div class="v tappable" data-a="wo-typein" data-ei="${ei}" data-si="${si}" data-f="reps" title="Tap to type"><span>${s.reps}</span><small>${ex.timed ? 'SEC' : 'REPS'}</small></div>
          <button data-a="wo-step" data-ei="${ei}" data-si="${si}" data-f="reps" data-d="1">+</button>
        </div>
        <button class="donebtn ${s.done ? 'on' : ''}" data-a="wo-done" data-ei="${ei}" data-si="${si}">✓</button>
      </div>`).join('')}
    </div>
    ${(() => {
      const lastSets = lastSetsFor(prof, ex.id);
      if (!lastSets) return '';
      const chips = e.sets.map((s, si) => {
        const L = lastSets[si]; if (!L) return '';
        const cmp = (ex.bw || ex.timed) ? s.reps >= L.reps : e1rm(s.w || 0, s.reps) >= e1rm(L.w, L.reps);
        const beat = s.done && cmp && s.reps > 0, low = s.done && !cmp;
        const txt = ex.timed ? `${L.reps}s` : (L.w > 0 ? `${U.fmtW(L.w, u)}×${L.reps}` : `${L.reps}`);
        return `<span class="bchip ${beat ? 'good' : low ? 'low' : ''}">${beat ? '✓ ' : ''}${txt}</span>`;
      }).join('');
      return chips ? `<div class="beatvs"><span class="bl">Beat last</span>${chips}</div>` : '';
    })()}
    <div class="setedit">
      <button data-a="wo-delset" data-ei="${ei}" ${e.sets.length <= 1 ? 'disabled' : ''}>− set</button>
      <button data-a="wo-addset" data-ei="${ei}">+ set</button>
    </div>
    ${anyDone && !ex.timed ? `<div class="feel">
      ${[['easy', 'Easy'], ['right', 'Just right'], ['hard', 'Hard']].map(([v, l]) =>
        `<button class="${e.feel === v ? 'on' : ''}" data-a="wo-feel" data-ei="${ei}" data-v="${v}">${l}</button>`).join('')}
    </div>` : ''}
  </div>`;
}

function renderRest() {
  const r = App.restTimer;
  if (!r) return '';
  const frac = r.remaining / r.total;
  return `<div class="rest" id="rest">
    <div><div class="lb">Rest</div><div class="num">${U.fmtDur(Math.ceil(r.remaining))}</div></div>
    <span class="spacer"></span>
    <button data-a="rest-add">+30s</button>
    <button data-a="rest-skip">Skip</button>
    <div class="bar"><i style="width:${frac * 100}%"></i></div>
  </div>`;
}

/* rest timer is wall-clock based: leaving the app, locking the phone or reloading
   never loses time — on return it shows the true remaining (or has finished). */
function _restTick() {
  const r = App.restTimer; if (!r) return;
  const remaining = (r.endTs - Date.now()) / 1000;
  // she's watching the timer and it's nearly done — the in-app cue will cover it,
  // so call off the server push before it fires (avoids a redundant banner)
  if (remaining <= 12 && !r.pingCancelled && document.visibilityState === 'visible') {
    r.pingCancelled = true;
    if (typeof cancelPing === 'function') cancelPing();
  }
  const el = document.getElementById('rest');
  if (el) {
    el.querySelector('.num').textContent = U.fmtDur(Math.max(0, Math.ceil(remaining)));
    el.querySelector('.bar i').style.width = U.clamp(remaining / r.total * 100, 0, 100) + '%';
  }
  if (remaining <= 0) {
    const wasHidden = document.visibilityState === 'hidden';
    stopRest();
    Sound.timerDone();
    if (wasHidden) notifyRestDone();
    else toast('Rest done — next set!');
  }
}
function _restStartAt(endTs, total) {
  stopRest();
  App.restTimer = { total, endTs, iv: setInterval(_restTick, 250) };
  if (App.workout) {
    App.workout.restEndTs = endTs; App.workout.restTotal = total;
    const p = activeProfile(); if (p) { p.activeWorkout = App.workout; saveApp(); }
  }
  document.body.insertAdjacentHTML('beforeend', renderRest());
  if (typeof schedulePing === 'function') schedulePing(endTs); // server push covers a locked phone
  _restTick();
}
function startRest(sec) {
  _restStartAt(Date.now() + sec * 1000, sec);
  askNotifPermissionOnce();
}
function resumeRest() { // called on boot when a workout was mid-rest
  const w = App.workout;
  if (!w || !w.restEndTs) return;
  if (w.restEndTs > Date.now() + 500) _restStartAt(w.restEndTs, w.restTotal || 60);
  else {
    delete w.restEndTs; delete w.restTotal;
    toast('Rest finished while you were away — back to it');
  }
}
function stopRest() {
  if (App.restTimer) {
    clearInterval(App.restTimer.iv);
    if (!App.restTimer.pingCancelled && typeof cancelPing === 'function') cancelPing();
    App.restTimer = null;
  }
  if (App.workout) { delete App.workout.restEndTs; delete App.workout.restTotal; }
  const el = document.getElementById('rest'); if (el) el.remove();
}
function notifyRestDone() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const opts = { body: 'Back to it — your next set is ready', tag: 'liftoff-rest',
      icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [120, 60, 120] };
    if (navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.ready.then(reg => reg.showNotification('Rest done!', opts)).catch(() => {});
    else new Notification('Rest done!', opts);
  } catch (e) { /* notifications unavailable — timer itself stays correct */ }
}
function askNotifPermissionOnce() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'default') return;
    if (App.data.notifAsked) return;
    App.data.notifAsked = true; saveApp();
    Notification.requestPermission().then(p => {
      if (p === 'granted') {
        toast('You’ll get a ping when rest ends — even off the app');
        if (typeof ensurePushSub === 'function') ensurePushSub().then(() => {
          // a rest may already be running — book its push now that we can
          if (App.restTimer && !App.restTimer.pingCancelled) schedulePing(App.restTimer.endTs);
        });
      }
    }).catch(() => {});
  } catch (e) { /* fine */ }
}

function afterWorkoutRender(prof) {
  const w = App.workout;
  const tick = () => {
    const el = document.getElementById('wo-elapsed'); if (!el) return;
    const s = Math.max(0, Math.floor((Date.now() - w.startTs - (w.pauseMs || 0)) / 1000));
    el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  tick();
  _elapsedIv = setInterval(tick, 1000);
  // rest bar lives at body level and survives re-renders
}

/* stepper resolution */
function stepSize(ex, units) {
  if (units === 'lb') return U.toKg(2.5, 'lb');
  return ex.inc >= 5 ? 2.5 : ex.inc >= 2 ? 1.25 : 0.5;
}

function workoutAction(a, el, prof) {
  const w = App.workout;
  if (a === 'start-workout') { Sound.unlock(); WakeLock.on(); startWorkout(prof, +el.dataset.idx); render(); return; }
  if (a === 'wo-goto-active') {
    const card = document.querySelector('.wo-ex.active') || document.querySelector('.wo-ex:not(.done-ex)');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (a === 'wo-exit') {
    const done = w.entries.reduce((t, e) => t + e.sets.filter(x => x.done).length, 0);
    const total = w.entries.reduce((t, e) => t + e.sets.length, 0);
    showSheet(`<h3 style="font-size:19px;font-weight:900">Take a break?</h3>
      <p class="muted mt8" style="margin-bottom:12px">You've ticked ${done} of ${total} sets. Whatever you pick, nothing is lost by accident.</p>
      <button class="btn primary block" data-a="wo-min">⌄ Minimise — browse the app, keep it running</button>
      <button class="btn ghost block mt8" data-a="wo-pause">Pause — finish later from Today</button>
      <button class="btn ghost block mt8" data-a="sheet-close">Keep training</button>
      <button class="btn block mt8" style="background:#FBE9E7;color:#C0302C" data-a="wo-discard-ask">Discard this workout</button>`);
    return;
  }
  if (a === 'wo-pause') {
    w.pausedAt = Date.now();
    prof.activeWorkout = w;
    App.workout = null; App.view = 'today';
    stopRest(); WakeLock.off(); closeSheet(); saveApp(); render();
    toast('Paused — pick it back up from Today whenever you like');
    return;
  }
  if (a === 'wo-discard-ask') {
    closeSheet();
    showConfirm('Discard this workout?', 'Nothing gets logged and the ticked sets are thrown away. Your plan, history and records are untouched.', 'Keep it', 'Discard', ok => {
      if (!ok) { discardWorkout(prof); stopRest(); WakeLock.off(); render(); toast('Binned — fresh start next time'); }
    });
    return;
  }
  if (a === 'wo-resume') {
    const aw = prof.activeWorkout;
    if (!aw) return;
    if (aw.pausedAt) { aw.pauseMs = (aw.pauseMs || 0) + (Date.now() - aw.pausedAt); delete aw.pausedAt; }
    App.workout = aw;
    Sound.unlock(); WakeLock.on(); saveApp(); render();
    toast('Back at it');
    return;
  }
  if (a === 'wo-discard') { discardWorkout(prof); stopRest(); render(); return; }
  if (a === 'wo-step') {
    const e = w.entries[+el.dataset.ei], s = e.sets[+el.dataset.si];
    const ex = EX_BY_ID[e.exId];
    if (el.dataset.f === 'w') s.w = Math.max(0, Math.round((s.w + stepSize(ex, prof.units) * (+el.dataset.d)) * 100) / 100);
    else s.reps = U.clamp(s.reps + (+el.dataset.d) * (ex.timed ? 5 : 1), 0, ex.timed ? 300 : 50);
    prof.activeWorkout = w; saveApp();
    const v = el.parentElement.querySelector('.v');
    if (el.dataset.f === 'w') v.innerHTML = `<span>${s.w > 0 ? U.fmtW(s.w, prof.units) : '—'}</span><small>${U.unitLabel(prof.units).toUpperCase()}</small>`;
    else v.innerHTML = `<span>${s.reps}</span><small>${ex.timed ? 'SEC' : 'REPS'}</small>`;
    return;
  }
  if (a === 'wo-typein') {
    if (el.querySelector('input')) return; // already editing
    const ei = +el.dataset.ei, si = +el.dataset.si, isW = el.dataset.f === 'w';
    const e = w.entries[ei], s = e.sets[si];
    const ex = EX_BY_ID[e.exId];
    const cur = isW ? (s.w > 0 ? U.fmtW(s.w, prof.units) : '') : String(s.reps);
    const unitTag = isW ? U.unitLabel(prof.units).toUpperCase() : (ex.timed ? 'SEC' : 'REPS');
    el.innerHTML = `<input class="step-input" type="text" inputmode="decimal" enterkeyhint="done" value="${cur}"><small>${unitTag}</small>`;
    const inp = el.querySelector('input');
    inp.focus(); inp.select();
    const restore = () => {
      el.innerHTML = isW
        ? `<span>${s.w > 0 ? U.fmtW(s.w, prof.units) : '—'}</span><small>${U.unitLabel(prof.units).toUpperCase()}</small>`
        : `<span>${s.reps}</span><small>${ex.timed ? 'SEC' : 'REPS'}</small>`;
    };
    const commit = () => {
      const raw = (inp.value || '').trim().replace(',', '.');
      const num = parseFloat(raw);
      if (raw !== '' && !isNaN(num) && num >= 0) {
        if (isW) s.w = Math.min(999, Math.round(U.toKg(num, prof.units) * 100) / 100);
        else s.reps = U.clamp(Math.round(num), 0, ex.timed ? 300 : 100);
        prof.activeWorkout = w; saveApp();
      }
      restore();
    };
    inp.addEventListener('blur', commit, { once: true });
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); } });
    return;
  }
  if (a === 'wo-mkweighted') {
    const e = w.entries[+el.dataset.ei]; const s = e.sets[+el.dataset.si];
    s.w = 2.5; prof.activeWorkout = w; saveApp(); render(); return;
  }
  if (a === 'wo-done') {
    const ei = +el.dataset.ei, si = +el.dataset.si;
    const e = w.entries[ei], s = e.sets[si];
    s.done = !s.done;
    if (s.done) {
      try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) { /* not supported */ }
      const ex = EX_BY_ID[e.exId];
      const nxt = e.sets[si + 1];
      if (nxt && !nxt.done && !ex.timed) { nxt.w = s.w; }
      const allDone = e.sets.every(x => x.done);
      if (allDone && App.workout.curIdx === ei) App.workout.curIdx = Math.min(ei + 1, w.entries.length - 1);
      const firstOfPair = e.plan && e.plan.ssWithNext && w.entries[ei + 1];
      if (firstOfPair && !allDone || firstOfPair && allDone) {
        stopRest();
        toast(`Straight into ${EX_BY_ID[w.entries[ei + 1].exId].name} — rest after`);
      } else if (!(allDone && ei === w.entries.length - 1)) startRest(e.plan.rest || 60);
      else stopRest();
    }
    prof.activeWorkout = w; saveApp(); render();
    return;
  }
  if (a === 'wo-warm-done') {
    const e = w.entries[+el.dataset.ei];
    const ws = e.warmup[+el.dataset.wi];
    ws.done = !ws.done;
    prof.activeWorkout = w; saveApp(); render();
    return;
  }
  if (a === 'wo-hold') {
    const ei = +el.dataset.ei, si = +el.dataset.si;
    const e = w.entries[ei], s = e.sets[si];
    if (App.holdTimer) { clearInterval(App.holdTimer.iv); App.holdTimer = null; render(); return; }
    Sound.unlock();
    let left = s.reps;
    const span = document.getElementById(`hold-${ei}-${si}`);
    App.holdTimer = { iv: setInterval(() => {
      left -= 1;
      if (span) span.textContent = left > 0 ? `${left}s…` : 'done!';
      if (left === 3 || left === 2 || left === 1) Sound.tick();
      if (left <= 0) {
        clearInterval(App.holdTimer.iv); App.holdTimer = null;
        Sound.timerDone();
        s.done = true;
        prof.activeWorkout = w; saveApp(); render();
        const allDone = e.sets.every(x => x.done);
        if (!(allDone && ei === w.entries.length - 1)) startRest(e.plan.rest || 45);
      }
    }, 1000) };
    if (span) span.textContent = `${left}s…`;
    return;
  }
  if (a === 'wo-min') { App.woMin = true; closeSheet(); render(); toast('Workout minimised — tap the bar to jump back ▸'); return; }
  if (a === 'wo-restore') { App.woMin = false; render(); return; }
  if (a === 'wo-addset') {
    const e = w.entries[+el.dataset.ei];
    const ex = EX_BY_ID[e.exId];
    const last = e.sets[e.sets.length - 1] || {};
    e.sets.push({ w: ex.timed ? 0 : (last.w || 0), reps: last.reps || (e.plan && e.plan.repsMax) || (ex.timed ? 30 : 10), done: false });
    prof.activeWorkout = w; saveApp(); render();
    return;
  }
  if (a === 'wo-delset') {
    const e = w.entries[+el.dataset.ei];
    if (e.sets.length > 1) { e.sets.pop(); prof.activeWorkout = w; saveApp(); render(); }
    return;
  }
  if (a === 'wo-feel') { w.entries[+el.dataset.ei].feel = el.dataset.v; prof.activeWorkout = w; saveApp(); render(); return; }
  if (a === 'wo-how') { App._vidChoice = null; showExerciseSheet(el.dataset.ex, prof); return; }
  if (a === 'wo-swap') { showSwapSheet(+el.dataset.ei, prof); return; }
  if (a === 'wo-add-ex') { showAddExSheet(prof); return; }
  if (a === 'rest-add') {
    const r = App.restTimer;
    if (r) {
      r.endTs += 30000; r.total += 30;
      r.pingCancelled = false;
      if (typeof schedulePing === 'function') schedulePing(r.endTs); // re-book the push for the new end
      if (App.workout) { App.workout.restEndTs = r.endTs; App.workout.restTotal = r.total; saveApp(); }
      _restTick();
    }
    return;
  }
  if (a === 'rest-skip') { stopRest(); return; }
  if (a === 'wo-finish') {
    const stats = workoutStats(w);
    if (!stats.sets) { showConfirm('Nothing logged yet', 'Tick off at least one set, or leave the workout.', 'Keep training', 'Leave workout', ok => { if (!ok) { discardWorkout(prof); stopRest(); render(); } }); return; }
    const unfinished = w.entries.some(e => e.sets.some(s => !s.done));
    const doFinish = () => {
      stopRest(); WakeLock.off();
      const res = finishWorkout(prof);
      App.view = 'today';
      render();
      showSummary(prof, res);
    };
    if (unfinished) showConfirm('Finish workout?', 'Some sets aren’t ticked — only completed sets are logged.', 'Keep training', 'Finish now', ok => { if (!ok) doFinish(); });
    else doFinish();
    return;
  }
}

function closeSheet() {

    `<div class="sheet-veil" data-a="sheet-close"></div><div class="sheet"><div class="grab"></div>${html}</div>`);
}
function showConfirm(title, text, keepLabel, actLabel, cb) {
  document.querySelectorAll('.modal-veil').forEach(e => e.remove());
  const id = 'cf' + Date.now();
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-veil" id="${id}"><div class="modal">
      <h3 style="font-size:18px;font-weight:900">${U.esc(title)}</h3>

      <div class="row mt16">

}

      <div class="s"><div class="v">${res.log.entries.length}</div><div class="l">exercises</div></div>
    </div>
    ${res.prs.map(pr => `<div class="pr-banner">New PR — ${U.esc(EX_BY_ID[pr.exId].name)}: ${U.fmtW(pr.val, prof.units)}${pr.kind === 'weight' ? U.unitLabel(prof.units) : U.unitLabel(prof.units) + ' est. 1RM'}</div>`).join('')}
    ${(res.badges || []).map(b => `<div class="pr-banner badgeb">${IC(b.icon)} Milestone unlocked — ${U.esc(b.name)}!</div>`).join('')}
    ${res.msgs.length ? `<div class="card mt12" style="box-shadow:none;border:1.5px solid var(--line)">
      <div class="kicker" style="margin-bottom:6px">Next time</div>
      ${res.msgs.slice(0, 6).map(m => `<div class="prog-msg"><span class="k">${m.kind === 'up' ? '' : m.kind === 'deload' ? '' : ''}</span>${U.esc(m.text)}</div>`).join('')}
    </div>` : ''}
    ${prof.coachSync ? `<div class="card mt12" style="box-shadow:none;border:1.5px solid var(--line)">
      <div class="kicker" style="margin-bottom:6px">Tell ${U.esc(prof.coachSync.coachName || 'your coach')} how it went</div>
      <div class="chips">${Object.entries(REACT_LABELS).map(([v, lbl]) => `<button class="chip" data-a="sum-react" data-v="${v}">${lbl}</button>`).join('')}</div>
      <input class="ob-input mt8" id="sum-note" maxlength="200" placeholder="Add a note (optional)" autocomplete="off">
    </div>` : ''}
    <button class="btn primary block mt16" id="summary-done">Done</button>
  </div></div>`);
  App._sumLog = res.log;
  const noteIn = document.getElementById('sum-note');
  if (noteIn) noteIn.addEventListener('input', () => { if (App._sumLog) App._sumLog.note = noteIn.value.slice(0, 200); });
  document.getElementById('summary-done').addEventListener('click', () => {
    document.getElementById('summary-veil').remove();
    if (prof.coachSync && App._sumLog && (App._sumLog.react || App._sumLog.note)) {
      prof.coachSync.pendingProgress = true; saveApp();
      if (typeof syncTick === 'function') setTimeout(() => syncTick(true), 500);
    }
    App._sumLog = null;
  });
}

        ${lib.days.map(dt => `<div class="prof-row">

    </div>`;
    })() : `<div class="card">
      <div class="row"><h3>Saved plans</h3><span class="spacer"></span><button class="btn sm dark" data-a="plan-save">Save this week</button></div>
      ${savedPlans(prof).length ? `<div class="mt8">
