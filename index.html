  --grad: #5B6B82;          /* flat — gradients retired for the calm look */

  --fill: rgba(37, 42, 49, 0.05);

  --on-ink: #FFFFFF;
  --on-ink-dim: rgba(255, 255, 255, 0.68);
  --grad-violet: #57647C;
  --grad-violet-soft: rgba(87, 100, 124, 0.11);
  --tab-bg: rgba(248, 249, 251, 0.90);
  --hero-bg: #F8F9FB;
  --shadow: 0 1px 2px rgba(37, 42, 49, 0.05), 0 8px 22px rgba(37, 42, 49, 0.06);
  --shadow-big: 0 24px 60px rgba(37, 42, 49, 0.16);
  --r: 18px;
  --rs: 13px;
  --font-d: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --font-display: 'Inter', -apple-system, system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100dvh; overscroll-behavior-y: none;
}
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.15; }
[hidden] { display: none !important; }

#app { max-width: 520px; margin: 0 auto; padding: 0 16px calc(86px + env(safe-area-inset-bottom)); }
.screen { animation: fadein .22s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 12px; }
.hdr .hi { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }
.hdr .sub { color: var(--ink2); font-size: 13.5px; margin-top: 2px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15.5px; font-weight: 800; letter-spacing: .02em; font-family: var(--font-d);
  background: var(--brand); color: var(--accent-ink); box-shadow: var(--shadow); border: 0;
}
svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
.coach-card .ic svg.i, .cat-head .ic svg.i, .cat-row .ic svg.i { vertical-align: middle; }
.streak-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px;
  background: var(--grad-soft); color: var(--warn); font-weight: 700; font-size: 12.5px;
}

/* ---------- cards ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card.hero { background: var(--hero-bg); color: var(--ink); box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; overflow: hidden; }
.card.hero::after { content: none; }
.card.hero::before { content: none; }
.card h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
.kicker { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px; color: var(--ink3); }
.hero .kicker { color: var(--ink3); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--rs); padding: 13px 20px; font-weight: 800; font-size: 15.5px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--brand); color: var(--accent-ink); box-shadow: none; }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn.onhero { background: var(--brand); color: var(--accent-ink); box-shadow: none; }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 11px; font-weight: 700; }
.btn.danger { background: var(--danger-bg); color: var(--danger); }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 14px; border-radius: 999px; background: var(--surface); font-weight: 700; font-size: 13.5px;
  border: 1.5px solid var(--line); color: var(--ink2);
}
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip.grad-on { background: var(--brand); border-color: transparent; color: var(--accent-ink); }

/* ---------- onboarding ---------- */
.ob-wrap { padding-top: 26px; }
.ob-logo { font-size: 42px; }
.ob-title { font-size: 30px; font-weight: 900; letter-spacing: -0.6px; margin: 10px 0 6px; }
.ob-title .grad-text, .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ob-sub { color: var(--ink2); font-size: 15px; line-height: 1.45; }
.ob-progress { height: 6px; border-radius: 3px; background: rgba(20,22,34,0.07); margin: 18px 0 22px; overflow: hidden; }
.ob-progress i { display: block; height: 100%; background: var(--grad); border-radius: 3px; transition: width .3s ease; }
.ob-q { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
.ob-hint { color: var(--ink2); font-size: 13.5px; margin-bottom: 14px; }
.opt-card {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--rs);
  padding: 14px; margin-bottom: 10px; transition: border-color .12s ease, transform .12s ease;
}
.opt-card:active { transform: scale(0.985); }
.opt-card.on { border-color: var(--brand); background: var(--warn-bg); }
.opt-card .e { font-size: 26px; width: 38px; text-align: center; }
.opt-card .t { font-weight: 800; font-size: 15.5px; }
.opt-card .d { color: var(--ink2); font-size: 13px; margin-top: 1px; }
.ob-nav { display: flex; gap: 10px; margin-top: 18px; }
.ob-input {
  width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: 2px solid var(--line);
  border-radius: var(--rs); background: var(--surface); outline: none;
}
.ob-input:focus { border-color: var(--brand); }
.emoji-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.emoji-pick { font-size: 22px; width: 46px; height: 46px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); }
.emoji-pick.on { border-color: var(--brand); background: var(--warn-bg); }
.slider-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: var(--rs); padding: 16px; border: 2px solid var(--line); }
.slider-row .big { font-size: 30px; font-weight: 900; min-width: 54px; text-align: center; }
.stepbtn { width: 44px; height: 44px; border-radius: 13px; background: rgba(20,22,34,0.06); font-size: 22px; font-weight: 800; }

/* ---------- workout ---------- */
.wo-ex { border: 2px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; background: var(--surface); }
.wo-ex.active { border-color: var(--brand); box-shadow: 0 6px 20px rgba(37, 42, 49, 0.13); }
.wo-ex.done-ex { opacity: 0.62; }
.wo-ex-head { display: flex; align-items: center; gap: 10px; }
.wo-ex-head .nm { font-weight: 800; font-size: 16px; flex: 1; }
.wo-target { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.iconbtn { width: 36px; height: 36px; border-radius: 11px; background: rgba(20,22,34,0.05); display: grid; place-items: center; font-size: 16px; flex: none; }
.sets { margin-top: 10px; display: grid; gap: 7px; }
.setrow { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; align-items: center; }
.setrow .sn { color: var(--ink3); font-weight: 800; font-size: 13px; text-align: center; }
.step { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; background: rgba(20,22,34,0.045); border-radius: 12px; height: 44px; overflow: hidden; }
.step button { height: 100%; font-size: 19px; font-weight: 800; color: var(--ink2); }
.step .v { text-align: center; font-weight: 800; font-size: 15.5px; }
.step .v small { display: block; font-size: 9.5px; color: var(--ink3); font-weight: 700; letter-spacing: 0.4px; margin-top: -2px; }
.donebtn { width: 46px; height: 44px; border-radius: 12px; background: rgba(20,22,34,0.05); display: grid; place-items: center; font-size: 19px; color: var(--ink3); }
.donebtn.on { background: var(--good); color: #fff; }
.feel { display: flex; gap: 8px; margin-top: 10px; }
.feel button { flex: 1; padding: 9px; border-radius: 11px; background: rgba(20,22,34,0.045); font-weight: 700; font-size: 13px; color: var(--ink2); }
.feel button.on { background: var(--ink); color: var(--on-ink); }
.wo-head { position: sticky; top: 0; z-index: 12; background: var(--bg); padding-bottom: 10px; }
.wo-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 2px 8px; }
.wo-topbar .t { font-weight: 900; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wo-topbar .elapsed { color: var(--ink2); font-size: 12px; font-weight: 700; }

/* glanceable "now" HUD */
.wo-hud { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 9px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; box-shadow: 0 3px 12px rgba(20,22,34,0.05); }
.wo-hud:active { transform: scale(0.994); }
.wo-hud-badge { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--grad); color: var(--accent-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.wo-hud-badge b { font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
.wo-hud-badge i { font-style: normal; font-size: 9.5px; font-weight: 800; opacity: 0.92; letter-spacing: 0.03em; margin-top: 2px; }
.wo-hud-mid { flex: 1; min-width: 0; }
.wo-hud-ex { font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wo-hud-sub { font-size: 12.5px; color: var(--ink2); font-weight: 600; margin-top: 2px; }
.wo-hud-time { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.wo-hud-time span { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.wo-hud-time small { font-size: 8.5px; color: var(--ink2); font-weight: 800; letter-spacing: 0.14em; margin-top: 3px; }

/* rest timer */
.rest {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--on-ink); border-radius: 18px; padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-big); z-index: 40;
  width: min(430px, calc(100% - 32px)); animation: pop .25s ease;
}
.rest .num { font-size: 27px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 74px; }
.rest .lb { font-size: 11px; color: var(--on-ink-dim); font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
.rest .bar { position: absolute; left: 14px; right: 14px; bottom: 7px; height: 3.5px; border-radius: 2px; background: rgba(255,255,255,0.18); }
.rest .bar i { display: block; height: 100%; border-radius: 2px; background: var(--grad); }
.rest button { background: rgba(255,255,255,0.14); border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 13px; }
/* v3.10: in-workout set add/remove */
.setedit { display: flex; justify-content: flex-end; gap: 8px; margin-top: 9px; }
.setedit button { font-size: 12.5px; font-weight: 800; color: var(--ink2); background: rgba(20,22,34,0.05); border-radius: 10px; padding: 6px 13px; }
.setedit button:active { transform: scale(0.96); }
.setedit button[disabled] { opacity: 0.32; }
/* v3.11: beat-last-time chips */
.beatvs { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.beatvs .bl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink3); margin-right: 2px; }
.bchip { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: rgba(20,22,34,0.05); color: var(--ink2); font-variant-numeric: tabular-nums; }
.bchip.good { background: var(--good-bg); color: var(--good-text); }
.bchip.low { background: var(--danger-bg); color: var(--danger); }
/* v3.11: readiness */
.ready-pill { width: 100%; text-align: left; background: var(--fill); color: var(--ink); border-radius: 12px; padding: 9px 13px; font-weight: 700; font-size: 13px; }
.ready-pill.done { background: var(--fill); }
.ready-pill:active { transform: scale(0.99); }
.rd-group { margin-top: 12px; }
.rd-lb { font-size: 12.5px; font-weight: 800; color: var(--ink2); margin-bottom: 6px; }
.rd-opts { display: flex; gap: 8px; }
.rd-chip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border-radius: 13px; background: rgba(20,22,34,0.045); font-weight: 700; font-size: 12.5px; color: var(--ink2); border: 2px solid transparent; }
.rd-chip .e { font-size: 21px; }
.rd-chip.on { border-color: var(--brand); background: var(--warn-bg); color: var(--ink); }
.rd-out { margin-top: 14px; text-align: center; font-size: 13.5px; color: var(--ink2); }
.rd-out b { color: var(--ink); }
/* v3.10: minimised-workout resume bar (browse the app mid-workout) */
.wo-mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom));
  width: min(430px, calc(100% - 20px)); display: flex; align-items: center; gap: 11px; text-align: left;
  background: var(--ink); color: var(--on-ink); border-radius: 15px; padding: 10px 13px; box-shadow: var(--shadow-big); z-index: 45; }
.wo-mini:active { transform: translateX(-50%) scale(0.99); }
.wo-mini-ic { font-size: 20px; }
.wo-mini-mid { flex: 1; min-width: 0; display: grid; gap: 1px; }
.wo-mini-mid b { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wo-mini-mid small { font-size: 11.5px; opacity: 0.82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.wo-mini-go { flex: none; font-size: 13px; font-weight: 800; background: rgba(255,255,255,0.16); padding: 7px 11px; border-radius: 10px; white-space: nowrap; }
body.wo-min .rest { bottom: calc(126px + env(safe-area-inset-bottom)); }
body.wo-min .screen { padding-bottom: 58px; }

/* ---------- library ---------- */
.search {
  width: 100%; padding: 13px 15px; border-radius: var(--rs); border: 2px solid var(--line);
  background: var(--surface); font-size: 15px; outline: none; margin-bottom: 10px;
}
.search:focus { border-color: var(--brand); }
.filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip { flex: none; padding: 7px 13px; font-size: 12.5px; }
.ex-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border-radius: var(--rs); padding: 11px 13px; margin-bottom: 8px; box-shadow: var(--shadow); }
.ex-row .thumb { width: 44px; height: 44px; border-radius: 12px; background: var(--grad-soft); display: grid; place-items: center; font-size: 20px; flex: none; }
.ex-row .nm { font-weight: 800; font-size: 14.5px; }
.ex-row .mu { color: var(--ink2); font-size: 12px; margin-top: 1px; }
.ex-row .lvl { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 800; color: var(--violet); background: var(--coach-bg); padding: 4px 8px; border-radius: 999px; }

/* ---------- sheets & modals ---------- */
.sheet-veil { position: fixed; inset: 0; background: rgba(15, 17, 26, 0.45); z-index: 60; animation: fadein .18s ease; }
.sheet {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 61;
  width: min(520px, 100%); max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom));
  animation: slideup .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideup { from { transform: translate(-50%, 60px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet .grab { width: 40px; height: 4.5px; border-radius: 3px; background: rgba(20,22,34,0.16); margin: 4px auto 12px; }
.modal-veil { position: fixed; inset: 0; background: rgba(15,17,26,0.5); z-index: 70; display: grid; place-items: center; padding: 22px; animation: fadein .18s ease; }
.modal { background: var(--bg); border-radius: 22px; padding: 20px; width: min(420px, 100%); max-height: 86dvh; overflow-y: auto; animation: pop .25s ease; }

/* exercise detail */
.exd-anim { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.exd-anim canvas { width: 100%; height: 215px; display: block; }
.exd-title { font-size: 21px; font-weight: 900; letter-spacing: -0.3px; }
.exd-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
.tag { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: rgba(20,22,34,0.06); color: var(--ink2); }
.tag.hot { background: var(--grad-soft); color: var(--warn); }
.guide h4 { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink3); margin: 15px 0 7px; }
.guide li { margin: 0 0 7px 18px; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
.guide .mist li { color: var(--brand-ink); }
.breath { background: var(--rest-bg); border-radius: var(--rs); padding: 11px 13px; font-size: 13.5px; color: var(--mm-2); margin-top: 13px; }
.musclemap { width: 100%; max-width: 250px; display: block; margin: 4px auto 0; }
.mm-body path, .mm-body circle, .mm-body rect { fill: var(--coach-bg); }
.mm-p * { fill: var(--mm-hi); } .mm-p circle, .mm-p rect, .mm-p path { fill: var(--mm-hi); }
.mm-s * { fill: var(--amber); }
/* v3.7 anatomical bodies */
.mm-skin path, .mm-skin ellipse { fill: var(--coach-bg); stroke: var(--line-2); stroke-width: 0.7; stroke-linejoin: round; }
.mm-m path, .mm-m rect, .mm-m ellipse { fill: #E4E0EE; stroke: var(--surface); stroke-width: 0.7; stroke-linejoin: round; }
.mm-m.mm-p path, .mm-m.mm-p rect, .mm-m.mm-p ellipse { fill: var(--mm-hi); }
.mm-m.mm-s path, .mm-m.mm-s rect, .mm-m.mm-s ellipse { fill: var(--amber); }
.mm-m.mm-hot path, .mm-m.mm-hot rect, .mm-m.mm-hot ellipse { fill: inherit; }
.musclemap .mm-seam { fill: none !important; stroke: var(--surface) !important; stroke-width: 0.75; stroke-linecap: round; }
.mm-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; fill: var(--ink3); font-family: inherit; }
.mm-key { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--ink2); font-weight: 600; margin-top: 8px; }
.mm-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---------- plan ---------- */
.day-card { margin-bottom: 12px; }
.day-head { display: flex; align-items: center; gap: 10px; }
.day-num { width: 40px; height: 40px; border-radius: 13px; background: var(--grad); color: var(--accent-ink); display: grid; place-items: center; font-weight: 900; flex: none; }
.day-head .focus { color: var(--ink2); font-size: 12.5px; margin-top: 1px; }
.plan-ex { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.plan-ex:last-child { border-bottom: 0; }
.plan-ex .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; }
.plan-ex .sr { margin-left: auto; color: var(--ink2); font-size: 12.5px; font-weight: 700; flex: none; }

/* ---------- progress ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 14px; }
.tile { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 13px 14px; }
.tile .lb { font-size: 12px; color: var(--ink2); font-weight: 700; }
.tile .v { font-size: 27px; font-weight: 900; letter-spacing: -0.5px; margin-top: 3px; }
.tile .v small { font-size: 13px; color: var(--ink3); font-weight: 700; }
.tile .delta { font-size: 11.5px; font-weight: 700; color: var(--good-text); margin-top: 2px; }
.tile .delta.dn { color: var(--ink3); }
.chart { width: 100%; height: auto; display: block; }
.ch-tick { font-size: 9.5px; fill: var(--ink3); font-family: inherit; font-variant-numeric: tabular-nums; }
.ch-val { font-size: 9.5px; font-weight: 700; fill: var(--ink2); font-family: inherit; }
.ch-band { font-size: 8.5px; font-weight: 700; fill: #0e7d57; font-family: inherit; letter-spacing: 0.5px; }
.ch-wrap { position: relative; }
.ch-tip { position: absolute; background: var(--ink); color: var(--on-ink); font-size: 12px; border-radius: 10px; padding: 7px 10px; pointer-events: none; z-index: 5; line-height: 1.45; box-shadow: var(--shadow-big); }
.ch-tip-t { font-weight: 800; font-size: 11px; color: var(--on-ink-dim); }
.ch-legend { display: flex; gap: 14px; margin-bottom: 6px; }
.ch-key { font-size: 12px; color: var(--ink2); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.ch-key i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.chart-empty { color: var(--ink3); font-size: 13.5px; text-align: center; padding: 26px 10px; }
.coach-card { display: flex; gap: 12px; align-items: flex-start; }
.coach-card .ic { font-size: 22px; width: 40px; height: 40px; border-radius: 13px; background: var(--grad-soft); display: grid; place-items: center; flex: none; }
.coach-card .tt { font-weight: 800; font-size: 14.5px; }
.coach-card .tx { color: var(--ink2); font-size: 13.5px; line-height: 1.5; margin-top: 2px; }
.pr-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.pr-row:last-child { border: 0; }
.pr-row .medal { font-size: 18px; }
.pr-row .w { margin-left: auto; font-weight: 900; }
.seg { display: flex; background: rgba(20,22,34,0.05); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 8px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- profile ---------- */
.prof-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.prof-row:last-child { border: 0; }
.prof-row .em { font-size: 24px; width: 44px; height: 44px; border-radius: 50%; background: var(--grad-soft); display: grid; place-items: center; flex: none; }
.prof-row .nm { font-weight: 800; }
.prof-row .meta { color: var(--ink2); font-size: 12.5px; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.set-row:last-child { border: 0; }
.set-row .l { font-weight: 700; }
.set-row .d { color: var(--ink2); font-size: 12.5px; margin-top: 1px; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: min(520px, 100%); background: rgba(255,255,255,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; border-top: 1px solid var(--line); z-index: 50;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabs button { flex: 1; display: grid; place-items: center; gap: 2px; padding: 6px 0 4px; color: var(--ink3); font-size: 10.5px; font-weight: 800; border-radius: 12px; }
.tabs button svg { width: 23px; height: 23px; }
.tabs button.on { color: var(--ink); }
.tabs button.on svg .fillme { fill: url(#tabgrad); }
.tabs button.on svg { stroke: var(--brand); }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--on-ink); padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
  z-index: 90; box-shadow: var(--shadow-big); animation: pop .22s ease; max-width: calc(100% - 40px); text-align: center;
}

/* summary */
.sum-hero { text-align: center; padding: 8px 0 4px; }
.sum-hero .big { font-size: 42px; }
.sum-hero h2 { font-size: 24px; font-weight: 900; letter-spacing: -0.4px; margin-top: 4px; }
.sum-stats { display: flex; gap: 10px; margin: 16px 0 4px; }
.sum-stats .s { flex: 1; background: var(--surface); border-radius: var(--rs); padding: 11px; text-align: center; box-shadow: var(--shadow); }
.sum-stats .v { font-size: 21px; font-weight: 900; }
.sum-stats .l { font-size: 11px; color: var(--ink2); font-weight: 700; margin-top: 1px; }
.prog-msg { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; font-size: 13.5px; color: var(--ink2); border-bottom: 1px solid var(--line); }
.prog-msg:last-child { border: 0; }
.prog-msg .k { flex: none; font-size: 15px; }
.pr-banner { background: var(--grad-violet); color: var(--accent-ink); border-radius: var(--rs); padding: 12px 14px; font-weight: 800; font-size: 14.5px; margin: 10px 0; box-shadow: var(--shadow); animation: pop .3s ease; }

.empty { text-align: center; color: var(--ink2); padding: 30px 18px; font-size: 14.5px; line-height: 1.5; }
.empty .e { font-size: 38px; margin-bottom: 8px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.muted { color: var(--ink3); font-size: 12.5px; }

/* ---------- week builder ---------- */
.wb { background: var(--surface); border: 2px solid var(--line); border-radius: var(--rs); padding: 10px 12px; }
.wb-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.wb-row:last-child { border: 0; }
.wb-day { width: 34px; font-weight: 900; font-size: 12.5px; color: var(--ink3); flex: none; }
.wb-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.wb-chip { padding: 6px 10px; border-radius: 999px; background: rgba(20,22,34,0.045); font-weight: 700; font-size: 12px; color: var(--ink2); border: 1.5px solid transparent; }
.wb-chip.on { background: var(--grad); color: var(--accent-ink); }

/* ---------- week strip ---------- */
.week-strip { display: flex; gap: 6px; }
.ws-day { flex: 1; background: rgba(20,22,34,0.04); border-radius: 12px; padding: 7px 0 6px; text-align: center; display: grid; gap: 1px; border: 2px solid transparent; transition: transform 0.08s ease; }
.ws-day:active { transform: scale(0.93); }
.ws-day .ws-l { font-size: 10px; font-weight: 800; color: var(--ink3); }
.ws-day .ws-e { font-size: 14px; }
.ws-day.today { border-color: var(--brand); background: var(--warn-bg); }
.ws-day.done { background: var(--good-bg); }
.ws-day.done .ws-e { color: var(--good-text); font-weight: 900; }

/* ---------- activity hero cards ---------- */
.card.hero-rest { background: var(--rest-bg); }
.hero-rest .kicker { color: var(--violet); }
.hero-rest-tx { font-size: 13.5px; color: var(--ink2); line-height: 1.5; margin-top: 4px; }
.next-lift { margin-top: 10px; font-size: 13px; color: var(--ink2); }
.card.hero-sport { background: var(--hero-bg); color: var(--ink); box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; overflow: hidden; }
.card.hero-sport::after { content: none; }

/* ---------- exercise demo video ---------- */
.vid-wrap { position: relative; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: #101218; aspect-ratio: 16 / 9; }
.vid-facade { display: block; width: 100%; height: 100%; position: relative; }
.vid-thumb { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; }
.vid-playbtn {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 60px; height: 60px; border-radius: 50%; background: var(--grad); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 22px; padding-left: 5px;
  box-shadow: 0 8px 24px rgba(255, 77, 61, 0.5); transition: transform .15s ease;
}
.vid-facade:active .vid-playbtn { transform: translate(-50%, -50%) scale(0.92); }
.vid-tag {
  position: absolute; left: 10px; bottom: 10px; background: rgba(10,12,18,0.72); color: #fff;
  font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px);
}
.vid-frame { width: 100%; height: 100%; }
.vid-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.vid-alt { display: block; margin: 8px auto 0; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: rgba(20,22,34,0.05); padding: 7px 12px; border-radius: 999px; }
.vid-note { background: #FFF6E8; color: var(--amber); border-radius: var(--rs); padding: 10px 13px; font-size: 13px; font-weight: 600; margin-top: 10px; }

.vid-retry { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--amber); background: rgba(138,91,22,0.12); padding: 6px 11px; border-radius: 999px; }

a.vid-retry { text-decoration: none; display: inline-block; }

.coach-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.coach-chips .chip { font-size: 12px; padding: 7px 12px; }

/* ---------- custom workout builder ---------- */
.cwx { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--rs); padding: 10px 12px; margin-bottom: 8px; }
.cwx-controls { display: grid; grid-template-columns: 1fr 1.28fr 0.92fr; gap: 8px; margin-top: 9px; }
.cwx-ctl { display: flex; align-items: center; justify-content: center; gap: 4px; background: rgba(20,22,34,0.045); border-radius: 10px; padding: 6px 2px; min-width: 0; }
.cwx-ctl .lb { font-size: 9.5px; font-weight: 800; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.4px; }
.cwx-ctl b { font-size: 13px; min-width: 26px; text-align: center; white-space: nowrap; }
.cwx-ctl button { font-size: 16px; font-weight: 800; color: var(--ink2); padding: 0 5px; }
.cwx-rest b { color: var(--violet); }
.cwx-ctl b.cwv { cursor: text; border-bottom: 1.5px dashed rgba(20,22,34,0.28); padding-bottom: 1px; line-height: 1.05; }
.cwx-ctl b.cwv:active { opacity: 0.55; }
.cwx-ctl b.cwv:has(.cwv-input) { border-bottom-color: transparent; }
.cwv-input { width: 100%; max-width: 60px; min-width: 30px; border: 0; background: var(--surface); text-align: center;
  font-weight: 800; font-size: 13px; outline: none; color: var(--ink); padding: 1px 2px;
  border-radius: 7px; box-shadow: 0 0 0 1.5px var(--violet, var(--violet)); }

.step .v.tappable { cursor: text; }
.step .v.tappable > span { border-bottom: 1.5px dashed rgba(20,22,34,0.22); padding-bottom: 1px; }
.step-input { width: 100%; max-width: 74px; border: 0; background: transparent; text-align: center; font-weight: 800; font-size: 15.5px; outline: none; color: var(--ink); padding: 0; }

/* ============ v2.0 — in-gym, badges, heatmap, prefs ============ */
.wo-last { font-size: 12px; color: var(--ink3); font-weight: 600; margin-top: 3px; }
.wo-plates { font-size: 12px; color: var(--ink2); font-weight: 700; margin-top: 3px;
  background: var(--grad-soft); display: inline-block; padding: 3px 9px; border-radius: 999px; }
.setrow.warmrow { opacity: 0.82; }
.setrow.warmrow .warmcell { font-size: 11px; font-weight: 800; color: var(--warn); text-transform: uppercase; letter-spacing: 0.4px; text-align: center; }
.setrow.warmrow .wv { font-size: 13.5px; font-weight: 700; color: var(--ink2); }
.step.holdgo { grid-column: span 2; background: var(--ink); color: var(--on-ink); border-radius: var(--rs);
  font-weight: 800; font-size: 14px; padding: 10px; border: none; }
.step.holdgo.running { background: var(--grad); animation: pulse 1s ease infinite; }
.trim-link { background: none; border: none; color: var(--brand-ink); font-weight: 800; font-size: 13px;
  text-decoration: underline; text-underline-offset: 3px; opacity: 0.92; padding: 6px 0 0; cursor: pointer; }
.pr-banner.badgeb { background: linear-gradient(135deg, #FF7A1A, #FFB020); box-shadow: 0 6px 18px rgba(255, 140, 20, 0.35); }
/* badges */
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.badge { border: 1.5px solid var(--line); border-radius: var(--rs); padding: 10px 6px; text-align: center; opacity: 0.55; filter: grayscale(0.9); }
.badge.got { opacity: 1; filter: none; border-color: transparent; background: var(--grad-soft); box-shadow: 0 3px 10px rgba(37, 42, 49, 0.12); }
.badge .bi { font-size: 24px; }
.badge .bn { font-size: 11px; font-weight: 800; margin-top: 3px; line-height: 1.2; }
.badge .bp { font-size: 10px; color: var(--ink3); font-weight: 700; margin-top: 2px; }
/* heatmap */
.hm { display: flex; gap: 4px; justify-content: space-between; }
.hm-col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.hm-col i { display: block; width: 100%; aspect-ratio: 1; border-radius: 4px; background: rgba(20, 22, 34, 0.06); }
.hm-col i.lift { background: var(--grad); }
.hm-col i.sport { background: var(--mm-2); }
.hm-col i.both { background: linear-gradient(135deg, var(--mm-hi) 50%, var(--mm-2) 50%); }
.hm-col i.fut { background: none; border: 1px dashed var(--line); }
.hm-key { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink3); font-weight: 700; }
.hm-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: rgba(20,22,34,0.06); }
.hm-key .lift, .hm-key span:nth-child(1) i { background: var(--grad); }
.hm-key span:nth-child(2) i { background: var(--mm-2); }
.hm-key span:nth-child(3) i { background: linear-gradient(135deg, var(--mm-hi) 50%, var(--mm-2) 50%); }
/* exercise preference buttons */
.prefrow { display: flex; gap: 9px; }
.prefbtn { flex: 1; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--rs);
  padding: 11px; font-weight: 800; font-size: 13.5px; color: var(--ink2); cursor: pointer; }
.prefbtn.on-fav { border-color: transparent; background: var(--grad-soft); color: var(--warn); }
.prefbtn.on-ban { border-color: transparent; background: var(--danger-bg); color: var(--danger); }
/* builder superset toggle */
.cwx-ctl.cwx-link.on { background: var(--coach-bg); color: var(--violet); border-color: transparent; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
/* ============ v2.1 — coach mode ============ */
.paircode { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 17px; font-weight: 800;
  letter-spacing: 1.5px; text-align: center; background: var(--grad-soft); color: var(--warn);
  border-radius: var(--rs); padding: 16px 10px; margin-top: 12px; user-select: all; word-break: break-all; }
.coach-note { background: var(--coach-bg); border: 1.5px solid #E7DEFF; color: #4B3A78; border-radius: var(--rs);
  padding: 10px 13px; font-size: 13.5px; line-height: 1.45; margin-bottom: 12px; }
.wo-note { font-size: 12.5px; color: var(--violet); background: #F6F2FF; border-radius: 9px;
  padding: 5px 9px; margin-top: 4px; display: inline-block; line-height: 1.4; }
.cwx-note { width: 100%; margin-top: 7px; border: 1.5px solid var(--line); border-radius: 10px;
  padding: 8px 11px; font-size: 12.5px; font-family: inherit; background: var(--coach-bg); }
.cwx-note:focus { outline: none; border-color: #B9A5F0; }
.switchback { display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  color: var(--ink3); font-weight: 800; font-size: 12.5px; padding: 0 0 10px; }
.switchback:active { opacity: 0.6; }
/* ============ v2.3 — history editing ============ */
.hist-sets { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.hist-chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 13px; font-weight: 800; font-size: 13px; color: var(--ink); cursor: pointer; }
.hist-chip:active { background: var(--grad-soft); }
.hist-editrow { display: inline-flex; align-items: center; gap: 6px; background: var(--grad-soft);
  border-radius: 999px; padding: 5px 8px; font-weight: 800; }
.hist-in { width: 56px; border: 1.5px solid rgba(20,22,34,0.15); border-radius: 9px; padding: 6px 8px;
  font-size: 14px; font-weight: 800; text-align: center; background: var(--surface); }
.hist-in:focus { outline: none; border-color: var(--brand); }
.hist-ok { width: 30px; height: 30px; border: none; border-radius: 50%; background: var(--ink); color: var(--on-ink);
  font-weight: 900; cursor: pointer; }
.hist-del { width: 30px; height: 30px; border: none; border-radius: 50%; background: none; font-size: 14px; cursor: pointer; }
/* ============ v2.4 — records vault ============ */
.rmx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rmx .c { border: 1.5px solid var(--line); border-radius: 13px; padding: 9px 4px; text-align: center; }
.rmx .c.off { opacity: 0.45; }
.rmx .n { font-size: 10.5px; font-weight: 800; color: var(--ink3); letter-spacing: 0.5px; }
.rmx .v { font-size: 15px; font-weight: 900; margin-top: 2px; }
.rmx .d { font-size: 10px; color: var(--ink3); font-weight: 700; margin-top: 1px; }

/* ============ v2.6 — the glow-up: editorial-sport type & surfaces ============ */
.hi, h2, h3, .exd-title, .tile .v, .sum-stats .s .v, .wo-topbar .t, .day-num,
.paircode, .rmx .v, .btn.primary, .btn.dark, .btn.onhero, .streak-chip {
  font-family: var(--font-d); letter-spacing: -0.01em;
}
.hi { letter-spacing: -0.03em; }
.tile .v, .sum-stats .s .v { letter-spacing: -0.02em; }
.card { border: 1px solid var(--line); }
.tile { border: 1px solid var(--line); }
.card.hero, .card.hero-sport { border: 1px solid var(--line); }
.tabs { background: var(--tab-bg); }
.tabs button.on svg .fillme { fill: var(--brand); }
.chip.grad-on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.wb-chip.on { background: var(--ink); color: var(--on-ink); }
.streak-chip { background: var(--ink); color: var(--bg); }

/* ============ v3.0 — editorial glow-up (Claude Design, Aug 2026) ============ */

   font-sizes. */

::selection { background: rgba(91, 107, 130, 0.22); }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 7px; }

/* ---- cards & surfaces ---- */

/* ---- buttons ---- */

/* ---- stat tiles: oversized numerals ---- */

.tile { padding: 15px 15px 14px; min-height: 98px; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; }
.tile .lb { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink3); }

.tile .delta { margin-top: 7px; font-size: 11.5px; }
.tile .spark { position: absolute; right: 14px; bottom: 14px; width: 66px; height: 24px; opacity: 0.92; }

/* ---- charts: hairline grid, ink + flame series, bolder labels ---- */

      drawScene(g, anim.scene, P, anim.prop);
      const behind = anim.propBehind;
      if (behind) drawProp(g, anim.prop, P, pose);
      drawFigure(g, pose, P);
      if (!behind) drawProp(g, anim.prop, P, pose);

/* ============ LiftOff — animation pose definitions ============
   Poses authored with 2-bone IK: specify joint targets, angles are computed.
   Figure faces RIGHT. Box 300×230, floor y=200.
*/
'use strict';

function _ik(root, target, L1, L2, bend) {
  let dx = target[0] - root[0], dy = target[1] - root[1];
  let d = Math.hypot(dx, dy);
  d = U.clamp(d, Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
  const base = Math.atan2(dx, dy); // measured from straight-down
  const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const A = Math.acos(U.clamp(cosA, -1, 1));
  const a1 = base + bend * A;
  const mid = [root[0] + Math.sin(a1) * L1, root[1] + Math.cos(a1) * L1];
  const a2 = Math.atan2(target[0] - mid[0], target[1] - mid[1]);
  return [a1 / D2R, a2 / D2R];
}
const _sh = (hip, torso) => [hip[0] + Math.sin(torso * D2R) * RIG.torso, hip[1] - Math.cos(torso * D2R) * RIG.torso];

/* pose builder: targets → angles.
   o: hip, torso, neck, ankleN/[x,y], ankleF, wristN, wristF, legN/F raw, armN/F raw,
      bendLegN/F (+1 knee fwd), bendArmN/F (+1 elbow fwd), footN, footF */
function P(o) {
  const hip = o.hip, torso = o.torso || 0;
  const sh = _sh(hip, torso);
  const p = { hip, torso, neck: o.neck };
  p.legN = o.legN || (o.ankleN ? _ik(hip, o.ankleN, RIG.thigh, RIG.shin, o.bendLegN != null ? o.bendLegN : 1) : [0, 0]);
  p.legF = o.legF || (o.ankleF ? _ik(hip, o.ankleF, RIG.thigh, RIG.shin, o.bendLegF != null ? o.bendLegF : 1) : null) || undefined;
  p.armN = o.armN || (o.wristN ? _ik(sh, o.wristN, RIG.upper, RIG.fore + RIG.hand, o.bendArmN != null ? o.bendArmN : -1) : [10, 6]);
  p.armF = o.armF || (o.wristF ? _ik(sh, o.wristF, RIG.upper, RIG.fore + RIG.hand, o.bendArmF != null ? o.bendArmF : -1) : null) || undefined;
  if (o.footN != null) p.footN = o.footN;
  if (o.footF != null) p.footF = o.footF;
  return p;
}

/* ============ LiftOff — anatomical muscle body map (front + back SVG) ============
   Parametric figures: one geometry engine, female/male measurement presets.
   Shapes are point lists smoothed with Catmull-Rom → cubic beziers, authored for
   the LEFT half and mirrored around x=50, so bodies are organic AND symmetric.
   Muscles tile the silhouette (thin light seams between them) like a printed
   anatomy chart. Coordinate space per figure: 0..100 × 0..170.
   API: MuscleMap.svg(prim, sec, opts) — muscles-worked (classes mm-p/mm-s);
        MuscleMap.heat(vals, opts) — recovery heat.  opts.sex: 'female'|'male'. */
'use strict';

const MuscleMap = (() => {
  /* half-widths from the centre line; shared Y landmarks live in buildFigures */
  const SEXES = {
    female: { headRx: 6.7, headRy: 8.6, neckW: 4.2, shTip: 20.6, deltOut: 21.8, armpitX: 15.4,
              ribs: 12.6, waist: 10.6, iliac: 13.4, hip: 17.2, thighMid: 15.0,
              kneeOut: 7.6, kneeIn: 3.4, calfOut: 8.8, calfIn: 2.9, ankleOut: 4.4,
              armW: 5.2, elbowW: 3.7, wristW: 2.4, absW: 8.6, gluteW: 15.6, gluteBot: 98.5 },
    male:   { headRx: 7.0, headRy: 8.8, neckW: 5.3, shTip: 24.2, deltOut: 25.4, armpitX: 18.6,
              ribs: 15.4, waist: 13.6, iliac: 14.6, hip: 15.6, thighMid: 14.8,
              kneeOut: 7.9, kneeIn: 3.5, calfOut: 9.4, calfIn: 3.0, ankleOut: 4.7,
              armW: 6.2, elbowW: 4.5, wristW: 2.8, absW: 9.8, gluteW: 14.8, gluteBot: 96.5 },
  };

  const fx = n => Math.round(n * 10) / 10;
  /* Catmull-Rom smoothing → cubic bezier path. pts = [[x,y],...] */
  function crPath(pts, closed) {
    const n = pts.length;
    const at = i => pts[((i % n) + n) % n];
    let d = `M ${fx(pts[0][0])} ${fx(pts[0][1])}`;
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p1 = at(i), p2 = at(i + 1);
      const p0 = (!closed && i === 0) ? p1 : at(i - 1);
      const p3 = (!closed && i === segs - 1) ? p2 : at(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C ${fx(c1[0])} ${fx(c1[1])} ${fx(c2[0])} ${fx(c2[1])} ${fx(p2[0])} ${fx(p2[1])}`;
    }
    return d + (closed ? ' Z' : '');
  }
  const mir = d => `<path d="${d}"/><path d="${d}" transform="translate(100 0) scale(-1 1)"/>`;
  const mirRaw = s => `${s}<g transform="translate(100 0) scale(-1 1)">${s}</g>`;

  function buildFigures(sex) {
    const P = SEXES[sex];
    const p = (o, y) => [50 - o, y];             // point at offset o LEFT of centre
    const sh = pts => crPath(pts, true);          // smooth closed shape
    const seamD = pts => `<path class="mm-seam" d="${crPath(pts, false)}"/>`;

    /* Y landmarks */
    const nB = 25.4;                              // neck base
    const elbowX = P.shTip + 0.8, wristX = P.shTip + 1.4;

    /* ---------- skin silhouette ---------- */
    const head = `<ellipse cx="50" cy="11.4" rx="${P.headRx}" ry="${P.headRy}"/>`;
    const torso = sh([
      p(0, 19.6), p(P.neckW, 19.8), p(P.neckW + 0.3, nB),         // neck side
      p(P.shTip - 6.5, 26.9), p(P.shTip, 29.3),                    // trap slope → shoulder tip
      p(P.armpitX + 1.4, 36.8), p(P.armpitX, 40.5),                // armpit
      p(P.ribs, 52), p(P.waist, 61), p(P.iliac, 68), p(P.hip, 77), // side
      p(P.hip - 1.6, 82.5), p(6.4, 86.4), p(0, 87.6),              // groin to centre
    ].concat([p(-0.01, 19.6)]));                                   // close up the centre
    const leg = sh([
      p(P.hip - 0.3, 78.6), p(P.thighMid, 97), p(P.kneeOut + 1.5, 111),
      p(P.kneeOut, 119), p(P.kneeOut + 0.2, 125.5),
      p(P.calfOut, 133), p(P.calfOut - 1.5, 141.5), p(P.ankleOut, 153),   // outer calf → ankle
      p(P.ankleOut + 0.7, 157), p(P.ankleOut + 2.7, 159.6), p(P.ankleOut + 1.5, 162),  // foot out
      p(3.3, 161.6), p(2.2, 157.6), p(2.3, 153),                    // foot in → inner ankle
      p(2.7, 146), p(P.calfIn, 135.5), p(3.2, 127),                 // inner calf
      p(P.kneeIn, 119.5), p(3.8, 110), p(2.3, 97), p(1.2, 88.4),    // inner thigh
      p(5.2, 86.8), p(P.hip - 3.6, 81.4),                           // groin
    ]);
    const arm = sh([
      p(P.shTip - 2.4, 29.7), p(P.deltOut - 0.3, 32.2), p(P.deltOut, 36.4),
      p(P.deltOut - 1.1, 41.6),                                     // outer delt
      p(elbowX + P.elbowW, 57.5), p(elbowX + P.elbowW - 0.7, 63),
      p(wristX + P.wristW, 82),                                     // outer forearm
      p(wristX + P.wristW + 1.1, 88), p(wristX + P.wristW + 0.4, 92.5),
      p(wristX - 0.3, 96), p(wristX - P.wristW - 0.4, 91.5), p(wristX - P.wristW, 84), // hand
      p(elbowX - P.elbowW + 0.2, 62.5), p(elbowX - P.elbowW + 0.7, 58),
      p(P.armpitX + 0.6, 42.5), p(P.armpitX + 1, 38.2),             // inner arm → armpit
    ]);
    const skin = `<g class="mm-skin">${head}${mir(torso)}${mir(leg)}${mir(arm)}</g>`;

    /* ---------- muscle regions (tiling the body) ---------- */
    const R = {};

    /* — arms (same silhouette both views) — */
    const deltShape = sh([
      p(P.shTip - 3.4, 30.1), p(P.deltOut - 0.8, 32.4), p(P.deltOut - 0.4, 36.4),
      p(P.deltOut - 1.5, 41.2), p(P.shTip + 0.4, 44.9),             // deltoid point
      p(P.armpitX + 1.1, 41), p(P.armpitX + 1.5, 36.4), p(P.armpitX + 2.6, 32.6),
    ]);
    const upperArm = endY => sh([
      p(P.shTip + 0.2, 45.6), p(elbowX + P.elbowW - 0.5, 52),
      p(elbowX + P.elbowW - 0.9, endY - 1), p(elbowX - 0.5, endY),
      p(elbowX - P.elbowW + 0.8, endY - 0.7), p(P.armpitX + 1.2, 43.6),
    ]);
    const foreArm = sh([
      p(elbowX - 0.3, 61.7), p(elbowX + P.elbowW - 0.8, 63.5), p(wristX + P.wristW + 0.3, 71),
      p(wristX + P.wristW - 0.2, 81.5), p(wristX - P.wristW + 0.2, 81.8),
      p(elbowX - P.elbowW + 1, 66),
    ]);
    R.delts = { fig: 'f', s: mir(deltShape) };
    R.biceps = { fig: 'f', s: mir(upperArm(59.5)) };
    R.forearms_f = { fig: 'f', s: mir(foreArm) };
    R.delts_b = { fig: 'b', s: mir(deltShape) };
    R.triceps = { fig: 'b', s: mir(upperArm(60.5)) + mirRaw(seamD([p(elbowX + 1.6, 48), p(elbowX + 1.2, 54), p(elbowX - 0.4, 58.5)])) };
    R.forearms_b = { fig: 'b', s: mir(foreArm) };

    /* — front torso — */
    R.traps_f = { fig: 'f', s: mir(sh([
      p(P.neckW + 0.5, nB + 0.2), p(P.shTip - 6.3, 27.3), p(P.shTip - 3, 29.2),
      p(P.shTip - 4.5, 29.9), p(P.neckW + 1, 28.6),
    ])) };
    R.chest = { fig: 'f', s: mir(sh([
      p(0.9, 33.4), p(7.5, 32.7), p(12.5, 33.1), p(P.armpitX + 0.8, 34.8),   // clavicle line
      p(P.armpitX - 0.2, 39.8), p(P.armpitX - 1.2, 43),                       // underarm
      p(11.5, 46.4), p(5.5, 47.4), p(0.9, 46.9),                              // pec bottom
    ])) };
    {
      const rows = [[47.9, 6.2], [54.9, 6.2], [61.9, 6.2], [68.9, 8.2]];      // [y, h]
      let abs = '';
      rows.forEach(([y, h], i) => {
        const w = P.absW - i * 0.5;
        abs += `<rect x="${fx(50 - w)}" y="${fx(y)}" width="${fx(w - 0.5)}" height="${h}" rx="2.4"/>` +
               `<rect x="50.5" y="${fx(y)}" width="${fx(w - 0.5)}" height="${h}" rx="2.4"/>`;
      });
      R.abs = { fig: 'f', s: abs };
    }
    R.obliques = { fig: 'f', s: mir(sh([
      p(P.armpitX - 1.6, 44), p(12, 46.8), p(P.absW + 0.7, 49.5),             // under the pec
      p(P.absW + 0.6, 60), p(P.absW - 0.3, 70), p(8.2, 76.6),                 // beside the abs
      p(P.iliac - 1.5, 74.5), p(P.iliac - 0.6, 68), p(P.waist - 0.5, 61), p(P.ribs - 0.5, 52),
    ])) };

    /* — front legs — */
    const sart = [p(P.hip - 2.6, 81.2), p(9.2, 91), p(5.7, 101.5), p(4.3, 111.5)]; // sartorius line
    R.quads = { fig: 'f', s: mir(sh([
      p(P.hip - 1.4, 79.8), p(P.thighMid - 0.5, 97), p(P.kneeOut + 0.9, 110.5),
      p(P.kneeOut - 0.4, 116.6), p(P.kneeIn + 1.4, 117),                       // knee top
      sart[3], sart[2], sart[1], sart[0],                                      // back up the sartorius
    ]))
      + mirRaw(seamD([p(10.6, 87), p(9.4, 97), p(7.6, 107), p(6.8, 114.5)]))   // rectus femoris
      + mirRaw(seamD([p(6.3, 103), p(5.2, 109), p(4.9, 114.8)])) };            // vastus medialis
    R.adductors = { fig: 'f', s: mir(sh([
      p(8.6, 90.6), p(5.5, 100.5), p(4.4, 109), p(3.9, 111), p(3.6, 104),
      p(2.4, 95.5), p(1.4, 88.9), p(4.8, 87.6),
    ])) };
    R.calves_f = { fig: 'f', s: mir(sh([
      p(P.kneeIn + 2.5, 126.4), p(6.7, 130.5), p(6.1, 139), p(4.9, 149.5),
      p(3.4, 149.8), p(3.6, 139), p(4.1, 130), p(4.5, 126.8),
    ])) + mirRaw(seamD([p(7.6, 128), p(8.3, 134), p(7.5, 143)])) };

    /* — back torso — */
    R.traps = { fig: 'b', s: mir(sh([
      p(0.7, 21.6), p(P.neckW + 0.6, 23), p(P.shTip - 3, 29.2),
      p(10.4, 35.8), p(2.3, 47), p(0.7, 48.6),
    ])) };
    R.upperback = { fig: 'b', s: mir(sh([
      p(P.armpitX + 0.9, 35.4), p(P.armpitX - 0.4, 40.6), p(8.9, 44.4), p(9.9, 37.6),
    ])) };
    R.lats = { fig: 'b', s: mir(sh([
      p(P.armpitX - 0.7, 41.8), p(P.ribs - 0.3, 50.5), p(P.waist - 0.4, 60),
      p(3.4, 69.3), p(1.7, 70.3), p(1.9, 55.5), p(2.8, 48.6), p(9, 45.2),
    ])) };
    R.lowback = { fig: 'b', s: mir(sh([
      p(1, 62.2), p(4.3, 63.2), p(4.7, 71), p(3.9, 79.6), p(1, 80.4),
    ])) };
    R.glutes = { fig: 'b', s: mir(sh([
      p(1, 73.8), p(8, 72.6), p(13.2, 75.2), p(P.gluteW, 82),
      p(P.gluteW - 1.6, 91), p(8.6, P.gluteBot), p(2.7, P.gluteBot - 1.4), p(1, 88),
    ])) + mirRaw(seamD([p(3.4, 76.4), p(8.8, 78.8), p(12.8, 83.4)])) };
    R.hams = { fig: 'b', s: mir(sh([
      p(12.9, P.gluteBot + 1.2), p(13.1, 107), p(11.5, 115.5), p(9.7, 122.8),
      p(5.5, 123.2), p(4.3, 112), p(4.7, 102), p(8, P.gluteBot + 0.4),
    ])) + mirRaw(seamD([p(8.6, P.gluteBot + 2), p(8.2, 108), p(7.6, 121)])) };
    R.calves_b = { fig: 'b', s: mir(sh([
      p(9.7, 126.2), p(10.5, 132.5), p(9.4, 141.5), p(7.4, 146.2),
      p(5.1, 143.6), p(4.2, 135), p(4.7, 127.8), p(7, 125.2),
    ])) + mirRaw(seamD([p(7.3, 127), p(7.1, 136), p(6.9, 144)])) };

    return { skin, R };
  }

  const CACHE = {};
  const figs = sex => { sex = SEXES[sex] ? sex : 'female'; return CACHE[sex] || (CACHE[sex] = buildFigures(sex)); };

  const MUSCLE_TO_REGIONS = {
    chest: ['chest'], shoulders: ['delts', 'delts_b'], biceps: ['biceps'], triceps: ['triceps'],
    forearms: ['forearms_f', 'forearms_b'], abs: ['abs'], obliques: ['obliques'], core: ['abs', 'obliques'],
    quads: ['quads'], adductors: ['adductors'], calves: ['calves_f', 'calves_b'],
    lats: ['lats'], upperback: ['traps', 'traps_f', 'upperback'], lowerback: ['lowback'],
    glutes: ['glutes'], hamstrings: ['hams'], reardelts: ['delts_b'],
  };

  /* recovery heat: vals = {muscleKey: 0..1 workedness} */
  function heatColor(t) {
    const mix = (a, b, u) => Math.round(a + (b - a) * u);
    const from = [255, 216, 168], to = [255, 77, 61]; // soft peach → hot red
    const u = Math.max(0, Math.min(1, (t - 0.08) / 0.92));
    return `rgb(${mix(from[0], to[0], u)},${mix(from[1], to[1], u)},${mix(from[2], to[2], u)})`;
  }

  /* per-region paint: null = resting base, {cls} = class paint, {fill} = heat paint */
  function figure(kind, sex, paintFor) {
    const F = figs(sex);
    let out = F.skin;
    for (const [rid, r] of Object.entries(F.R)) {
      if (r.fig !== kind) continue;
      const pnt = paintFor(rid);
      if (pnt && pnt.fill) out += `<g class="mm-m mm-hot" fill="${pnt.fill}" data-g="${rid}">${r.s}</g>`;
      else if (pnt && pnt.cls) out += `<g class="mm-m ${pnt.cls}" data-g="${rid}">${r.s}</g>`;
      else out += `<g class="mm-m" data-g="${rid}">${r.s}</g>`;
    }
    return out;
  }

  function paintFromVals(vals) {
    const best = {};
    for (const [muscle, t] of Object.entries(vals)) {
      const regions = MUSCLE_TO_REGIONS[muscle]; if (!regions) continue;
      for (const rid of regions) best[rid] = Math.max(best[rid] || 0, t);
    }
    return rid => {
      const t = best[rid] || 0;
      return t > 0.04 ? { fill: heatColor(t) } : null;
    };
  }

  function paintFromLists(prim, sec) {
    const cls = {};
    for (const [muscle, regions] of Object.entries(MUSCLE_TO_REGIONS)) {
      const isP = prim.includes(muscle), isS = !isP && sec.includes(muscle);
      if (!isP && !isS) continue;
      for (const rid of regions) if (cls[rid] !== 'mm-p') cls[rid] = isP ? 'mm-p' : 'mm-s';
    }
    return rid => (cls[rid] ? { cls: cls[rid] } : null);
  }

  function wrap(inner, lbl, label) {
    return `<svg viewBox="0 0 216 ${lbl ? 184 : 168}" class="musclemap" role="img" aria-label="${label}">
      ${inner}
      ${lbl ? `<text x="54" y="178" class="mm-lbl" text-anchor="middle">FRONT</text>
      <text x="162" y="178" class="mm-lbl" text-anchor="middle">BACK</text>` : ''}
    </svg>`;
  }

  function heat(vals, opts) {
    vals = vals || {};
    const sex = opts && opts.sex, lbl = !opts || opts.labels !== false;
    const paint = paintFromVals(vals);
    return wrap(`<g transform="translate(4,2)">${figure('f', sex, paint)}</g>
      <g transform="translate(112,2)">${figure('b', sex, paint)}</g>`, lbl, 'Muscle recovery map');
  }

  function svg(prim, sec, opts) {
    prim = prim || []; sec = sec || [];
    const sex = opts && opts.sex, lbl = !opts || opts.labels !== false;
    const paint = paintFromLists(prim, sec);
    return wrap(`<g transform="translate(4,2)">${figure('f', sex, paint)}</g>
      <g transform="translate(112,2)">${figure('b', sex, paint)}</g>`, lbl, 'Muscles worked');
  }

  return { svg, heat };
})();

const EX_BY_ID = {};
for (const e of EXERCISES) EX_BY_ID[e.id] = e;

function exCoarseGroups(e) {
  const g = new Set();
  for (const m of e.m.p) g.add(MUSCLES[m].group);
  return [...g];
}

/* ---------- exercise categories: muscle groups (primary+secondary) + compound ---------- */
const CAT_ICON = { compound: '', quads: '', hamstrings: '', glutes: '', calves: '',
  chest: '', back: '', shoulders: '', arms: '', core: '' };
// one exercise can sit in many categories: every group its primary OR secondary muscles hit, plus compound
function exCategories(e) {
  const g = new Set();
  for (const m of e.m.p) if (MUSCLES[m]) g.add(MUSCLES[m].group);
  for (const m of e.m.s) if (MUSCLES[m]) g.add(MUSCLES[m].group);
  const out = [...g];
  if (e.cat === 'compound') out.unshift('compound');

/* pick the demo matching the profile's preference; fall back to the smart default */
function exVideo(exId, pref) {
  const list = EX_VIDEOS[exId];
  if (!list || !list.length) return null;
  const ex = EX_BY_ID[exId];
  const vq = (ex ? ex.name : exId) + ' how to proper form';
  let pick = list[0], exact = true;
  if (pref && pref !== 'auto') {
    const match = list.find(v =>
      pref === 'women' ? v.g === 'f' :
      pref === 'men' ? v.g === 'm' :
      pref === 'strength' ? v.s === 'str' :
      pref === 'bb' ? v.s === 'bb' : false);
    if (match) pick = match;
    else exact = false;
  }
  return { list, pick, exact, vq };
}

/* ---------- session-tailored routines ---------- */
function sessionMuscles(exercises) {
  const w = {};
  for (const pe of exercises || []) {
    const ex = EX_BY_ID[pe.exId]; if (!ex) continue;
    for (const m of ex.m.p) w[m] = (w[m] || 0) + 2;
    for (const m of ex.m.s) w[m] = (w[m] || 0) + 1;
  }
  return Object.entries(w).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function pickMoves(muscles, dyn, max) {
  const chosen = [], used = new Set(), covered = new Set();
  for (const mu of muscles) {
    if (chosen.length >= max) break;
    if (covered.has(mu)) continue;
    const cand = STRETCHES.find(s => s.dyn === dyn && !used.has(s.id) && s.m.includes(mu));
    if (cand) {
      chosen.push(cand); used.add(cand.id);
      for (const cm of cand.m) covered.add(cm);
    }
  }
  return chosen;
}
function warmupRoutineFor(exercises) {
  const mus = sessionMuscles(exercises);
  const moves = [STRETCH_BY_ID.dy_pulse, ...pickMoves(mus, true, 4)];
  return moves.map(s => s.id);
}
function cooldownRoutineFor(exercises) {
  return pickMoves(sessionMuscles(exercises), false, 5).map(s => s.id);
}
function routineMinutes(ids) {
  let sec = 0;
  for (const id of ids) {
    const s = STRETCH_BY_ID[id]; if (!s) continue;
    sec += (s.t ? s.t : s.reps * 3) * (s.side ? 2 : 1) + 8;
  }
  return Math.max(1, Math.round(sec / 60));
}

function splitForDays(days, experience, equipment) {

/* pick the best exercise for a slot */
function pickExercise(slot, ctx) {
  const { profile, usedInDay, usedInPlan, seedBase } = ctx;
  const q = profile.quiz;
  const maxLvl = EXPERIENCE[q.experience].maxLvl;
  const usable = e => e.lvl <= maxLvl && !usedInDay.has(e.id) && e.equip.every(eq => q.equipment.includes(eq));
  let cands = EXERCISES.filter(e => slot.pick.includes(e.pattern) && usable(e));
  if (!cands.length) { // widen to related patterns so sparse equipment still fills the day
    const widened = new Set();
    for (const p of slot.pick) for (const f of (PATTERN_FALLBACK[p] || [])) widened.add(f);
    cands = EXERCISES.filter(e => widened.has(e.pattern) && usable(e));
  }
  if (!cands.length) return null;
  const scored = cands.map(e => {
    let s = 0;
    const primaryPattern = slot.pick[0] === e.pattern;
    if (primaryPattern) s += 30;
    if (slot.type === 'comp' && e.cat === 'compound') s += 25;
    if (slot.type !== 'comp' && e.cat !== 'compound') s += 8;
    // beginner-friendliness: easier moves first for beginners
    if (q.experience === 'beginner' && e.lvl === 1) s += 10;
    if (q.experience === 'advanced' && e.lvl >= 2 && slot.type === 'comp') s += 12;
    // focus areas boost
    const groups = exCoarseGroups(e);
    for (const f of (q.focus || [])) if (groups.includes(f)) s += 14;
    // variety across the week (but strength keeps its anchors)
    if (usedInPlan.has(e.id)) s -= (q.goal === 'strength' && slot.type === 'comp') ? 0 : 22;
    // stable per-profile flavour
    s += (U.hashStr(seedBase + e.id) % 1000) / 1000 * 6;
    // her favourites bubble up; "not for me" sinks to last resort
    const pref = (profile.exPrefs || {})[e.id];
    if (pref === 'fav') s += 18;
    if (pref === 'ban') s -= 200;
    return { e, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].e;
}

function schemeFor(profile, exercise, slotType) {
  const q = profile.quiz;
  const g = GOALS[q.goal], xp = EXPERIENCE[q.experience];

    const c = xp.coreScheme;
    return exercise.timed
      ? { sets: c.sets, repsMin: c.secMin, repsMax: c.secMax, rest: c.rest, timed: true }
      : { sets: c.sets, repsMin: c.repsMin, repsMax: c.repsMax, rest: c.rest, timed: false };
  }
  const base = g[slotType === 'comp' ? 'comp' : slotType === 'acc' ? 'acc' : 'iso'];
  let sets = base.sets;
  if (q.experience === 'beginner' && slotType === 'comp' && q.sessionMinutes <= 30) sets = Math.max(2, sets - 1);
  if (q.experience === 'advanced' && slotType !== 'core') sets = base.sets + (slotType === 'comp' ? 1 : 0);
  return { sets, repsMin: base.repsMin, repsMax: base.repsMax, rest: base.rest, timed: !!exercise.timed };
}

  const plan = {
    id: U.uid(), createdAt: U.todayISO(), goal: q.goal, daysPerWeek: q.daysPerWeek,
    splitName: q.daysPerWeek <= 2 ? 'Full Body' : q.daysPerWeek === 3 ? (q.experience === 'beginner' ? 'Full Body ×3' : 'Upper / Lower / Full') : q.daysPerWeek === 4 ? 'Upper / Lower' : q.daysPerWeek === 5 ? 'Hybrid Upper/Lower + PPL' : 'Push / Pull / Legs',
    days, nextDayIdx: 0, weeksCompleted: 0,
  };
  if (q.weekSchedule) plan.dayMap = assignDayMap(plan, q.weekSchedule);
  return plan;
}

/* ---- progression ---- */
const e1rm = (w, reps) => reps <= 0 ? 0 : Math.round(w * (1 + Math.min(reps, 12) / 30) * 10) / 10;
const roundStepFor = ex => ex.inc <= 1 ? 0.5 : ex.inc <= 2 ? 1 : 2.5;

function exState(profile, exId) {
  profile.exState = profile.exState || {};
  if (!profile.exState[exId]) profile.exState[exId] = { w: null, repTarget: null, ups: 0, fails: 0, history: [] };
  return profile.exState[exId];
}

/* what should she aim for next time on this exercise? */
function nextTargets(profile, planEx) {
  const ex = EX_BY_ID[planEx.exId];
  const st = exState(profile, planEx.exId);
  const reps = st.repTarget != null ? Math.min(Math.max(st.repTarget, planEx.repsMin), planEx.repsMax) : planEx.repsMin + (ex.bw ? 2 : 0);
  return { w: st.w, reps, sets: planEx.sets, isNew: st.w == null && !ex.bw && !ex.timed };
}

/* After a workout is finished: update per-exercise state; returns array of feedback msgs */
function applyProgression(profile, log) {
  const q = profile.quiz;
  const mode = GOALS[q.goal].progression;
  const msgs = [];
  for (const entry of log.entries) {
    const ex = EX_BY_ID[entry.exId]; if (!ex) continue;
    const done = entry.sets.filter(s => s.done && s.reps > 0);
    if (!done.length) continue;
    const st = exState(profile, entry.exId);
    const planEx = entry.plan || { repsMin: 8, repsMax: 12 };
    const topW = Math.max(...done.map(s => s.w || 0));
    const bestSet = done.reduce((a, s) => e1rm(s.w || 0, s.reps) > e1rm(a.w || 0, a.reps) ? s : a, done[0]);
    st.history.push({ date: log.date, topW, bestReps: bestSet.reps, e1rm: e1rm(bestSet.w || 0, bestSet.reps), vol: done.reduce((t, s) => t + (s.w || 0) * s.reps, 0) });
    if (st.history.length > 400) st.history.shift();

    const allTop = done.every(s => s.reps >= planEx.repsMax) && done.length >= (entry.plan ? entry.plan.sets : done.length);
    const anyMiss = done.some(s => s.reps < planEx.repsMin);
    const hard = entry.feel === 'hard';

    if (ex.timed) { // seconds-based: nudge up 5s until top, then hold
      const best = Math.max(...done.map(s => s.reps));
      st.repTarget = Math.min(best + 5, planEx.repsMax + 30);
      msgs.push({ exId: ex.id, kind: 'up', text: `${ex.name}: aim for ${st.repTarget}s next time.` });
      continue;
    }
    if (ex.bw && topW === 0) { // pure bodyweight: rep progression
      const best = Math.max(...done.map(s => s.reps));
      if (best >= planEx.repsMax + 5) msgs.push({ exId: ex.id, kind: 'level', text: `${ex.name}: you’ve outgrown it — try a harder variation.` });
      st.repTarget = best + 1;
      msgs.push({ exId: ex.id, kind: 'up', text: `${ex.name}: go for ${st.repTarget} reps next time.` });
      continue;
    }
    if (st.w == null) { st.w = topW; }

    if (anyMiss) {
      st.fails++; st.ups = 0;
      if (st.fails >= 2) {
        const newW = Math.max(0, U.round(st.w * 0.9, roundStepFor(ex)));
        msgs.push({ exId: ex.id, kind: 'deload', text: `${ex.name}: two tough sessions — dropping to ${newW}kg to rebuild momentum. You’ll be past ${st.w}kg again in no time.` });
        st.w = newW; st.fails = 0; st.repTarget = planEx.repsMin;
      } else {
        msgs.push({ exId: ex.id, kind: 'hold', text: `${ex.name}: staying at ${st.w}kg — nail ${planEx.sets}×${planEx.repsMin} next time.` });
        st.repTarget = planEx.repsMin;
      }
      continue;
    }
    if (mode === 'linear') {
      if (!hard || st.ups === 0) {
        st.w = U.round((st.w || topW) + ex.inc, 0.5); st.ups++; st.fails = 0; st.repTarget = planEx.repsMin;
        msgs.push({ exId: ex.id, kind: 'up', text: `${ex.name}: moving up to ${st.w}kg next session.` });
      } else {
        msgs.push({ exId: ex.id, kind: 'hold', text: `${ex.name}: holding ${st.w}kg to consolidate.` });
      }
    } else { // double progression
      if (allTop && !hard) {
        st.w = U.round((st.w || topW) + ex.inc, 0.5); st.repTarget = planEx.repsMin; st.ups++; st.fails = 0;
        msgs.push({ exId: ex.id, kind: 'up', text: `${ex.name}: all sets at the top of the range — weight goes up to ${st.w}kg!` });
      } else if (allTop && hard) {
        st.repTarget = planEx.repsMax;
        msgs.push({ exId: ex.id, kind: 'hold', text: `${ex.name}: that was a grind — repeat ${st.w}kg once more, then up.` });
      } else {
        const minDone = Math.min(...done.map(s => s.reps));
        st.repTarget = Math.min(minDone + 1, planEx.repsMax);
        msgs.push({ exId: ex.id, kind: 'up', text: `${ex.name}: same weight, aim for ${st.repTarget} reps on every set.` });
      }
    }
  }
  return msgs;
}

/* PR detection: returns list of new PRs (call before merging log into profile.prs) */
function detectPRs(profile, log) {
  profile.prs = profile.prs || {};
  const out = [];
  for (const entry of log.entries) {
    const ex = EX_BY_ID[entry.exId]; if (!ex || ex.timed) continue;
    const done = entry.sets.filter(s => s.done && s.reps > 0 && (s.w || 0) > 0);
    if (!done.length) continue;
    const topW = Math.max(...done.map(s => s.w));
    const bestE = Math.max(...done.map(s => e1rm(s.w, s.reps)));
    const pr = profile.prs[entry.exId] || { w: 0, e1rm: 0 };
    const isW = topW > pr.w, isE = bestE > pr.e1rm;
    if (isW || isE) {
      profile.prs[entry.exId] = { w: Math.max(topW, pr.w), e1rm: Math.max(bestE, pr.e1rm), date: log.date };
      if (isW && pr.w > 0) out.push({ exId: entry.exId, kind: 'weight', val: topW, prev: pr.w });
      else if (isE && pr.e1rm > 0 && !isW) out.push({ exId: entry.exId, kind: 'e1rm', val: bestE, prev: pr.e1rm });
    }
  }
  return out;
}

/* ---------- forgiving exercise search: any word order, partials, shorthand, small typos ---------- */
const EX_SEARCH_ALIASES = {
  db: 'dumbbell', bb: 'barbell', kb: 'kettlebell', bw: 'bodyweight', mach: 'machine',
  rdl: 'romanian', ohp: 'overhead', lat: 'lats', delt: 'shoulders', pec: 'chest',
  quad: 'quads', ham: 'hamstrings', glute: 'glutes', tri: 'triceps', bi: 'biceps',

function _exNorm(str) { return String(str || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/ +/g, ' ').trim(); }

    const bits = [ex.name, ex.name.replace(/[^a-zA-Z0-9]+/g, '')]; // "Push-Up" matches both "push up" and "pushup"
    for (const m of ex.m.p.concat(ex.m.s)) { const mu = MUSCLES[m]; if (mu) bits.push(mu.label, mu.group); bits.push(m); }
    bits.push(...ex.equip);

  }

}
function _lev1(a, b) { // within one edit — substitution, adjacent swap, insert or delete
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb) {
    const diff = [];
    for (let i = 0; i < la && diff.length <= 2; i++) if (a[i] !== b[i]) diff.push(i);
    if (diff.length === 1) return true; // one wrong letter
    return diff.length === 2 && diff[1] === diff[0] + 1
      && a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]]; // adjacent transposition
  }

  let i = 0, j = 0, edits = 0;
  while (i < sh.length && j < lo.length) {
    if (sh[i] === lo[j]) { i++; j++; }
    else if (++edits > 1) return false;
    else j++;
  }

}
function exSearchFilter(list, query) {
  const qn = _exNorm(query);
  if (!qn) return list;
  const toks = qn.split(' ').map(t => EX_SEARCH_ALIASES[t] || t);
  const joined = toks.join('');
  const scored = [];
  for (const ex of list) {
    const hay = _exHay(ex);
    const nameN = _exNorm(ex.name);
    if (toks.every(t => hay.includes(t))) {
      const score = nameN.startsWith(qn) || _exNorm(ex.name).replace(/ /g, '').startsWith(joined) ? 0

      scored.push([score, ex]);
    }

  if (!scored.length) { // typo fallback: each token within one edit of some word in the haystack
    for (const ex of list) {
      const words = _exHay(ex).split(' ');
      if (toks.every(t => t.length >= 4 ? words.some(w => w.includes(t) || _lev1(t, w)) : words.some(w => w.includes(t))))

    }

}

/* replay all logs → fresh exercise histories + PRs. Progression targets (st.w etc.) are
   deliberately preserved: fixing a typo in the past shouldn't change next week's prescription. */
function rebuildDerived(profile) {
  const logs = (profile.logs || []).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for (const st of Object.values(profile.exState || {})) st.history = [];
  profile.prs = {};
  for (const log of logs) {
    for (const entry of log.entries) {
      const ex = EX_BY_ID[entry.exId]; if (!ex) continue;
      const done = entry.sets.filter(s => s.done && s.reps > 0);
      if (!done.length) continue;
      const st = exState(profile, entry.exId);
      const topW = Math.max(...done.map(s => s.w || 0));
      const bestSet = done.reduce((a, s) => e1rm(s.w || 0, s.reps) > e1rm(a.w || 0, a.reps) ? s : a, done[0]);
      st.history.push({ date: log.date, topW, bestReps: bestSet.reps, e1rm: e1rm(bestSet.w || 0, bestSet.reps), vol: done.reduce((t, s) => t + (s.w || 0) * s.reps, 0) });
      if (st.history.length > 400) st.history.shift();
      if (!ex.timed) {
        const doneW = done.filter(s => (s.w || 0) > 0);
        if (doneW.length) {
          const tW = Math.max(...doneW.map(s => s.w));
          const bE = Math.max(...doneW.map(s => e1rm(s.w, s.reps)));
          const pr = profile.prs[entry.exId];
          if (!pr) profile.prs[entry.exId] = { w: tW, e1rm: Math.round(bE * 10) / 10, date: log.date };
          else if (tW > pr.w || bE > pr.e1rm) profile.prs[entry.exId] = { w: Math.max(tW, pr.w), e1rm: Math.round(Math.max(bE, pr.e1rm) * 10) / 10, date: log.date };
        }
      }
    }
  }
  for (const [id, st] of Object.entries(profile.exState || {})) if (!st.history.length && st.w == null) delete profile.exState[id];
}

/* weekly sets per coarse muscle group from logs in [fromISO, toISO) */
function weeklySets(profile, fromISO, toISO) {
  const out = {}; MUSCLE_GROUPS.forEach(g => out[g] = 0);
  for (const log of profile.logs || []) {
    if (log.date < fromISO || log.date >= toISO) continue;
    for (const entry of log.entries) {
      const ex = EX_BY_ID[entry.exId]; if (!ex) continue;
      const n = entry.sets.filter(s => s.done).length; if (!n) continue;
      const prim = new Set(ex.m.p.map(m => MUSCLES[m].group));
      const sec = new Set(ex.m.s.map(m => MUSCLES[m].group));
      prim.forEach(g => out[g] += n);
      sec.forEach(g => { if (!prim.has(g)) out[g] += n * 0.5; });
    }
  }
  for (const g of MUSCLE_GROUPS) out[g] = Math.round(out[g] * 2) / 2;
  return out;
}

function alternativesFor(profile, exId) {
  const cur = EX_BY_ID[exId]; if (!cur) return [];
  const q = profile.quiz;
  const maxLvl = EXPERIENCE[q.experience].maxLvl;
  return EXERCISES.filter(e => e.id !== exId && e.lvl <= maxLvl && (profile.exPrefs || {})[e.id] !== 'ban' &&
    e.equip.every(eq => q.equipment.includes(eq)) &&
    (e.pattern === cur.pattern || e.m.p.some(m => cur.m.p.includes(m))))
    .sort((a, b) => (b.pattern === cur.pattern ? 1 : 0) - (a.pattern === cur.pattern ? 1 : 0));
}

/* ---- coach insights ---- */
function trainingWeeks(profile) { // consecutive weeks (ending this week) with >=2 logged sessions (>=1 if plan is 1-2 days)
  const byWeek = {};
  for (const log of profile.logs || []) { const k = U.weekKey(log.date); byWeek[k] = (byWeek[k] || 0) + 1; }
  const need = Math.min(2, profile.plan ? profile.plan.daysPerWeek : 2);
  let weeks = 0; const d = new Date();
  for (let i = 0; i < 60; i++) {
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const k = U.weekKey(iso);
    if ((byWeek[k] || 0) >= need) weeks++;
    else if (i > 0) break; // current week may still be in progress
    d.setDate(d.getDate() - 7);
  }
  return weeks;
}

function coachTips(profile) {
  const tips = [];
  const q = profile.quiz, logs = profile.logs || [];
  if (!logs.length) {
    tips.push({ kind: 'start', icon: 'bolt', title: 'Ready for lift-off', text: 'Your plan is ready. First session: pick weights that feel like you could do 2 more reps at the end of each set — the app takes over from there.' });
    return tips;
  }
  const today = U.todayISO();
  const wkStart = U.weekKey(today);
  const wkEnd = (() => { const d = U.parseISO(wkStart); d.setDate(d.getDate() + 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const thisWeek = logs.filter(l => l.date >= wkStart && l.date < wkEnd).length;
  const target = profile.plan ? profile.plan.daysPerWeek : 3;

  // consistency
  if (thisWeek >= target) tips.push({ kind: 'win', icon: 'award', title: 'Week complete!', text: `${thisWeek}/${target} sessions done this week. That consistency is exactly what gets results.` });
  else tips.push({ kind: 'progress', icon: 'calendar', title: `${thisWeek} of ${target} sessions this week`, text: thisWeek === 0 ? 'Nothing logged yet this week — even a short session keeps the streak alive.' : `${target - thisWeek} to go. You’ve got this.` });

  const weeks = trainingWeeks(profile);
  if (weeks >= 2) tips.push({ kind: 'streak', icon: 'flame', title: `${weeks}-week streak`, text: 'Back-to-back consistent weeks. Momentum is the real magic.' });

  // deload suggestion
  if (weeks >= 6 && !(profile.flags || {}).deloadSuggested) {
    tips.push({ kind: 'deload', icon: 'moon', title: 'Time for an easy week?', text: `${weeks} solid weeks of training. Taking one lighter week (drop about 10% of the weight and a set from each exercise) helps your body catch up and come back stronger.` });
  }

  // muscle balance vs plan focus
  const from = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const sets = weeklySets(profile, from, '9999');
  const [lo] = EXPERIENCE[q.experience].weeklySetTarget;
  const relevant = ['quads', 'glutes', 'back', 'chest', 'shoulders'];
  const low = relevant.filter(g => sets[g] < lo * 0.5).map(g => GROUP_LABELS[g]);
  if (low.length && logs.length >= 4 && thisWeek >= Math.min(2, target)) {
    tips.push({ kind: 'balance', icon: 'scale', title: 'A little unloved', text: `${low.join(' and ')} ${low.length > 1 ? 'have' : 'has'} had less work than usual lately. The plan will keep them covered — just don’t skip those days.` });
  }

  // stalls → swap suggestion
  for (const [exId, st] of Object.entries(profile.exState || {})) {

    const h = st.history.slice(-4);

      break;
    }
  }

  // plan refresh
  if (profile.plan && U.daysBetween(profile.plan.createdAt, today) > 56) {
    tips.push({ kind: 'refresh', icon: 'spark', title: 'Fancy a fresh block?', text: 'This plan is 8+ weeks old. Regenerating gives you fresh exercises and a new stimulus — your strength records carry over.' });
  }

  // educational rotation
  const EDU = [
    { icon: 'moon', title: 'Muscles grow between sessions', text: 'Aim for 7–9 hours of sleep — it’s the most underrated part of the plan.' },
    { icon: 'egg', title: 'Protein check', text: 'Roughly 1.6–2g of protein per kg of bodyweight per day supports muscle growth and recovery.' },
    { icon: 'ruler', title: 'Progress isn’t only the scale', text: 'Reps, weights, photos, energy, sleep — strength gains here are progress you can see week to week.' },
    { icon: 'target', title: 'Leave 1–2 in the tank', text: 'Most sets should end feeling like you had 1–2 clean reps left. Grinding to failure every set slows you down.' },
  ];
  tips.push({ kind: 'edu', ...EDU[logs.length % EDU.length] });
  return tips;
}

}

/* map plan days onto lift weekdays: heaviest leg day goes furthest from sport days */
function assignDayMap(plan, sched) {
  const lifts = liftDaysOf(sched);
  if (!lifts.length) return null;
  const risk = wd => {
    const next = sched[(wd + 1) % 7], prev = sched[(wd + 6) % 7];
    let r = 0;
    if (next && next !== 'rest' && next !== 'lift') r += 2;   // sport tomorrow — protect their legs
    if (prev && prev !== 'rest' && prev !== 'lift') r += 1;   // sport yesterday — legs already tired
    return r;
  };
  const slots = lifts.map(wd => ({ wd, r: risk(wd) }));
  const byRisk = slots.slice().sort((a, b) => b.r - a.r || a.wd - b.wd);
  const daysByLegs = plan.days.map((d, i) => ({ i, legs: dayLegScore(d) })).sort((a, b) => a.legs - b.legs);
  const map = {};
  byRisk.forEach((slot, k) => { map[slot.wd] = daysByLegs[Math.min(k, daysByLegs.length - 1)].i; });
  // if risks are all equal (e.g. gym-only), keep natural chronological order instead
  if (slots.every(s => s.r === slots[0].r)) {
    lifts.forEach((wd, k) => { map[wd] = k % plan.days.length; });
  }
  return map;
}

const todayWeekday = () => (new Date().getDay() + 6) % 7;

function activityOn(prof, wd) {

    const wd = (t + i) % 7;

/* ---- the wins engine: what has she achieved lately? ---- */
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  const logs = prof.logs || [];
  const l30 = logs.filter(l => l.date >= cut);
  const prs30 = Object.entries(prof.prs || {}).filter(([, p]) => p.date >= cut)
    .sort((a, b) => b[1].date < a[1].date ? -1 : 1);
  const vol30 = l30.reduce((t, l) => t + l.entries.reduce((v, e) => v + e.sets.reduce((x, s) => x + (s.w || 0) * ((EX_BY_ID[e.exId] || {}).timed ? 0 : s.reps), 0), 0), 0);
  const sport30 = (prof.sportLogs || []).filter(s => s.date >= cut).length;
  let star = null;
  if (prs30.length) {
    const [exId, pr] = prs30[0];
    star = { name: (EX_BY_ID[exId] || {}).name || exId, w: pr.w };
  }
  return { workouts30: l30.length, prs30: prs30.length, vol30: Math.round(vol30), sport30, star, totalWorkouts: logs.length };
