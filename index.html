// body swaps between category grid, a chosen category, and live search — the
// input handler in 08-main re-renders just this so typing keeps focus.
function libBodyHtml(prof) {
  const f = App.libFilter;
  const mineOK = e => f.equip !== 'mine' || e.equip.every(eq => prof.quiz.equipment.includes(eq));

  if (f.q && f.q.trim()) { // SEARCH — flat ranked list across everything
    const list = exSearchFilter(EXERCISES.filter(mineOK), f.q);
    return `<div id="lib-list">${list.map(e => exRowHtml(e, 'ex-open')).join('') || '<div class="empty"><div class="e"></div>No matches — try fewer letters.</div>'}</div>`;
  }
  if (f.cat) { // CATEGORY — one category's exercises
    const meta = CATEGORIES.find(c => c.key === f.cat) || { label: f.cat, icon: 'target' };
    const list = exercisesInCategory(f.cat).filter(mineOK).sort((a, b) => a.lvl - b.lvl || a.name.localeCompare(b.name));
    return `<button class="switchback" data-a="lib-cat" data-v="">↩ All categories</button>
      <div class="cat-head"><div><div class="nm">${U.esc(meta.label)}</div>
        <div class="muted" style="font-size:12px">${list.length} ${U.plural(list.length, 'move')}${f.cat === 'compound' ? ' · big multi-joint lifts' : ' · anything that works the ' + U.esc(meta.label.toLowerCase())}</div></div></div>
      <div id="lib-list">${list.map(e => exRowHtml(e, 'ex-open')).join('') || '<div class="empty"><div class="e"></div>Nothing here with your kit — turn off “My kit only”.</div>'}</div>`;
  }
  // GRID — category squares (default)
  return `<div class="cat-grid">
    ${CATEGORIES.map(c => {
      const n = exercisesInCategory(c.key).filter(mineOK).length;
      return `<button class="cat-sq ${c.key === 'compound' ? 'compound' : ''}" data-a="lib-cat" data-v="${c.key}">
        <span class="lb">${U.esc(c.label)}</span><span class="ct">${n} ${U.plural(n, 'move')}</span>
      </button>`;
    }).join('')}
  </div>`;
}

/* ============ PROGRESS ============ */
function chartableExercises(prof) {
  return EXERCISES.filter(e => prof.exState[e.id] && prof.exState[e.id].history.length >= 2 && !e.timed)
    .sort((a, b) => prof.exState[b.id].history.length - prof.exState[a.id].history.length);
}
function renderProgress(prof) {
  const logs = prof.logs || [];
  const today = U.todayISO();
  const wkStart = U.weekKey(today);
  const lastWkStart = (() => { const d = U.parseISO(wkStart); d.setDate(d.getDate() - 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const thisWk = logs.filter(l => l.date >= wkStart).length;
  const lastWk = logs.filter(l => l.date >= lastWkStart && l.date < wkStart).length;
  const weeks = trainingWeeks(prof);
  const volThisWk = logs.filter(l => l.date >= wkStart).reduce((t, l) => t + l.entries.reduce((v, e) => v + e.sets.reduce((x, s) => x + (s.w || 0) * (EX_BY_ID[e.exId] && EX_BY_ID[e.exId].timed ? 0 : s.reps), 0), 0), 0);
  // weekly volume history for spark (6 weeks)
  const volByWeek = [];
  for (let i = 5; i >= 0; i--) {
    const ws = (() => { const d = U.parseISO(wkStart); d.setDate(d.getDate() - 7 * i); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    const we = (() => { const d = U.parseISO(ws); d.setDate(d.getDate() + 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    volByWeek.push(logs.filter(l => l.date >= ws && l.date < we).reduce((t, l) => t + l.entries.reduce((v, e) => v + e.sets.reduce((x, s) => x + (s.w || 0) * s.reps, 0), 0), 0));
  }
  const prCount = Object.keys(prof.prs || {}).length;
  const chartEx = App.chartEx && prof.exState[App.chartEx] ? App.chartEx : (chartableExercises(prof)[0] || {}).id;
  let strengthChart = '<div class="chart-empty">Log an exercise twice and your strength curve appears</div>', bestLine = '';
  if (chartEx) {
    const hist = prof.exState[chartEx].history.slice(-14);
    strengthChart = Charts.line([
      { label: 'Top set', pts: hist.map(h => ({ x: U.fmtDateShort(h.date), y: h.topW })) },
      { label: 'Est. 1RM', pts: hist.map(h => ({ x: U.fmtDateShort(h.date), y: h.e1rm })) },
    ]);
    const pr = prof.prs[chartEx];
    if (pr) bestLine = `<div class="muted mt8">Best: <b>${U.fmtW(pr.w, prof.units)}${U.unitLabel(prof.units)}</b> · Est. 1RM <b>${U.fmtW(pr.e1rm, prof.units)}${U.unitLabel(prof.units)}</b></div>`;
  }
  const from7 = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const sets7 = weeklySets(prof, from7, '9999');
  const band = EXPERIENCE[prof.quiz.experience].weeklySetTarget;
  const prList = Object.entries(prof.prs || {}).sort((a, b) => b[1].date < a[1].date ? -1 : 1).slice(0, 6);
  const tips = coachTips(prof);
  return `<div class="screen">
    <div class="hdr"><div><div class="hi">Progress</div><div class="sub">Proof it’s working, in numbers</div></div></div>
    <div class="tiles">
      <div class="tile"><div class="lb">Lifts this week</div><div class="v">${thisWk}<small> / ${prof.plan ? prof.plan.daysPerWeek : '–'}</small></div>
        <div class="delta ${thisWk >= lastWk ? '' : 'dn'}">${!lastWk ? 'fresh start!' : thisWk >= lastWk ? '▲ vs ' + lastWk + ' last week' : 'your pace, your race'}</div></div>
      <div class="tile"><div class="lb">Streak</div><div class="v">${weeks}<small> ${U.plural(weeks, 'week')}</small></div><div class="delta">${weeks >= 2 ? 'keep it rolling' : 'consistency builds it'}</div></div>
      <div class="tile"><div class="lb">Volume this week</div><div class="v">${U.compact(volThisWk)}<small> kg</small></div>${Charts.spark(volByWeek)}</div>
      <div class="tile"><div class="lb">Personal records</div><div class="v">${prCount}</div><div class="delta">${prCount ? 'records set' : 'first PR incoming'}</div></div>
    </div>
    <div class="card">
      <div class="row"><h3>Strength</h3><span class="spacer"></span></div>
      ${chartableExercises(prof).length ? `<select class="search mt8" id="chart-ex" style="margin-bottom:6px;padding:10px 12px">
        ${chartableExercises(prof).map(e => `<option value="${e.id}" ${e.id === chartEx ? 'selected' : ''}>${U.esc(e.name)}</option>`).join('')}
      </select>` : ''}
      ${strengthChart}${bestLine}
    </div>
    <div class="card">
      <h3>Weekly sets per muscle</h3>
      <div class="muted mt8" style="margin-bottom:6px">Last 7 days · green band = your target zone</div>
      ${Charts.bars(MUSCLE_GROUPS.map(g => ({ label: ({ shoulders: 'Delts', hamstrings: 'Hams' })[g] || GROUP_LABELS[g], value: sets7[g] })), { band })}
    </div>
    ${prList.length ? `<div class="card"><h3>Records</h3><div class="mt8">
      ${prList.map(([exId, pr]) => `<button class="pr-row" style="width:100%;text-align:left;cursor:pointer" data-a="rec-open" data-ex="${exId}"><span class="medal"></span>${U.esc((EX_BY_ID[exId] || {}).name || exId)}

/* ============ GLOBAL DISPATCH ============ */
function dispatch(e) {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  const prof = activeProfile();
  // onboarding
  if (a.startsWith('ob-') || a === 'wb-set') return obAction(a, el);
  // v2: trimmer, deload, badges/share, body log, exercise prefs
  if (prof && v2Action(a, el, prof)) return;
  // v2.1: coach mode
  if (a.startsWith('co-')) return coachAction(a, el, prof);
  // v2.7: mobility — warm-up/cooldown rows + relief tool
  if (a.startsWith('mob-')) return mobAction(a, el, prof);
  // v3.6: "life happened" day moves — reschedule / skip / undo, both roles
  if (a.startsWith('dm-')) return dmAction(a, el, prof);
  // sheets
  if (a === 'sheet-close') return closeSheet();
  if (a === 'tab') { App.view = el.dataset.id; closeSheet(); App._scrollTop = true; render(); return; }
  if (a === 'ex-open') { App._vidChoice = null; closeSheet(); showExerciseSheet(el.dataset.ex, prof); return; }
  if (a === 'vid-pick') { App._vidChoice = { exId: el.dataset.ex, i: +el.dataset.i }; showExerciseSheet(el.dataset.ex, prof); return; }
  if (a === 'choose-day') { showChooseDaySheet(prof); return; }
  if (a === 'day-peek') { showDayPeekSheet(prof, +el.dataset.d); return; }
  if (a === 'ready-open') { App._ready = null; showReadinessSheet(prof); return; }
  if (a === 'ready-set') { App._ready = App._ready || { e: 0, s: 0, m: 0 }; App._ready[el.dataset.k] = +el.dataset.v; showReadinessSheet(prof); return; }
  if (a === 'ready-save') {
    const t = App._ready || { e: 0, s: 0, m: 0 };
    const r = readinessCompute(t.e, t.s, t.m);
    setReadinessToday(prof, r); App._ready = null;
    closeSheet(); saveApp(); render();
    toast(r.mod === 1 ? 'Logged — today’s right on plan' : `Logged — today’s weights ${r.label}`);
    return;
  }
  if (a === 'go-history') {
    App.view = 'progress'; App._scrollTop = true; render();
    setTimeout(() => { const el2 = document.getElementById('hist-card'); if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
    return;
  }
  if (a === 'start-workout') { closeSheet(); guardPausedThen(prof, () => { Sound.unlock(); WakeLock.on(); startWorkout(prof, +el.dataset.idx); render(); }); return; }
  // custom workout actions
  if (a.startsWith('cw-') || a === 'start-custom' || a === 'plan-edit-day' || a.startsWith('day-override')) return customAction(a, el, prof);
  // workout actions
  if (['wo-exit', 'wo-pause', 'wo-discard-ask', 'wo-resume', 'wo-finish', 'wo-step', 'wo-typein', 'wo-done', 'wo-warm-done', 'wo-hold', 'wo-feel', 'wo-how', 'wo-swap', 'wo-add-ex', 'wo-mkweighted', 'wo-goto-active', 'wo-min', 'wo-restore', 'wo-addset', 'wo-delset', 'rest-add', 'rest-skip'].includes(a))
    return workoutAction(a, el, prof);
  if (a === 'do-swap') {
    const ei = +el.dataset.ei;
    const newEx = EX_BY_ID[el.dataset.ex];
    const entry = App.workout.entries[ei];
    // update the source template for the future too (plan day or custom workout)
    if (App.workout.customId) {
      const cw = customById(prof, App.workout.customId);
      const cpe = cw && cw.exercises.find(x => x.exId === entry.exId);
      if (cpe) cpe.exId = newEx.id;
    } else if (App.workout.dayIdx != null) {
      const day = prof.plan.days[App.workout.dayIdx];
      const pe = day.exercises.find(x => x.exId === entry.exId);
      if (pe) pe.exId = newEx.id;
    }
    const newPlanEx = Object.assign({}, entry.plan, { exId: newEx.id, timed: !!newEx.timed });
    const t = nextTargets(prof, newPlanEx);
    entry.exId = newEx.id;
    entry.plan = newPlanEx;
    entry.isNew = t.isNew;
    entry.sets = entry.sets.map(() => ({ w: t.w != null ? t.w : 0, reps: t.reps, done: false }));
    prof.activeWorkout = App.workout; saveApp();
    closeSheet(); render();
    toast(`Swapped to ${newEx.name}`);
    return;
  }
  if (a === 'do-add') {
    const ex = EX_BY_ID[el.dataset.ex];
    const sch = schemeFor(prof, ex, ex.cat === 'compound' ? 'acc' : 'iso');
    const planEx = { exId: ex.id, ...sch, slotType: 'extra' };
    const t = nextTargets(prof, planEx);
    const sets = [];
    for (let i = 0; i < planEx.sets; i++) sets.push({ w: t.w != null ? t.w : 0, reps: t.reps, done: false });
    App.workout.entries.push({ exId: ex.id, plan: planEx, sets, feel: null, isNew: t.isNew });
    prof.activeWorkout = App.workout; saveApp();
    closeSheet(); render();
    toast(`${ex.name} added`);
    return;
  }
  // plan
  if (a === 'plan-regen') {
    showConfirm('Regenerate plan?', 'You’ll get fresh exercise choices for the same goals. Weights and records carry over.', 'Keep current', 'Regenerate', ok => {
      if (!ok) { regeneratePlan(prof); render(); toast('New block ready'); }
    });
    return;
  }
  if (a === 'plan-save') {
    showSheet(`<h3 style="font-size:19px;font-weight:900">Save this week</h3>
      <p class="muted mt8" style="margin-bottom:10px">Give the current plan a name — reload it any time. Your logs, records and weights stay put.</p>
      <input class="ob-input" id="plan-name" placeholder="e.g. Glute-focus block" maxlength="30" autocomplete="off" value="${U.esc((prof.plan && prof.plan.splitName) || '')}">
      <button class="btn primary block mt16" data-a="plan-save-go">Save plan</button>`);
    setTimeout(() => { const i = document.getElementById('plan-name'); if (i) { i.focus(); i.select(); } }, 60);
    return;
  }
  if (a === 'plan-save-go') {
    const name = (document.getElementById('plan-name') || {}).value || '';
    const e = saveCurrentPlan(prof, name);
    closeSheet(); render();
    toast(e ? `“${e.name}” saved` : 'Nothing to save yet');
    return;
  }
  if (a === 'plan-load') {
    const sp = savedPlans(prof).find(x => x.id === el.dataset.id); if (!sp) return;
    showConfirm(`Load “${sp.name}”?`, 'This replaces your current week with the saved one. Everything you’ve logged — records, weights, history — is untouched.', 'Keep current', 'Load it', ok => {
      if (!ok) { loadSavedPlan(prof, sp.id); render(); toast(`“${sp.name}” loaded`); }
    });
    return;
  }
  if (a === 'plan-del') {
    const sp = savedPlans(prof).find(x => x.id === el.dataset.id); if (!sp) return;
    showConfirm('Delete this saved plan?', `“${U.esc(sp.name)}” will be removed. It only deletes the saved template — your current week and all your data stay.`, 'Keep it', 'Delete', ok => {
      if (!ok) { deleteSavedPlan(prof, sp.id); render(); toast('Saved plan deleted'); }
    });
    return;
  }
  // ---- coach template library ----
  if (a === 'tpl-save-week') {
    showSheet(`<h3 style="font-size:19px;font-weight:900">Save this week to templates</h3>
      <p class="muted mt8" style="margin-bottom:10px">Name it — then apply it to ${U.esc((prof.coachOf || {}).athleteName || 'any client')} or anyone else, any time.</p>
      <input class="ob-input" id="tpl-name" placeholder="e.g. Beginner full-body 3-day" maxlength="34" autocomplete="off" value="${U.esc((prof.plan && prof.plan.splitName) || '')}">
      <button class="btn primary block mt16" data-a="tpl-save-week-go">Save week</button>`);
    setTimeout(() => { const i = document.getElementById('tpl-name'); if (i) { i.focus(); i.select(); } }, 60);
    return;
  }
  if (a === 'tpl-save-week-go') {
    const e = saveWeekTemplate(prof, (document.getElementById('tpl-name') || {}).value || '');
    closeSheet(); render(); toast(e ? `“${e.name}” saved` : 'Nothing to save yet');
    return;
  }
  if (a === 'tpl-apply-week') {
    const w = coachLib().weeks.find(x => x.id === el.dataset.id); if (!w) return;
    showConfirm(`Apply “${w.name}”?`, `This replaces ${U.esc((prof.coachOf || {}).athleteName || 'the client')}’s current week and syncs to their phone. Their logged history and records stay untouched.`, 'Keep current', 'Apply it', ok => {
      if (!ok) { applyWeekTemplate(prof, w.id); render(); toast(`“${w.name}” applied — syncing to ${U.esc((prof.coachOf || {}).athleteName || 'client')} ↗`); }
    });
    return;
  }
  if (a === 'tpl-del-week') {
    const w = coachLib().weeks.find(x => x.id === el.dataset.id); if (!w) return;
    showConfirm('Delete week template?', `“${U.esc(w.name)}” leaves your library. Clients already on it keep their plan.`, 'Keep it', 'Delete', ok => {
      if (!ok) { deleteWeekTemplate(w.id); render(); toast('Template deleted'); }
    });
    return;
  }
  if (a === 'tpl-save-day' || a === 'tpl-save-cw') {
    const src = a === 'tpl-save-day' ? prof.plan.days[+el.dataset.idx] : customById(prof, el.dataset.id);
    if (!src) return;
    App._tplDaySrc = JSON.parse(JSON.stringify({ name: src.name, note: src.note || '', exercises: src.exercises }));
    showSheet(`<h3 style="font-size:19px;font-weight:900">Save day to templates</h3>
      <p class="muted mt8" style="margin-bottom:10px">A reusable day you can drop onto any client — ${src.exercises.length} ${U.plural(src.exercises.length, 'exercise')}.</p>
      <input class="ob-input" id="tpl-name" placeholder="e.g. Glute-focus lower" maxlength="34" autocomplete="off" value="${U.esc(src.name || '')}">
      <button class="btn primary block mt16" data-a="tpl-save-day-go">Save day</button>`);
    setTimeout(() => { const i = document.getElementById('tpl-name'); if (i) { i.focus(); i.select(); } }, 60);
    return;
  }
  if (a === 'tpl-save-day-go') {
    const src = App._tplDaySrc; if (!src) { closeSheet(); return; }
    src.name = (document.getElementById('tpl-name') || {}).value || src.name;
    const e = saveDayTemplate(src.name, src);
    App._tplDaySrc = null; closeSheet(); render();
    toast(e ? `“${e.name}” saved` : 'Add an exercise first');
    return;
  }
  if (a === 'tpl-insert-day') {
    const cwId = insertDayTemplate(prof, el.dataset.id);
    if (cwId) { render(); toast('Added to their workouts — pick which days ↓'); setTimeout(() => showAssignSheet(prof, cwId), 300); }
    return;
  }
  if (a === 'tpl-del-day') {
    const dt = coachLib().days.find(x => x.id === el.dataset.id); if (!dt) return;
    showConfirm('Delete day template?', `“${U.esc(dt.name)}” leaves your library. Days already dropped onto clients stay.`, 'Keep it', 'Delete', ok => {
      if (!ok) { deleteDayTemplate(dt.id); render(); toast('Template deleted'); }
    });
    return;
  }
  if (a === 'prefs-open') { showPrefsSheet(prof); return; }
  if (a === 'pref-athlete') {
    const d = App.prefsDraft;
    if (d.athleteType !== el.dataset.v) { d.athleteType = el.dataset.v; d.weekSchedule = defaultSchedule(d.athleteType); }
    renderPrefsSheet(prof); return;
  }
  if (a === 'pwb-set') { (App.prefsDraft.weekSchedule = App.prefsDraft.weekSchedule || scheduleFromDays(3))[+el.dataset.d] = el.dataset.v; renderPrefsSheet(prof); return; }
  if (a === 'sport-done') {
    const act = el.dataset.act, iso = U.todayISO();
    prof.sportLogs = prof.sportLogs || [];
    const i = prof.sportLogs.findIndex(x => x.date === iso && x.act === act);
    if (i >= 0) { prof.sportLogs.splice(i, 1); saveApp(); render(); return; }
    prof.sportLogs.push({ date: iso, act });
    saveApp(); render();
    toast(`${sportLabelFor(prof, act)} logged — nice work.`);
    return;
  }
  if (a === 'pref-set') {
    const k = el.dataset.k; let v = el.dataset.v;
    if (k === 'daysPerWeek' || k === 'sessionMinutes') v = +v;
    App.prefsDraft[k] = v; renderPrefsSheet(prof); return;
  }
  if (a === 'pref-equip') {
    const v = el.dataset.v, d = App.prefsDraft;
    d.equipment = d.equipment.includes(v) ? d.equipment.filter(x => x !== v) : [...d.equipment, v];
    renderPrefsSheet(prof); return;
  }
  if (a === 'pref-focus') {
    const v = el.dataset.v, d = App.prefsDraft;
    if ((d.focus || []).includes(v)) d.focus = d.focus.filter(x => x !== v);
    else if ((d.focus || []).length < 2) d.focus = [...(d.focus || []), v];
    renderPrefsSheet(prof); return;
  }
  if (a === 'pref-save') {
    if (!App.prefsDraft.equipment.length) return toast('Pick at least one equipment option');
    const nLifts = liftDaysOf(App.prefsDraft.weekSchedule || {}).length;
    if (nLifts < 1) return toast('Pick at least one lifting day');
    if (nLifts > 6) return toast('Keep at least one full rest day');
    regeneratePlan(prof, App.prefsDraft);
    closeSheet(); render();
    toast('Plan rebuilt around your new preferences');
    return;
  }
  // library
  if (a === 'lib-group') { App.libFilter.group = el.dataset.v; render(); return; }
  if (a === 'lib-cat') { App.libFilter.cat = el.dataset.v || ''; App.libFilter.q = ''; App._scrollTop = true; render(); return; }
  if (a === 'lib-equip') { App.libFilter.equip = App.libFilter.equip === 'mine' ? '' : 'mine'; render(); return; }
  // profile
  if (a === 'prof-switch') {
    if (el.dataset.id !== App.data.activeProfileId) {
      App.data.activeProfileId = el.dataset.id; saveApp();
      App.workout = activeProfile().activeWorkout || null;
      App.chartEx = null;
      render(); toast(`Hey ${activeProfile().name}!`);
    }
    return;
  }
  if (a === 'prof-add') { App.creating = true; App.onboarding = null; render(); return; }
  if (a === 'set-theme') { applyTheme(el.dataset.v); render(); return; }
  if (a === 'set-units') { prof.units = el.dataset.v; saveApp(); render(); return; }
  if (a === 'set-bodysex') {
    prof.quiz.bodySex = el.dataset.v === 'male' ? 'male' : 'female';
    if (prof.coachSync) { prof.coachSync.pendingProgress = true; setTimeout(() => syncTick(true), 800); } // coach's view of you follows
    saveApp(); render(); return;
  }
  if (a === 'set-barkg') { prof.barKg = +el.dataset.v; saveApp(); render(); toast(`Plate maths now assumes a ${prof.barKg}kg bar`); return; }
  if (a === 'notif-enable') {
    try {
      Notification.requestPermission().then(p => { render(); toast(p === 'granted' ? 'Rest-timer pings are on' : 'No worries — the timer still works perfectly in the app'); });
    } catch (e) { toast('Notifications aren’t available on this phone'); }
    return;
  }
  if (a === 'data-export') { exportBackup(); toast('Backup downloaded'); return; }
  if (a === 'data-import') {
    const inp = document.getElementById('import-file');
    inp.onchange = () => {
      if (!inp.files.length) return;
      importBackup(inp.files[0], ok => {
        if (ok) { App.workout = null; loadApp(); render(); toast('Backup restored'); }
        else toast('That file doesn’t look like a LiftOff backup');
      });
    };
    inp.click(); return;
  }
  if (a === 'data-reset') {
    showConfirm('Erase everything?', 'All profiles, plans and history will be permanently deleted from this device.', 'Keep my data', 'Erase all', ok => {
      if (!ok) { Store.wipe(); App.data = defaultData(); App.workout = null; App.onboarding = null; App.creating = false; render(); }
    });
    return;
  }
}


/* ============ LiftOff — custom workout builder & day assignment ============ */
'use strict';

function customList(prof) { return prof.customWorkouts || (prof.customWorkouts = []); }
function customById(prof, id) { return customList(prof).find(c => c.id === id); }

/* default scheme for a newly added exercise */
function cwDefaultEntry(prof, ex) {
  const type = CORE_PATTERNS.includes(ex.pattern) || ex.cat === 'core' ? 'core' : ex.cat === 'compound' ? 'comp' : 'iso';
  const sch = schemeFor(prof, ex, type === 'core' ? 'iso' : type);
  return { exId: ex.id, sets: sch.sets, repsMin: sch.repsMin, repsMax: sch.repsMax, rest: sch.rest, timed: !!ex.timed, slotType: type === 'core' ? 'core' : type };
}

const REST_STEPS = [30, 45, 60, 90, 120, 150, 180];

  }).join('');
  showSheet(`
    <h3 style="font-size:19px;font-weight:900">${(() => { const an = prof.isCoach && prof.coachOf ? prof.coachOf.athleteName : null;
      return d.planIdx != null ? (an ? `Edit ${U.esc(an)}’s day` : 'Edit this plan day') : d.id ? (an ? `Edit ${U.esc(an)}’s workout` : 'Edit workout') : (an ? `Build ${U.esc(an)}’s workout` : 'Build a workout'); })()}</h3>
    <p class="muted mt8" style="margin-bottom:10px">${d.planIdx != null ? 'Change anything — this overwrites the auto-generated day. Regenerating the plan builds it fresh again.' : 'Your exercises, your order, your scheme. Progression still tracks every lift automatically.'}</p>
    <input class="ob-input" id="cw-name" placeholder="Name it — e.g. Glute Day" value="${U.esc(d.name)}" maxlength="26" autocomplete="off">
    ${prof.isCoach ? `<textarea class="ob-input" id="cw-daynote" rows="2" maxlength="300" placeholder="Note for the whole day — shows when they start it" style="width:100%;margin-top:8px;resize:vertical;font-size:13.5px">${U.esc(d.note || '')}</textarea>` : ''}
    <div class="mt12" id="cw-list">${rows || '<div class="empty" style="padding:18px"><div class="e"></div>Add your first exercise below.</div>'}</div>

  document.querySelectorAll('.cwx-note').forEach(inp => inp.addEventListener('input', () => {
    const pe = App.cwDraft.exercises[+inp.dataset.i];

  if (_keepScroll != null) { const s = document.querySelector('.sheet'); if (s) s.scrollTop = _keepScroll; }

/* exercise picker for the builder */
function showCwPickSheet(prof) {
  const inW = new Set(App.cwDraft.exercises.map(e => e.exId));
  const avail = e => e.equip.every(eq => prof.quiz.equipment.includes(eq));
  // full library — your build, your rules; kit you haven't ticked is tagged, not hidden
  const opts = EXERCISES.filter(e => !inW.has(e.id))
    .slice().sort((a, b) => (avail(b) ? 1 : 0) - (avail(a) ? 1 : 0) || a.name.localeCompare(b.name));
  const row = e => avail(e) ? exRowHtml(e, 'cw-pick') :
    exRowHtml(e, 'cw-pick').replace('</button>', `<span class="tag" style="margin-left:6px;flex:none">${e.equip.map(q2 => EQUIP_LABELS[q2]).join('+')}</span></button>`);
  showSheet(`<h3 style="font-size:19px;font-weight:900">Add an exercise</h3>
    <p class="muted mt8">The whole library — ${EXERCISES.length} moves. Kit that isn't in your setup is labelled.</p>
    <input class="search mt8" id="cwpick-q" placeholder="Search…" autocomplete="off">
    <div id="cwpick-list">${opts.slice(0, 16).map(row).join('')}</div>`);
  const q = document.getElementById('cwpick-q');
  q.addEventListener('input', () => {
    const v = q.value.toLowerCase();
    document.getElementById('cwpick-list').innerHTML =
      exSearchFilter(opts, v).slice(0, 20).map(row).join('') || '<div class="empty">No matches — try fewer letters.</div>';
  });
}

    <div class="chips">
    ${WEEKDAYS.map((wd, dIdx) => {

      const act = sched[dIdx] || 'rest';

        ${wd}${mine ? ' ✓' : other ? ' · ' + U.esc(other.name.slice(0, 8)) : act !== 'lift' ? ' · ' + ACTIVITIES[act].emoji : ''}</button>`;
    }).join('')}

/* ---------- actions ---------- */
function customAction(a, el, prof) {
  if (a === 'cw-new') { App.cwDraft = { id: null, planIdx: null, name: '', note: '', exercises: [] }; showBuilderSheet(prof); return; }
  if (a === 'plan-edit-day') {
    const i = +el.dataset.idx;
    const day = prof.plan.days[i]; if (!day) return;
    App.cwDraft = { id: null, planIdx: i, name: day.name, note: day.note || '', exercises: JSON.parse(JSON.stringify(day.exercises)) };
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-edit') {
    const cw = customById(prof, el.dataset.id); if (!cw) return;
    App.cwDraft = JSON.parse(JSON.stringify({ id: cw.id, name: cw.name, note: cw.note || '', exercises: cw.exercises }));
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-add-ex') { showCwPickSheet(prof); return; }
  if (a === 'cw-pick') {
    const ex = EX_BY_ID[el.dataset.ex];
    App.cwDraft.exercises.push(cwDefaultEntry(prof, ex));
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-remove') { App.cwDraft.exercises.splice(+el.dataset.i, 1); showBuilderSheet(prof); return; }
  if (a === 'cw-move') {
    const i = +el.dataset.i, j = i + (+el.dataset.d);
    const arr = App.cwDraft.exercises;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-step') {
    const pe = App.cwDraft.exercises[+el.dataset.i];
    const f = el.dataset.f, delta = +el.dataset.d;
    if (f === 'sets') pe.sets = U.clamp(pe.sets + delta, 1, 8);
    if (f === 'repsMin') pe.repsMin = U.clamp(pe.repsMin + delta * (pe.timed ? 5 : 1), 1, pe.repsMax - 1);
    if (f === 'repsMax') pe.repsMax = U.clamp(pe.repsMax + delta * (pe.timed ? 5 : 1), pe.repsMin + 1, pe.timed ? 300 : 30);
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-reststep') {
    const pe = App.cwDraft.exercises[+el.dataset.i];
    const delta = +el.dataset.d;
    // snap to the nearest preset, then step in that direction
    let idx = REST_STEPS.findIndex(v => v >= pe.rest);
    if (idx < 0) idx = REST_STEPS.length - 1;
    if (delta > 0 && REST_STEPS[idx] <= pe.rest) idx++;
    if (delta < 0) idx = (REST_STEPS[idx] >= pe.rest ? idx : idx + 1) - 1;
    idx = U.clamp(idx, 0, REST_STEPS.length - 1);
    pe.rest = REST_STEPS[idx];
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-typein') {
    if (el.querySelector('input')) return;
    const i = +el.dataset.i, f = el.dataset.f, pe = App.cwDraft.exercises[i];
    if (!pe) return;
    const cur = f === 'sets' ? String(pe.sets) : f === 'reps' ? `${pe.repsMin}-${pe.repsMax}` : String(pe.rest);
    const hint = f === 'reps' ? '8-12' : f === 'rest' ? 'sec' : '';
    el.innerHTML = `<input class="cwv-input" type="text" inputmode="${f === 'reps' ? 'text' : 'numeric'}" enterkeyhint="done" value="${U.esc(cur)}" placeholder="${hint}">`;
    const inp = el.querySelector('input'); inp.focus(); inp.select();
    const commit = () => {
      const raw = (inp.value || '').trim();
      if (raw !== '') {
        if (f === 'sets') pe.sets = U.clamp(Math.round(parseFloat(raw)) || pe.sets, 1, 12);
        else if (f === 'rest') {
          let sec;
          if (/^\d{1,2}:\d{1,2}$/.test(raw)) { const [m, s] = raw.split(':').map(Number); sec = m * 60 + s; }
          else sec = Math.round(parseFloat(raw.replace(/[^0-9.]/g, '')));
          if (!isNaN(sec) && sec > 0) pe.rest = U.clamp(sec, 5, 600);
        } else { // reps range: "8-12", "8 12", or single "10"
          const nums = raw.replace(/[–—]/g, '-').match(/\d+/g);
          if (nums && nums.length) {
            const cap = pe.timed ? 600 : 100;
            let lo = U.clamp(Math.round(+nums[0]), 1, cap);
            let hi = nums[1] != null ? U.clamp(Math.round(+nums[1]), 1, cap) : lo;
            if (hi < lo) { const t = lo; lo = hi; hi = t; }
            pe.repsMin = lo; pe.repsMax = Math.max(hi, lo);
          }
        }
      }
      showBuilderSheet(prof); // rebuild preserves the sheet's scroll position (see top of showBuilderSheet)
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); } });
    return;
  }
  if (a === 'cw-link') { // superset with the next exercise
    const pe = App.cwDraft.exercises[+el.dataset.i];
    pe.ssWithNext = !pe.ssWithNext;
    showBuilderSheet(prof); return;
  }
  if (a === 'cw-save') {
    const d = App.cwDraft;
    if (!d.exercises.length) return toast('Add at least one exercise');
    delete d.exercises[d.exercises.length - 1].ssWithNext; // last move can't pair forward
    const name = (d.name || '').trim() || 'My Workout';
    if (d.planIdx != null) { // overwrite a generated plan day in place
      const day = prof.plan.days[d.planIdx];
      day.name = name;
      day.exercises = d.exercises;
      day.note = (d.note || '').trim();
      day.edited = true;
      saveApp(); closeSheet(); render();
      toast(`“${name}” updated — it’s your day now`);
      return;
    }
    if (d.id) {
      const cw = customById(prof, d.id);
      Object.assign(cw, { name, exercises: d.exercises, note: (d.note || '').trim() });
      saveApp(); closeSheet(); render();
      toast(`“${name}” updated`);
    } else {
      const cw = { id: U.uid(), name, exercises: d.exercises, note: (d.note || '').trim(), createdAt: U.todayISO() };
      customList(prof).push(cw);
      saveApp(); closeSheet(); render();
      toast(`“${name}” saved`);
      setTimeout(() => showAssignSheet(prof, cw.id), 350);
    }
    return;
  }
  if (a === 'cw-delete') {
    const d = App.cwDraft;
    showConfirm('Delete this workout?', 'Your logged history and records are kept — only the workout template is removed.', 'Keep it', 'Delete', ok => {
      if (!ok) {
        prof.customWorkouts = customList(prof).filter(c => c.id !== d.id);
        for (const [wd, id] of Object.entries(prof.customMap || {})) if (id === d.id) delete prof.customMap[wd];
        saveApp(); closeSheet(); render();
        toast('Workout deleted');
      }
    });
    return;
  }
  if (a === 'cw-assign-open') { showAssignSheet(prof, el.dataset.id); return; }
  if (a === 'cw-assign-day') {
    const wd = +el.dataset.d, id = el.dataset.id;
    prof.customMap = prof.customMap || {};
    if (prof.customMap[wd] === id) delete prof.customMap[wd];
    else {
      prof.customMap[wd] = id;
      if ((prof.quiz.weekSchedule[wd] || 'rest') !== 'lift') {
        prof.quiz.weekSchedule[wd] = 'lift';
        prof.quiz.daysPerWeek = Math.max(1, liftDaysOf(prof.quiz.weekSchedule).length);
        if (prof.plan) prof.plan.daysPerWeek = prof.quiz.daysPerWeek;
        toast(`${WEEKDAYS_FULL[wd]} is now a lifting day`);
      }
    }
    saveApp(); showAssignSheet(prof, id); return;
  }
  if (a === 'day-override-open') { showDayOverrideSheet(prof, +el.dataset.d); return; }
  if (a === 'day-override-set') {
    const wd = +el.dataset.d, v = el.dataset.v;
    prof.customMap = prof.customMap || {};
    if (v) prof.customMap[wd] = v; else delete prof.customMap[wd];
    saveApp(); closeSheet(); render();
    toast(v ? 'Dropped in' : 'Back to auto');
    return;
  }
  if (a === 'start-custom') {
    closeSheet();
    guardPausedThen(prof, () => {
      Sound.unlock(); WakeLock.on();
      startCustomWorkout(prof, el.dataset.id);
      render();
    });
    return;
  }
}


/* ============ LiftOff v2.0 — motivation UI, trimmer, deload, prefs (UI layer) ============ */
'use strict';

/* ---------- session trimmer ---------- */
function showTrimSheet(prof, mode, idx, id) {
  const exs = mode === 'custom' ? (customById(prof, id) || {}).exercises : prof.plan.days[idx].exercises;
  if (!exs) return;
  const full = estMinutesFor(exs);
  showSheet(`<h3 style="font-size:19px;font-weight:900">How long have you got?</h3>
    <p class="muted mt8" style="margin-bottom:12px">Full session is ~${full} min. Pick your time and I’ll keep the moves that matter most — every set still counts.</p>
    <div class="chips">
      ${[15, 20, 25, 30, 40].filter(m => m < full).map(m => {
        const t = trimSession(exs, m);
        return `<button class="chip" data-a="trim-start" data-mode="${mode}" data-idx="${idx != null ? idx : ''}" data-id="${id || ''}" data-min="${m}">${m} min · ${t.exercises.length} moves</button>`;
      }).join('') || '<p class="muted">This session is already nice and short!</p>'}
    </div>`);
}

/* ---------- badges ---------- */
function badgesCardHtml(prof) {
  const stats = badgeStats(prof);
  prof.badges = prof.badges || {};
  const cells = BADGES.map(b => {
    const got = !!prof.badges[b.id];
    return `<div class="badge ${got ? 'got' : ''}">
      <div class="bi">${IC(b.icon)}</div>
      <div class="bn">${U.esc(b.name)}</div>
      <div class="bp">${got ? U.fmtDateShort(prof.badges[b.id]) : U.esc(b.goal(stats))}</div>
    </div>`;
  }).join('');
  const earned = Object.keys(prof.badges).length;
  return `<div class="card"><div class="row"><h3>Milestones</h3><span class="spacer"></span><span class="muted">${earned}/${BADGES.length} earned</span></div>
    <div class="badges mt12">${cells}</div></div>`;
}

/* ---------- activity heatmap (last 12 weeks) ---------- */
function heatmapCardHtml(prof) {
  const todayISO = U.todayISO();
  const mon0 = U.parseISO(U.weekKey(todayISO)); // this week's Monday
  const liftDates = new Set((prof.logs || []).map(l => l.date));
  const sportDates = new Set((prof.sportLogs || []).map(s => s.date));
  let cols = '';
  for (let wk = 11; wk >= 0; wk--) {
    let col = '';
    for (let d = 0; d < 7; d++) {
      const dt = new Date(mon0); dt.setDate(mon0.getDate() - wk * 7 + d);
      const iso = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
      const future = iso > todayISO;
      const l = liftDates.has(iso), sp = sportDates.has(iso);
      const cls = future ? 'fut' : l && sp ? 'both' : l ? 'lift' : sp ? 'sport' : '';
      col += `<i class="${cls}" title="${iso}"></i>`;
    }
    cols += `<div class="hm-col">${col}</div>`;
  }
  return `<div class="card"><h3>Last 12 weeks</h3>
    <div class="hm mt12">${cols}</div>
    <div class="hm-key mt8"><span><i class="lift"></i>Lift</span><span><i class="sport"></i>Sport</span><span><i class="both"></i>Both</span></div>
  </div>`;
}

/* ---------- bodyweight tracking ---------- */
function bodyCardHtml(prof) {
  const logs = prof.bodyLogs || [];

/* ---------- weekly recap share card ---------- */
async function shareRecap(prof) {
  const r = recapData(prof);
  const cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1350;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1080, 1350);
  grad.addColorStop(0, '#FF4D3D'); grad.addColorStop(0.55, '#FF7A1A'); grad.addColorStop(1, '#FF9F1C');
  g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = 'rgba(255,255,255,0.13)';
  g.beginPath(); g.arc(950, 120, 190, 0, 7); g.fill();
  g.beginPath(); g.arc(80, 1240, 150, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '800 44px system-ui, sans-serif';
  g.fillText('LIFTOFF · MY WEEK', 540, 130);
  g.font = '900 92px system-ui, sans-serif';
  g.fillText(prof.name, 540, 260);
  g.font = '600 36px system-ui, sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.fillText('week of ' + U.fmtDateShort(r.from), 540, 320);
  // white stat card
  const rr = (x, y, w2, h, rad) => { g.beginPath(); g.roundRect(x, y, w2, h, rad); g.fill(); };
  g.fillStyle = 'rgba(255,255,255,0.96)'; rr(70, 380, 940, 420, 40);
  g.fillStyle = '#191C26';
  const stat = (x, big, small) => {
    g.font = '900 110px system-ui, sans-serif'; g.fillText(big, x, 560);
    g.font = '700 34px system-ui, sans-serif'; g.fillStyle = '#565B6B'; g.fillText(small, x, 620); g.fillStyle = '#191C26';
  };
  stat(250, String(r.lifts), 'lifts');
  stat(540, String(r.sport), 'sport days');
  stat(820, U.compact(r.vol), 'kg lifted');
  g.font = '700 40px system-ui, sans-serif'; g.fillStyle = '#565B6B';
  g.fillText(`${r.sets} sets logged`, 540, 730);
  // PBs
  g.fillStyle = 'rgba(255,255,255,0.96)'; rr(70, 840, 940, 330, 40);
  g.fillStyle = '#191C26'; g.font = '800 44px system-ui, sans-serif';
  g.fillText(r.pbs.length ? 'New personal bests' : 'Progress in the bank', 540, 920);
  g.font = '600 40px system-ui, sans-serif'; g.fillStyle = '#565B6B';
  if (r.pbs.length) r.pbs.slice(0, 3).forEach((p, i) => g.fillText(`${p.name} — ${p.w}kg`, 540, 990 + i * 58));
  else g.fillText('Every session logged is strength saved.', 540, 1000);
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.font = '700 34px system-ui, sans-serif';
  g.fillText('made with LiftOff — my pocket personal trainer', 540, 1280);
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  const file = new File([blob], 'liftoff-week.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'My LiftOff week' }); return; } catch (e) { /* cancelled */ }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'liftoff-week.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Recap image saved — share away!');
}

/* ---------- workout history: browse, fix, delete ---------- */
const REACT_LABELS = { great: 'Great', right: 'Just right', tough: 'Tough' };
const REACT_EMOJI = { great: 'star', right: 'check', tough: 'flame' };

function historyCardHtml(prof) {
  const logs = (prof.logs || []).slice().reverse();
  if (!logs.length) return '';
  const showAll = !!App._histAll;
  const list = showAll ? logs : logs.slice(0, 6);
  const rows = list.map(l => {
    const sets = l.entries.reduce((t, e) => t + e.sets.length, 0);
    const vol = l.entries.reduce((t, e) => t + e.sets.reduce((v, s) => v + (s.w || 0) * ((EX_BY_ID[e.exId] || {}).timed ? 0 : s.reps), 0), 0);
    return `<button class="pr-row" style="width:100%;text-align:left;cursor:pointer" data-a="hist-open" data-id="${l.id}">
      <span class="medal"></span>${U.esc(l.dayName)}${l.react ? ' ' + IC(REACT_EMOJI[l.react]) : ''}
      <span class="muted" style="margin-left:6px">${U.fmtDateShort(l.date)}</span>
      <span class="w" style="font-size:12px">${sets} ${U.plural(sets, 'set')} · ${U.compact(vol)}kg</span>
    </button>`;
  }).join('');
  return `<div class="card" id="hist-card"><div class="row"><h3>History</h3><span class="spacer"></span><span class="muted">${logs.length} ${U.plural(logs.length, 'session')}</span></div>
    <p class="muted mt8" style="font-size:12px">Tap a session to see every set — typos can be fixed there.</p>
    <div class="mt8">${rows}</div>
    ${logs.length > 6 ? `<button class="btn ghost sm block mt8" data-a="hist-more">${showAll ? 'Show fewer' : `Show all ${logs.length}`}</button>` : ''}
  </div>`;
}

function showHistorySheet(prof, logId) {
  const log = (prof.logs || []).find(l => l.id === logId);
  if (!log) { closeSheet(); return; }
  const ed = App._histEdit; // {ei, si} currently being edited
  const u = prof.units;
  const entries = log.entries.map((e, ei) => {
    const ex = EX_BY_ID[e.exId] || { name: e.exId, timed: false };
    const chips = e.sets.map((st, si) => {
      if (ed && ed.ei === ei && ed.si === si) {
        return `<span class="hist-editrow">
          ${ex.timed ? '' : `<input class="hist-in" id="hi-w" type="text" inputmode="decimal" value="${st.w > 0 ? U.fmtW(st.w, u) : ''}" placeholder="${U.unitLabel(u)}">×`}
          <input class="hist-in" id="hi-r" type="text" inputmode="numeric" value="${st.reps}" placeholder="${ex.timed ? 'sec' : 'reps'}">
          <button class="hist-ok" data-a="hist-commit" data-ei="${ei}" data-si="${si}">✓</button>
          <button class="hist-del" data-a="hist-delset" data-ei="${ei}" data-si="${si}" title="Remove this set"></button>
        </span>`;
      }
      const lbl = ex.timed ? `${st.reps}s` : `${st.w > 0 ? U.fmtW(st.w, u) : 'BW'}×${st.reps}`;
      return `<button class="hist-chip" data-a="hist-set" data-ei="${ei}" data-si="${si}">${lbl}</button>`;
    }).join('');
    return `<div class="mt12"><div style="font-weight:800;font-size:14px">${U.esc(ex.name)}</div>
      <div class="hist-sets mt8">${chips}</div></div>`;
  }).join('');
  showSheet(`<h3 style="font-size:19px;font-weight:900">${U.esc(log.dayName)}</h3>
    <p class="muted mt8">${U.fmtDate(log.date)} · ${log.durationMin} min${log.react ? ' · ' + REACT_LABELS[log.react] : ''}</p>
    ${log.note ? `<div class="coach-note" style="margin-top:8px">“${U.esc(log.note)}”</div>` : ''}
    <p class="muted" style="font-size:12px;margin-top:6px">Tap any set to fix it. Records and charts update automatically — next-time targets stay as they are.</p>
    ${entries}
    <button class="btn block mt16" style="background:#FBE9E7;color:#C0302C" data-a="hist-delses" data-id="${log.id}">Delete this session</button>
    <button class="btn ghost block mt8" data-a="sheet-close">Close</button>`);
}

function histAfterChange(prof, logId, msg) {
  rebuildDerived(prof);
  if (prof.coachSync) { prof.coachSync.pendingProgress = true; if (typeof syncTick === 'function') setTimeout(() => syncTick(true), 800); }
  saveApp();
  App._histEdit = null;
  if (logId) showHistorySheet(prof, logId); else closeSheet();
  render();
  if (msg) toast(msg);
}

function showRecordsSheet(prof, exId) {
  const r = exerciseRecords(prof, exId);
  const ex = r.ex; if (!ex) return;
  const u = prof.units, ul = U.unitLabel(u);
  const tile = (v, l) => `<div class="s"><div class="v" style="font-size:17px">${v}</div><div class="l">${l}</div></div>`;
  const tiles = ex.timed
    ? `<div class="sum-stats">${tile(r.bestHold ? r.bestHold.sec + 's' : '—', 'longest hold')}${tile(r.hist.length, 'sessions')}${tile('', '')}</div>`
    : `<div class="sum-stats">
        ${tile(r.bestSet ? U.fmtW(r.bestSet.w, u) + ul + '×' + r.bestSet.reps : '—', 'best set')}
        ${tile(r.bestE ? U.fmtW(r.bestE.v, u) + ul : '—', 'est. 1RM')}
        ${tile(r.bestVol ? U.compact(r.bestVol.v) + 'kg' : '—', 'best session')}
      </div>`;
  const rmx = !ex.timed ? `<div class="kicker mt16" style="margin-bottom:8px">Rep maxes — heaviest at each rep count</div>
    <div class="rmx">${[1, 3, 5, 10].map(n => {
      const m = r.repMax[n];
      return `<div class="c ${m ? '' : 'off'}"><div class="n">${n}RM</div><div class="v">${m ? U.fmtW(m.w, u) + ul : '—'}</div>${m ? `<div class="d">${U.fmtDateShort(m.date)}</div>` : ''}</div>`;
    }).join('')}</div>` : '';
  const chart = r.hist.length >= 2
    ? Charts.line([{ label: 'Top set', pts: r.hist.slice(-16).map(h => ({ x: U.fmtDateShort(h.date), y: u === 'lb' ? Math.round(h.topW * 2.20462 * 10) / 10 : h.topW })) }], { h: 140 })
    : '';
  const tl = r.timeline.length ? `<div class="kicker mt16" style="margin-bottom:8px">Record timeline</div>
    ${r.timeline.slice(0, 8).map(t => `<div class="pr-row"><span class="medal"></span>${U.fmtDateShort(t.date)}
      <span class="w">${U.fmtW(t.w, u)}${ul}${t.prev ? ` <small style="color:var(--good-text);font-weight:800">+${U.fmtW(t.w - t.prev, u)}</small>` : ''}</span></div>`).join('')}` : '';
  showSheet(`<h3 style="font-size:19px;font-weight:900">${U.esc(ex.name)}</h3>
    <p class="muted mt8" style="margin-bottom:12px">${r.hist.length} ${U.plural(r.hist.length, 'session')} logged</p>
    ${tiles}${chart ? `<div class="mt12">${chart}</div>` : ''}${rmx}${tl}
    <button class="btn ghost block mt16" data-a="sheet-close">Close</button>`);
}

/* ---------- v2 dispatch ---------- */
function v2Action(a, el, prof) {
  if (a === 'vault-open') { closeSheet(); showVaultSheet(prof); return true; }
  if (a === 'rec-open') { App._vidChoice = null; closeSheet(); showRecordsSheet(prof, el.dataset.ex); return true; }
  if (a === 'hist-open') { App._histEdit = null; App._histLog = el.dataset.id; closeSheet(); showHistorySheet(prof, el.dataset.id); return true; }
  if (a === 'hist-more') { App._histAll = !App._histAll; render(); return true; }
  if (a === 'hist-set') { App._histEdit = { ei: +el.dataset.ei, si: +el.dataset.si }; showHistorySheet(prof, App._histLog); return true; }
  if (a === 'hist-commit') {
    const log = (prof.logs || []).find(l => l.id === App._histLog); if (!log) return true;
    const st = log.entries[+el.dataset.ei].sets[+el.dataset.si];
    const ex = EX_BY_ID[log.entries[+el.dataset.ei].exId] || {};
    const wIn = document.getElementById('hi-w'), rIn = document.getElementById('hi-r');
    if (wIn) {
      const v = parseFloat((wIn.value || '').replace(',', '.'));
      st.w = isNaN(v) || v <= 0 ? 0 : Math.round(U.toKg(v, prof.units) * 100) / 100;
    }
    if (rIn) {
      const r = parseInt(rIn.value, 10);
      st.reps = U.clamp(isNaN(r) ? st.reps : r, 1, ex.timed ? 600 : 100);
    }
    histAfterChange(prof, App._histLog, 'Fixed ✓ — records updated');
    return true;
  }
  if (a === 'hist-delset') {
    const log = (prof.logs || []).find(l => l.id === App._histLog); if (!log) return true;
    const entry = log.entries[+el.dataset.ei];
    entry.sets.splice(+el.dataset.si, 1);
    if (!entry.sets.length) log.entries.splice(+el.dataset.ei, 1);
    if (!log.entries.length) {
      prof.logs = prof.logs.filter(l => l.id !== log.id);
      histAfterChange(prof, null, 'Session removed');
    } else histAfterChange(prof, App._histLog, 'Set removed — records updated');
    return true;
  }
  if (a === 'hist-delses') {
    const id = el.dataset.id;
    showConfirm('Delete this session?', 'It comes off your history, charts and records. Your plan and next-time targets stay as they are.', 'Keep it', 'Delete', ok => {
      if (!ok) {
        prof.logs = (prof.logs || []).filter(l => l.id !== id);
        histAfterChange(prof, null, 'Session deleted');
      }
    });
    return true;
  }
  if (a === 'sum-react') {
    const log = App._sumLog; if (!log) return true;
    log.react = log.react === el.dataset.v ? null : el.dataset.v;
    saveApp();
    document.querySelectorAll('[data-a="sum-react"]').forEach(c => c.classList.toggle('grad-on', c.dataset.v === log.react));
    return true;
  }
  if (a === 'msg-react') {
    prof.coachMsgReact = el.dataset.v;
    prof.coachMsgSeen = true;
    if (prof.coachSync) { prof.coachSync.pendingProgress = true; if (typeof syncTick === 'function') setTimeout(() => syncTick(true), 600); }
    saveApp(); render();
    toast(`Sent to ${prof.coachName || 'your coach'} ${el.dataset.v}`);
    return true;
  }
  if (a === 'trim-open') {
    showTrimSheet(prof, el.dataset.mode, el.dataset.idx !== '' ? +el.dataset.idx : null, el.dataset.id || null);
    return true;
  }
  if (a === 'trim-start') {
    const min = +el.dataset.min;
    const mode = el.dataset.mode, id = el.dataset.id, idx = +el.dataset.idx;
    closeSheet();
    guardPausedThen(prof, () => {
      Sound.unlock(); WakeLock.on();
      if (mode === 'custom') startCustomWorkout(prof, id, min);
      else startWorkout(prof, idx, min);
      render();
      toast(`Trimmed to ~${min} min — every set still counts`);
    });
    return true;
  }
  if (a === 'deload-start') {
    startDeloadWeek(prof); saveApp(); render();
    toast('Easy week on — lighter weights, fewer sets, full credit');
    return true;
  }
  if (a === 'share-week') { shareRecap(prof); return true; }
  if (a === 'body-log') {
    const inp = document.getElementById('body-w');
    const num = parseFloat((inp.value || '').replace(',', '.'));
    if (isNaN(num) || num <= 20 || num > 400) { toast('Pop a number in first'); return true; }
    const kg = Math.round(U.toKg(num, prof.units) * 10) / 10;
    prof.bodyLogs = prof.bodyLogs || [];
    const today = U.todayISO();
    const ex = prof.bodyLogs.find(b => b.date === today);
    if (ex) ex.w = kg; else prof.bodyLogs.push({ date: today, w: kg });
    saveApp(); render();
    toast('Logged — trend over wiggles, always');
    return true;
  }
  if (a === 'pref-fav' || a === 'pref-ban') {
    const exId = el.dataset.ex;
    const cur = exPref(prof, exId);
    const want = a === 'pref-fav' ? 'fav' : 'ban';
    setExPref(prof, exId, cur === want ? null : want);
    saveApp();
    App._vidChoice = null;
    showExerciseSheet(exId, prof);
    toast(exPref(prof, exId) === 'fav' ? 'Favourited — you’ll see it more' :
      exPref(prof, exId) === 'ban' ? 'Noted — the plan will avoid it' : 'Preference cleared');
    return true;
  }
  return false;
}

        return `<div class="pr-row"><span class="medal">${l.react ? IC(REACT_EMOJI[l.react]) : ''}</span>${U.esc(l.dayName)}${l.note ? ` <span class="muted" style="font-size:11.5px">“${U.esc(l.note.slice(0, 32))}${l.note.length > 32 ? '…' : ''}”</span>` : ''}<span class="muted" style="margin-left:6px">${U.fmtDateShort(l.date)}</span><span class="w" style="font-size:12px">${U.esc(top || l.durationMin + ' min')}</span></div>`;

/* ============ day moves — "life happened" reschedule/skip, both sides ============ */
function _wdISOThisWeek(d) {
  const mon = U.parseISO(U.weekKey(U.todayISO()));
  const dt = new Date(mon); dt.setDate(mon.getDate() + d);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function _dmLogs(prof) { // whose training log tells us a day is done
  return prof.isCoach ? ((prof.coachOf && prof.coachOf.progress && prof.coachOf.progress.logs) || []) : (prof.logs || []);
}

/* pick which session to adjust: every base lift day this week with its status */
function showWeekAdjustSheet(prof) {
  const sched = prof.quiz.weekSchedule || {};
  const mv = movesThisWeek(prof);
  const logs = _dmLogs(prof);
  const t = todayWeekday();
  const isCoach = !!prof.isCoach;
  const rows = [];
  for (let d = 0; d < 7; d++) {
    if ((sched[d] || 'rest') !== 'lift') continue;
    const w4d = workoutForWeekday(prof, d);
    const e = mv[d];
    const effDay = e && e.to != null ? e.to : d;
    const done = e && e.to == null ? false : logs.some(l => l.date === _wdISOThisWeek(effDay));
    const status = done ? '✓ done' : e ? (e.to == null ? 'skipped' : `→ ${WEEKDAYS[e.to]} ↷`) : (d < t ? 'was planned' : d === t ? 'today' : 'planned');
    rows.push(`<button class="prof-row" style="width:100%;text-align:left" data-a="dm-day-open" data-from="${d}" ${done ? 'disabled style="width:100%;text-align:left;opacity:.5"' : ''}>
      <span class="em" style="border-radius:14px;font-size:17px">${done ? '' : e ? (e.to == null ? '' : '↷') : ''}</span>
      <span style="flex:1;min-width:0"><div class="nm">${WEEKDAYS_FULL[d]}</div>
      <div class="meta">${U.esc((w4d || {}).name || 'Lift')} · ${status}</div></span>
      ${done ? '' : '<span class="muted" style="font-size:18px">›</span>'}
    </button>`);
  }
  showSheet(`<h3 style="font-size:19px;font-weight:900">Adjust this week</h3>
    <p class="muted mt8" style="margin-bottom:10px">${isCoach ? `Move or skip one of ${U.esc((prof.coachOf || {}).athleteName || 'their')}’s sessions — this week only, the plan itself stays put.` : 'Can’t make a day? Move it or skip it — this week only, next week runs as normal.'}</p>
    ${rows.join('') || '<p class="muted">No lift days on the schedule this week.</p>'}
    <button class="btn ghost block mt8" data-a="sheet-close">Done</button>`);
}

/* move/skip one day: free-day targets + skip + optional note + undo */
function showMoveDaySheet(prof, fromWd) {
  const isCoach = !!prof.isCoach;
  const t = todayWeekday();
  const mv = movesThisWeek(prof);
  const e = mv[fromWd];
  const w4d = workoutForWeekday(prof, fromWd);
  const name = (w4d || {}).name || 'this session';
  const targets = [];
  for (let d = 0; d < 7; d++) {
    if (d === fromWd || d < t) continue;
    if ((effActivityOn(prof, d) || 'rest') !== 'rest') continue;
    targets.push(d);
  }
  const whoSees = isCoach
    ? `Syncs to ${U.esc((prof.coachOf || {}).athleteName || 'their')}’s phone — they’ll see it on their Today screen.`
    : (prof.coachSync ? 'Your coach will see this, including your note.' : 'Just for this week — next week is untouched.');
  showSheet(`<h3 style="font-size:19px;font-weight:900">${isCoach ? `Adjust ${WEEKDAYS_FULL[fromWd]}` : (fromWd === t ? 'Can’t train today?' : `Can’t make ${WEEKDAYS_FULL[fromWd]}?`)}</h3>
    <p class="muted mt8" style="margin-bottom:4px"><b>${U.esc(name)}</b> · ${WEEKDAYS_FULL[fromWd]}${e ? (e.to == null ? ' · currently skipped' : ` · currently moved to ${WEEKDAYS_FULL[e.to]}`) : ''}</p>
    <p class="muted" style="font-size:12px;margin-bottom:10px">${whoSees}</p>
    <input class="ob-input" id="dm-note" maxlength="140" placeholder="Optional note — e.g. work ran over" autocomplete="off" style="margin-bottom:10px">
    ${targets.length ? targets.map(d => `<button class="btn ghost block mt8" data-a="dm-move" data-from="${fromWd}" data-to="${d}">↷ Move to ${WEEKDAYS_FULL[d]}${d === t ? ' (today)' : ''}</button>`).join('')
      : '<p class="muted" style="font-size:12.5px">No free days left this week to move it to — you can still skip it.</p>'}
    <button class="btn block mt8" style="background:#FBE9E7;color:#C0302C" data-a="dm-skip" data-from="${fromWd}">Skip it this week</button>
    ${e ? `<button class="btn ghost block mt8" data-a="dm-undo" data-from="${fromWd}">↩ Undo — back to ${WEEKDAYS_FULL[fromWd]}</button>` : ''}
    <button class="btn ghost block mt8" data-a="sheet-close">Cancel</button>`);
}

function dmAction(a, el, prof) {
  const by = prof.isCoach ? 'coach' : 'athlete';
  const after = msg => {
    closeSheet();
    if (prof.isCoach) coachMaybeDirty(prof);
    else if (prof.coachSync) { prof.coachSync.pendingProgress = true; setTimeout(() => syncTick(true), 600); }
    saveApp(); render();
    toast(msg);
  };
  if (a === 'dm-cant-open') {
    const t = todayWeekday();
    const src = moveTargetsThisWeek(prof)[t];
    showMoveDaySheet(prof, src != null ? src : t);
    return;
  }
  if (a === 'dm-adjust-open') { showWeekAdjustSheet(prof); return; }
  if (a === 'dm-day-open') { showMoveDaySheet(prof, +el.dataset.from); return; }
  const noteEl = document.getElementById('dm-note');
  const note = noteEl ? noteEl.value.trim() : '';
  if (a === 'dm-move') {
    setDayMove(prof, +el.dataset.from, +el.dataset.to, note, by);
    after(`Moved to ${WEEKDAYS_FULL[+el.dataset.to]} ↷ — this week only${prof.isCoach ? ' · syncing to their phone' : prof.coachSync ? ' · your coach will see it' : ''}`);
    return;
  }
  if (a === 'dm-skip') {
    setDayMove(prof, +el.dataset.from, null, note, by);
    after(`Skipped this week — next week runs as normal${prof.isCoach ? ' · syncing to their phone' : prof.coachSync ? ' · your coach will see it' : ''}`);
    return;
  }
  if (a === 'dm-undo') {
    clearDayMove(prof, +el.dataset.from, by);
    after('Change undone ↩ — back to the usual plan');
    return;
  }
}

/* ---------- dispatch ---------- */
function coachAction(a, el, prof) {
  if (a === 'co-start') { showCoachCreateSheet(prof); return true; }
  if (a === 'co-open') {
    App.data.activeProfileId = el.dataset.id;
    App.view = 'today'; closeSheet(); saveApp(); render();
    syncTick(true);
    return true;
  }
  if (a === 'co-myprofile') {
    const mine = Object.values(App.data.profiles).find(p => !p.isCoach);
    if (mine) { App.data.activeProfileId = mine.id; App.view = 'today'; saveApp(); render(); }
    return true;
  }
  if (a === 'co-create') {
    const athlete = (document.getElementById('co-ath-name').value || '').trim();
    const myName = (document.getElementById('co-my-name').value || '').trim() || prof.name;
    if (!athlete) { toast('Pop their name in first'); return true; }
    if (navigator.onLine === false) { toast('Need internet to set up the link — try again when online'); return true; }
    const key = makePairKey();
    const btn = el; btn.disabled = true; btn.textContent = 'Creating…';
    syncRpc('lo_create_pair', { p_key: key, p_coach: myName, p_athlete: athlete }).then(ok => {
      if (!ok) { btn.disabled = false; btn.textContent = 'Create coaching link →'; toast('Hmm, that didn’t work — try again'); return; }
      const id = U.uid();
      App.data.profiles[id] = {
        id, name: `${athlete} (coaching)`, emoji: 'user', createdAt: U.todayISO(), planCount: 0,
        units: 'kg', logs: [], sportLogs: [], exState: {}, prs: {}, customWorkouts: [], customMap: {},
        exPrefs: {}, badges: {}, bodyLogs: [], barKg: 20, isCoach: true,
        coachDisplayName: myName, coachMsg: '',
        coachOf: { key, athleteName: athlete, pendingPlanPush: false, progressRev: 0 },
        quiz: { goal: 'muscle', experience: 'beginner', daysPerWeek: 3, sessionMinutes: 60,
          equipment: ['barbell', 'dumbbell', 'machine', 'cable', 'bodyweight', 'bench'], focus: [],
          athleteType: 'gym', sportLabel: '', weekSchedule: scheduleFromDays(3), videoPref: 'auto' },
      };
      migrateProfile(App.data.profiles[id]);
      App.data.profiles[id].plan = generatePlan(App.data.profiles[id]);
      App.data.activeProfileId = id;
      App.view = 'today';
      saveApp(); render();
      showPairCodeSheet(App.data.profiles[id].coachOf);
    }).catch(() => { btn.disabled = false; btn.textContent = 'Create coaching link →'; toast('Couldn’t reach the sync service — check your connection'); });
    return true;
  }
  if (a === 'co-showcode') { showPairCodeSheet(prof.coachOf); return true; }
  if (a === 'co-copy') {
    const txt = `You've got a coach! Open LiftOff → Profile → "I have a coach code" and enter:\n${fmtPairKey((prof.coachOf || {}).key || '')}\n${location.origin.startsWith('http') ? location.origin + location.pathname : ''}`;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied — send it over'))
      .catch(() => { const c = document.getElementById('co-code'); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Select + copy the code above'); });
    return true;
  }
  if (a === 'co-sharecode') {
    navigator.share({ title: 'LiftOff coach code', text: `You've got a coach! Open LiftOff → Profile → "I have a coach code" and enter: ${fmtPairKey((prof.coachOf || {}).key || '')}` }).catch(() => {});
    return true;
  }
  if (a === 'co-pair-open') { showEnterCodeSheet(); return true; }
  if (a === 'co-pair') {
    const key = normalizePairKey(document.getElementById('co-pair-key').value);
    if (!key) { toast('That code doesn’t look complete — check it and try again'); return true; }
    if (navigator.onLine === false) { toast('Need internet to pair — try again when online'); return true; }
    const btn = el; btn.disabled = true; btn.textContent = 'Checking…';
    syncRpc('lo_revs', { p_key: key }).then(revs => {
      if (!revs) { btn.disabled = false; btn.textContent = 'Pair up'; toast('Code not recognised — double-check with your coach'); return; }
      prof.coachSync = { key, coachName: revs.coach || 'Your coach', appliedPlanRev: 0, pendingProgress: true };
      saveApp(); closeSheet(); render();
      toast(`Paired with ${revs.coach || 'your coach'}`);
      syncTick(true);
    }).catch(() => { btn.disabled = false; btn.textContent = 'Pair up'; toast('Couldn’t reach the sync service — check your connection'); });
    return true;
  }
  if (a === 'co-apply-plan') {
    const p = prof.pendingCoachPlan;
    if (p && applyPlanDoc(prof, p.doc, p.rev)) {
      prof.pendingCoachPlan = null;
      if (prof.coachSync) prof.coachSync.pendingProgress = true; // ack the rev back
      saveApp(); render();
      Confetti.burst(90);
      toast(`New plan from ${prof.coachName || 'your coach'} is on`);
      syncTick(true);
    } else { toast('Hmm, that plan looked empty — ask your coach to resend'); }
    return true;
  }
  if (a === 'co-apply-later') { App._planSnooze = prof.pendingCoachPlan ? prof.pendingCoachPlan.rev : 0; render(); return true; }
  if (a === 'co-dismiss-msg') { prof.coachMsgSeen = true; saveApp(); render(); return true; }
  if (a === 'co-msg-save') {
    const t = document.getElementById('co-msg');
    prof.coachMsg = (t.value || '').slice(0, 500);
    coachMaybeDirty(prof); saveApp(); render();
    toast(prof.coachMsg ? 'Message will appear on their Today screen' : 'Message cleared');
    return true;
  }
  if (a === 'co-load-herplan') {
    const pg = prof.coachOf && prof.coachOf.progress;
    if (pg && pg.plan && pg.plan.days && pg.plan.days.length) {
      prof.plan.days = pg.plan.days.map(d => ({ name: d.name, focus: d.focus || null, note: d.note || '',
        exercises: (d.exercises || []).map(sanitizePe).filter(Boolean) })).filter(d => d.exercises.length);
      prof.plan.daysPerWeek = pg.plan.daysPerWeek || prof.plan.days.length;
      prof.plan.dayMap = assignDayMap(prof.plan, prof.quiz.weekSchedule);
      prof.coachOf.loadedHerPlan = true;
      prof.coachOf.lastPushedJson = JSON.stringify(buildPlanDoc(prof)); // loading isn't a change to send back
      saveApp(); render();
      toast(`${pg.name}’s current plan loaded — tweak away`);
    }
    return true;
  }
  if (a === 'co-sync-now') {
    toast('Syncing… ↻');
    syncTick(true).then(() => { render(); const t = prof.coachOf || prof.coachSync; toast(t && t.lastErr ? 'Couldn’t reach sync — will keep trying' : 'Up to date ✓'); });
    return true;
  }
  if (a === 'co-unpair') {
    const isCoach = !!prof.isCoach;
    showConfirm(isCoach ? 'End coaching link?' : 'Unpair from your coach?',
      isCoach ? 'Sync stops both ways and the shared data is deleted. Their app keeps working with the last plan you sent.'
              : 'Your coach will stop getting your progress and can no longer update your plan. Your current plan and all your data stay.',
      'Keep it', isCoach ? 'End link' : 'Unpair', ok => {
        if (ok) return;
        const key = isCoach ? prof.coachOf.key : prof.coachSync.key;
        syncRpc('lo_delete_pair', { p_key: key }).catch(() => {});
        if (isCoach) {
          delete App.data.profiles[prof.id];
          App.data.activeProfileId = Object.keys(App.data.profiles)[0] || null;
        } else {
          prof.coachSync = null; prof.pendingCoachPlan = null;
        }
        saveApp(); render();
        toast(isCoach ? 'Coaching link ended' : 'Unpaired — it’s all yours again');
      });
    return true;
  }
  return false;
}


/* ============ LiftOff v2.7 — mobility UI: warm-up/cooldown cards + relief tool ============ */
'use strict';

/* ---------- shared stretch row with tap-to-run countdown ---------- */
let _mobIv = null;
function stopMobTimer() { if (_mobIv) { clearInterval(_mobIv); _mobIv = null; } }

function mobRowHtml(sid, done, ctx, i) {
  const s = STRETCH_BY_ID[sid]; if (!s) return '';
  const dur = s.t ? `${s.t}s${s.side ? '/side' : ''}` : `${s.reps}${s.side ? '/side' : ' reps'}`;
  return `<div class="mob-row ${done ? 'done' : ''}">
    <div class="mob-info"><div class="nm">${U.esc(s.name)}</div><div class="cue">${U.esc(s.cue)}</div></div>
    ${s.t
      ? `<button class="mob-go" data-a="mob-hold" data-ctx="${ctx}" data-i="${i}" data-sid="${sid}"><span id="mob-${ctx}-${i}">${done ? '✓' : '▶ ' + dur}</span></button>`
      : `<button class="mob-go ${done ? 'on' : ''}" data-a="mob-tick" data-ctx="${ctx}" data-i="${i}">${done ? '✓' : dur}</button>`}
  </div>`;
}

/* ---------- workout warm-up / cooldown cards ---------- */
function ensureMobility(w) {
  if (!w.wu) {
    const exs = w.entries.map(e => e.plan || { exId: e.exId });
    w.wu = warmupRoutineFor(exs).map(sid => ({ sid, done: false }));
    w.cd = cooldownRoutineFor(exs).map(sid => ({ sid, done: false }));
    const p = activeProfile(); if (p && p.activeWorkout === w) saveApp();
  }
}
function warmupCardHtml(w) {
  ensureMobility(w);
  if (!w.wu.length) return '';
  const open = !App._wuCollapsed && !w.wu.every(x => x.done);
  const doneN = w.wu.filter(x => x.done).length;
  return `<div class="card mob-card">
    <button class="row mob-head" data-a="mob-collapse" data-k="wu" style="width:100%;text-align:left">
      <h3>Warm-up</h3><span class="spacer"></span>
      <span class="muted">${doneN === w.wu.length ? 'done ✓' : `~${routineMinutes(w.wu.map(x => x.sid))} min · for today's muscles`} ${open ? '▾' : '▸'}</span>
    </button>
    ${open ? `<div class="mt8">${w.wu.map((x, i) => mobRowHtml(x.sid, x.done, 'wu', i)).join('')}</div>` : ''}
  </div>`;
}
function cooldownCardHtml(w) {
  ensureMobility(w);
  if (!w.cd.length) return '';
  const open = !!App._cdOpen;
  const doneN = w.cd.filter(x => x.done).length;
  return `<div class="card mob-card">
    <button class="row mob-head" data-a="mob-collapse" data-k="cd" style="width:100%;text-align:left">
      <h3>Cooldown</h3><span class="spacer"></span>
      <span class="muted">${doneN === w.cd.length && doneN ? 'done ✓' : `~${routineMinutes(w.cd.map(x => x.sid))} min · stretch what you worked`} ${open ? '▾' : '▸'}</span>
    </button>
    ${open ? `<div class="mt8">${w.cd.map((x, i) => mobRowHtml(x.sid, x.done, 'cd', i)).join('')}</div>` : ''}
  </div>`;
}

/* ---------- relief tool ---------- */
function reliefEntryCardHtml(prof) {
  let nudge = '';
  try {
    const fr = muscleFreshness(prof);
    const hot = Object.entries(fr).filter(([m, v]) => v >= 0.5 && MUSCLES[m]).sort((a, b) => b[1] - a[1])[0];
    if (hot) {
      const grp = MUSCLES[hot[0]].group;
      nudge = ` ${GROUP_LABELS[grp] || grp} worked hard recently — a few minutes would go down well.`;
    }
  } catch (e) { /* nudge is optional */ }
  return `<div class="card">
    <div class="row"><h3>Feeling tight or sore?</h3></div>
    <p class="muted mt8" style="font-size:13px">Pick the spot and get the right stretches and advice.${U.esc(nudge)}</p>
    <button class="btn ghost sm mt8" data-a="mob-open">Find relief</button>
  </div>`;
}
function showReliefSheet(areaId) {
  stopMobTimer();
  if (!areaId) {
    showSheet(`<h3 style="font-size:19px;font-weight:900">Where’s feeling it?</h3>
      <p class="muted mt8" style="margin-bottom:12px">Tight, achy or post-workout sore — pick the area.</p>
      <div class="relief-grid">
        ${RELIEF_AREAS.map(a => `<button class="relief-cell" data-a="mob-area" data-id="${a.id}">
          <span class="lb">${U.esc(a.label)}</span></button>`).join('')}
      </div>`);
    return;
  }
  const r = reliefFor(areaId);
  if (!r) return;
  App._reliefRuns = {}; // per-open tick state
  showSheet(`<button class="switchback" data-a="mob-open" style="padding-bottom:6px">↩ All areas</button>
    <h3 style="font-size:19px;font-weight:900">${U.esc(r.area.label)}</h3>
    <p class="mt8" style="font-size:13.5px;line-height:1.55;color:var(--ink2)">${U.esc(r.advice)}</p>
    <div class="kicker mt16" style="margin-bottom:6px">Stretch it out — slow breaths, no forcing</div>
    ${r.stretches.map((s, i) => mobRowHtml(s.id, false, 'rl', i)).join('')}
    ${r.mover ? `<div class="kicker mt12" style="margin-bottom:6px">Then get it moving</div>${mobRowHtml(r.mover.id, false, 'rl', 99)}` : ''}
    <div class="coach-note mt12" style="font-size:12.5px">${U.esc(r.redflag)}</div>
    <button class="btn ghost block mt12" data-a="sheet-close">Done</button>`);
  App._reliefArea = areaId;
}

/* ---------- dispatch ---------- */
function mobAction(a, el, prof) {
  const w = App.workout;
  const list = ctx => ctx === 'wu' ? (w && w.wu) : ctx === 'cd' ? (w && w.cd) : null;
  if (a === 'mob-open') { closeSheet(); showReliefSheet(null); return true; }
  if (a === 'mob-area') { showReliefSheet(el.dataset.id); return true; }
  if (a === 'mob-collapse') {
    if (el.dataset.k === 'wu') App._wuCollapsed = !App._wuCollapsed;
    else App._cdOpen = !App._cdOpen;
    render(); return true;
  }
  if (a === 'mob-tick') {
    const arr = list(el.dataset.ctx);
    if (arr) {
      const it = arr[+el.dataset.i];
      it.done = !it.done;
      if (prof && w) { prof.activeWorkout = w; saveApp(); }
      render();
    } else { // relief sheet rep-move: just mark the button
      el.classList.add('on'); el.textContent = '✓';
    }
    return true;
  }
  if (a === 'mob-hold') {
    if (_mobIv) return true; // one at a time
    const ctx = el.dataset.ctx, i = +el.dataset.i, sid = el.dataset.sid;
    const s = STRETCH_BY_ID[sid]; if (!s) return true;
    Sound.unlock();
    const span = document.getElementById(`mob-${ctx}-${i}`);
    const sides = s.side ? 2 : 1;
    let side = 1, left = s.t;
    el.classList.add('running');
    _mobIv = setInterval(() => {
      const sp = document.getElementById(`mob-${ctx}-${i}`);
      if (!sp) { stopMobTimer(); return; } // view changed
      left--;
      if (left <= 3 && left > 0) Sound.tick();
      if (left <= 0) {
        if (side < sides) {
          side++; left = s.t;
          Sound.timerDone();
          sp.textContent = `side 2 · ${left}s`;
          return;
        }
        stopMobTimer();
        Sound.timerDone();
        el.classList.remove('running');
        const arr = list(ctx);
        if (arr && arr[i]) {
          arr[i].done = true;
          if (prof && w) { prof.activeWorkout = w; saveApp(); }
          render();
        } else { sp.textContent = '✓'; el.classList.add('on'); }
        return;
      }
      sp.textContent = (sides === 2 ? `side ${side} · ` : '') + left + 's';
    }, 1000);
    span.textContent = (sides === 2 ? 'side 1 · ' : '') + left + 's';
    return true;
  }
  return false;
}


/* ============ LiftOff — boot ============ */
'use strict';

function afterRender(prof) {
  if (App.view === 'progress') Charts.bindTips($app());
  window.requestAnimationFrame(() => {}); // let layout settle
}

document.body.addEventListener('click', dispatch);

document.body.addEventListener('change', e => {
  if (e.target && e.target.id === 'chart-ex') { App.chartEx = e.target.value; render(); }
});
document.body.addEventListener('input', e => {
  if (e.target && e.target.id === 'lib-q') {
    App.libFilter.q = e.target.value;
    const prof = activeProfile();
    const host = document.getElementById('lib-body');
    if (host && prof) host.innerHTML = libBodyHtml(prof); // swaps grid ⇄ search results, keeps input focus
  }
});

// keep the wake lock friendly: prevent accidental pull-to-refresh while logging is fine (browser handles)
window.addEventListener('beforeunload', () => { if (_saveT) { clearTimeout(_saveT); Store.save(App.data); } });

loadApp();
render();
if (App.workout && App.workout.restEndTs && typeof resumeRest === 'function') resumeRest();

// keep the day current: if the app is left open across midnight, refresh Today
// when it regains focus (and hourly) so it never shows a stale/completed day
let _dayStamp = U.todayISO();
function refreshIfNewDay() {
  const now = U.todayISO();
  if (now !== _dayStamp && !App.workout) { _dayStamp = now; render(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshIfNewDay(); });
setInterval(refreshIfNewDay, 15 * 60 * 1000);
// rest-timer push: if notifications are already allowed, make sure this device
// has a push subscription (covers users who granted before v3.9)
if (typeof ensurePushSub === 'function') setTimeout(() => ensurePushSub(), 2500);
// coach sync: check on boot, on regaining focus/network, and gently in the background
if (typeof syncTick === 'function') {
  setTimeout(() => syncTick(true), 900);
  window.addEventListener('online', () => syncTick(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTick(); });
  setInterval(() => { if (document.visibilityState === 'visible') syncTick(); }, 300000);
}
if (App.justUpdated) setTimeout(() => toast('LiftOff updated to v' + APP_VERSION + ' — all your data came along', 3200), 600);

</script>
<script>
// PWA: offline shell + home-screen install + seamless auto-update (https only)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // when a freshly-installed SW takes control, refresh once so the running app
  // becomes the new version (skip the very first install, which is already fresh)
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !hadController) return;
    reloaded = true;
    location.reload();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => { reg.update().catch(() => {}); };
      check();                                    // check for a new version on launch
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 30 * 60 * 1000);         // and every 30 min while open
    }).catch(() => {});
  });
}
</script>
